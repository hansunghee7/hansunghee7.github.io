<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>글쓰기 (Sveltia 테스트) - Simplifier</title>
  <link rel="icon" href="data:," />
  <script>
    // Sveltia는 스크립트를 읽는 즉시 스스로 초기화하면서 화면을 점유합니다.
    // 그러면 그 뒤에 오는 우리 스크립트(커스텀 버튼 등록)가 실행될 기회를
    // 잃어버립니다. 그래서 자동 초기화를 꺼두고, 아래에서 버튼을 먼저 등록한
    // 다음 CMS.init()을 직접 호출합니다. (공식 문서의 CMS_MANUAL_INIT 방식)
    window.CMS_MANUAL_INIT = true;
  </script>
  <style>
    /* 지금 보고 있는 게 테스트 화면이라는 걸 잊지 않도록 하는 표시.
       pointer-events:none 이라 실제 조작을 가로막지 않습니다. */
    #sandbox-badge {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 2147483647;
      pointer-events: none;
      background: #b45309;
      color: #fff;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 6px 10px;
      border-radius: 6px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <!-- Sveltia CMS 테스트판.
       실제 운영 화면은 /admin/ (Decap CMS)이고 이 페이지는 거기에 영향을 주지 않습니다.
       내용은 cms-test 브랜치를 보기 때문에, 여기서 저장해도 홈페이지에는 안 나갑니다.
       버전을 ^0.200.0으로 묶어둔 이유: Sveltia는 아직 0.x라 릴리스가 잦아서,
       평가하는 동안 화면이 저절로 바뀌지 않게 하기 위함입니다. -->
  <script src="https://unpkg.com/@sveltia/cms@^0.200.0/dist/sveltia-cms.js"></script>
  <script>
    // AIO 키워드 칸에 붙는 "제목+본문 프롬프트 복사" 버튼 (Sveltia 판).
    //
    // Decap판과 같은 기능이지만 훨씬 단단합니다. Decap은 커스텀 위젯에 글 전체
    // 데이터를 안 넘겨줘서 화면에 그려진 입력칸을 라벨 텍스트로 뒤져 값을
    // 읽어와야 했는데, Sveltia는 control에 entry prop을 넘겨주기 때문에
    // 제목/본문을 정식 경로로 바로 꺼낼 수 있습니다.
    function copyTextToClipboard(text, onDone) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { onDone(true); },
          function () { onDone(legacyCopy(text)); }
        );
      } else {
        onDone(legacyCopy(text));
      }
    }

    function legacyCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    var AioCopyControl = createClass({
      getInitialState: function () {
        return { status: "idle" };
      },
      handleTextChange: function (e) {
        this.props.onChange(e.target.value);
      },
      reset: function () {
        this.setState({ status: "idle" });
      },
      handleCopy: function () {
        var entry = this.props.entry;
        var title = (entry && entry.getIn(["data", "title"])) || "";
        var body = (entry && entry.getIn(["data", "body"])) || "";
        if (!body) {
          this.setState({ status: "empty" });
          setTimeout(this.reset, 3000);
          return;
        }
        var prompt = [
          "다음은 블로그 글의 제목과 본문이야. 이 글을 분석해서 아래 두 가지를 만들어줘.",
          "1) SEO 키워드 5~8개 (쉼표로 구분된 한 줄)",
          "2) 이 글의 핵심 주제를 나타내는 5~10단어 이내의 짧은 문구",
          "",
          "제목: " + title,
          "",
          "본문:",
          body,
        ].join("\n");
        var self = this;
        copyTextToClipboard(prompt, function (ok) {
          self.setState({ status: ok ? "copied" : "failed" });
          setTimeout(self.reset, 3000);
        });
      },
      render: function () {
        var label =
          this.state.status === "copied"
            ? "복사 완료! Claude/ChatGPT에 붙여넣으세요"
            : this.state.status === "empty"
            ? "본문을 먼저 써주세요"
            : this.state.status === "failed"
            ? "복사 실패 — 직접 선택해서 복사해주세요"
            : "📋 제목+본문 프롬프트 복사";
        return h(
          "div",
          {},
          h("input", {
            id: this.props.forID,
            className: this.props.classNameWrapper,
            type: "text",
            value: this.props.value || "",
            onChange: this.handleTextChange,
          }),
          h(
            "button",
            {
              type: "button",
              onClick: this.handleCopy,
              style: {
                marginTop: "6px",
                padding: "5px 10px",
                fontSize: "12px",
                cursor: "pointer",
                border: "1px solid #ccc",
                borderRadius: "4px",
                background: this.state.status === "idle" ? "#f5f5f5" : "#e6f7e6",
              },
            },
            label
          )
        );
      },
    });

    var AioCopyPreview = createClass({
      render: function () {
        return h("div", {}, this.props.value);
      },
    });

    CMS.registerWidget("aio-copy-assist", AioCopyControl, AioCopyPreview);

    // 버튼 등록이 끝난 뒤에 CMS를 띄웁니다(위 CMS_MANUAL_INIT과 한 쌍).
    CMS.init();
  </script>
  <div id="sandbox-badge">테스트 화면 · cms-test 브랜치 · 실제 사이트 영향 없음</div>
</body>
</html>
