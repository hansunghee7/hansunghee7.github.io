# 이 파일은 Sveltia CMS를 "구경만 해보기" 위한 테스트용 설정입니다.
# 실제 운영은 /admin/ (Decap CMS)이고, 이 파일은 거기에 아무 영향도 주지 않습니다.
# 다 보고 나서 필요 없으면 admin-next 폴더째로 지우면 끝입니다.

backend:
  name: github
  repo: hansunghee7/hansunghee7.github.io
  # ★ 안전장치: 실제 사이트가 쓰는 main이 아니라 테스트용 cms-test 브랜치를 봅니다.
  #   그래서 여기서 글을 저장해도 홈페이지에는 절대 반영되지 않습니다.
  branch: cms-test
  # /admin/과 똑같은 Cloudflare 로그인 서버를 그대로 씁니다.
  # (Sveltia 공식 문서: Decap/Netlify용 OAuth 클라이언트는 수정 없이 그대로 동작)
  base_url: https://simplifier-cms-auth.simon-8be.workers.dev

publish_mode: simple
media_folder: "log_assets/images"
public_folder: "/log_assets/images"

collections:
  - name: "posts"
    label: "Log 글"
    label_singular: "글"
    folder: "log_assets/markdown"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{date_string}}"
    sortable_fields:
      - { field: date, default_sort: desc }
      - title
      - commit_date
    format: "yaml-frontmatter"
    fields:
      - { name: "layout", label: "레이아웃", widget: "hidden", default: "default" }

      - name: "title"
        label: "제목"
        widget: "string"
        hint: "홈페이지 카드/탭 제목에 그대로 노출됩니다."

      - name: "body"
        label: "본문"
        widget: "markdown"

      - name: "category"
        label: "카테고리"
        widget: "select"
        options:
          - "AI의 언어들"
          - "Be the PO"
          - "PO의 프레임웍"
          - "UX의 언어들"
          - "기획일상"
          - "기획자의 프레임웍"
          - "대한민국 스타트업 미국진출을 묻다"
          - "스타트업 인사이트"
          - "심플리파이어 라이프"
          - "이력서에 쓰지 않는 첫직장 이야기"
          - "잉크드인대 기획학과"
          - "코치S"
          - "토크세션"

      - name: "image"
        label: "커버 이미지"
        widget: "image"
        hint: "글 상단 배경과 로그 카드 썸네일에 같이 쓰입니다."

      - name: "date"
        label: "발행일"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - name: "date_string"
        label: "발행일 표시 텍스트"
        widget: "hidden"
        required: false
        hint: "자동으로 채워집니다 (예: Aug 25. 2026). 직접 안 써도 됩니다."

      # AIO 복사 버튼. Sveltia도 registerWidget을 (registerFieldType의 별칭으로)
      # 그대로 지원하고, 게다가 control에 entry(글 전체 데이터)를 넘겨주기 때문에
      # Decap판보다 오히려 단순하고 안정적으로 구현했습니다. index.html 참고.
      - name: "keywords"
        label: "AIO 키워드"
        widget: "aio-copy-assist"
        required: false
        hint: "쉼표로 구분. 검색엔진/AI용, 화면에 안 보입니다. 본문 다 쓰신 뒤 아래 복사 버튼을 눌러 Claude/ChatGPT에 붙여넣고, 받은 키워드를 여기 입력하세요."

      - name: "about"
        label: "AIO 주제어"
        widget: "string"
        required: false

      - name: "published"
        label: "공개 여부"
        widget: "boolean"
        default: true
        hint: "꺼두면 초안 상태로 저장되고 홈페이지 어디에도 노출되지 않습니다."

      - name: "channel_variants"
        label: "채널별 발행 텍스트 (선택)"
        widget: "object"
        collapsed: false
        required: false
        hint: "비워두면 그 채널엔 이 글을 안 보냅니다."
        fields:
          - name: "linkedin_threads"
            label: "LinkedIn / Threads용 요약"
            widget: "text"
            required: false

          - name: "instagram_caption"
            label: "Instagram 캡션"
            widget: "text"
            required: false

          - name: "manual_copy_block"
            label: "수동 발행 채널용 복사 텍스트"
            widget: "text"
            required: false
