<style>
  /* Contact Modal 공통 스타일 */
  #contact-modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.3s; padding: 24px; box-sizing: border-box;}
  #contact-modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-bg { position: absolute; inset: 0; background: rgba(8,8,8,0.85); backdrop-filter: blur(8px); }
  .modal-content { position: relative; background: #080808; border: 1px solid rgba(245,243,238,0.15); padding: 48px; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; transform: translateY(20px); transition: transform 0.3s; font-family: 'Pretendard Variable', sans-serif;}
  #contact-modal-overlay.show .modal-content { transform: translateY(0); }
  .modal-close { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #8f8b82; cursor: pointer; padding: 8px; transition: color 0.2s; }
  .modal-close:hover { color: #f5f3ee; }
  
  .eyebrow-modal { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; color: #8f8b82; text-transform: uppercase; margin-bottom: 16px; display: block; }
  .modal-content h2 { font-family: 'Boska', 'Noto Serif KR', serif; font-weight: 300; font-size: 32px; color: #f5f3ee; margin: 0 0 12px; }
  .modal-content .modal-desc { font-size: 14px; font-weight: 300; color: #8f8b82; margin: 0 0 40px; }
  
  .form-group { margin-bottom: 24px; }
  .form-group label { display: block; font-size: 14px; font-weight: 400; color: #f5f3ee; margin-bottom: 8px; text-align: left; }
  .form-group input, .form-group textarea { width: 100%; background: transparent; border: 1px solid rgba(245,243,238,0.2); padding: 14px 16px; color: #f5f3ee; font-family: inherit; font-size: 14px; border-radius: 6px; outline: none; transition: border-color 0.2s; box-sizing: border-box;}
  .form-group input:focus, .form-group textarea:focus { border-color: #f5f3ee; }
  .cf-optional { color: #8f8b82; font-weight: 300; }
  .cf-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 560px) { .cf-types { grid-template-columns: 1fr; } }
  .cf-type { display: flex; flex-direction: column; gap: 4px; text-align: left; background: transparent;
    border: 1px solid rgba(245,243,238,0.2); border-radius: 6px; padding: 13px 14px; cursor: pointer;
    font-family: inherit; color: #c9c8c2; transition: border-color .2s, background .2s, color .2s; }
  .cf-type b { font-size: 14px; font-weight: 500; color: #f5f3ee; }
  .cf-type span { font-size: 11.5px; color: #8f8b82; line-height: 1.4; }
  .cf-type:hover { border-color: rgba(245,243,238,0.5); }
  .cf-type[aria-checked="true"] { background: #f5f3ee; border-color: #f5f3ee; }
  .cf-type[aria-checked="true"] b, .cf-type[aria-checked="true"] span { color: #080808; }
  .cf-error { color: #ff6b6b; font-size: 13px; margin-top: -16px; margin-bottom: 24px; display: none; text-align: left; }
  .cf-error.show { display: block; }
  .cf-required { color: #ff6b6b; margin-left: 2px; }
  .form-group input.cf-invalid, .form-group textarea.cf-invalid { border-color: #ff6b6b; }
  .cf-types.cf-invalid { outline: 1px solid #ff6b6b; outline-offset: 6px; border-radius: 6px; }
  
  #cf-submit { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #f5f3ee; color: #080808; font-weight: 600; font-size: 15px; padding: 14px 28px; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; margin-top: 12px; }
  #cf-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  #copy-toast { position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px); background: #f5f3ee; color: #080808; font-family: 'Pretendard Variable', sans-serif; font-size: 14px; font-weight: 500; padding: 12px 24px; border-radius: 8px; opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  #copy-toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  @media (max-width:700px){ .modal-content { padding: 32px 24px; } }
</style>

<div id="contact-modal-overlay">
  <div class="modal-bg" data-close-modal></div>
  <div class="modal-content">
    <button type="button" data-close-modal aria-label="닫기" class="modal-close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="eyebrow-modal">Contact</p>
    <h2>함께 최선의 답을 찾겠습니다</h2>
    <p class="modal-desc">코칭, 강연, 협업 제안 등 어떤 말씀이든 편하게 남겨주세요.</p>
    <form id="contact-form" novalidate>
      <div class="form-group">
        <label>어떤 일로 연락 주셨나요? <span class="cf-required">*</span></label>
        <div class="cf-types" role="radiogroup" aria-label="문의 유형">
          <button type="button" class="cf-type" data-type="coaching" role="radio" aria-checked="false">
            <b>스타트업 코칭</b><span>PMF 이후 성장·프로덕트·조직</span>
          </button>
          <button type="button" class="cf-type" data-type="speaking" role="radio" aria-checked="false">
            <b>강연 · 워크숍 섭외</b><span>리더십 · PM/PO · UX</span>
          </button>
          <button type="button" class="cf-type" data-type="other" role="radio" aria-checked="false">
            <b>그 외</b><span>취재 · 협업 · 기타</span>
          </button>
        </div>
      </div>
      <div class="form-group" id="cf-org-group" hidden>
        <label for="cf-org">기관 · 회사명 <span class="cf-optional">(선택)</span></label>
        <input type="text" id="cf-org" name="org" placeholder="예: OO그룹 인재개발원 / OO에이전시">
      </div>
      <div class="form-group">
        <label for="cf-phone">회신받으실 전화번호를 알려주세요 <span class="cf-required">*</span></label>
        <input type="tel" id="cf-phone" name="phone" required placeholder="010-1234-5678">
      </div>
      <div class="form-group">
        <label for="cf-email">회신받으실 이메일 주소를 알려주세요 <span class="cf-required">*</span></label>
        <input type="email" id="cf-email" name="email" required>
      </div>
      <div class="form-group">
        <label for="cf-message">전달하고 싶은 내용을 남겨주세요 <span class="cf-required">*</span></label>
        <textarea id="cf-message" name="message" required rows="5"></textarea>
      </div>
      <p id="cf-error" class="cf-error">빠짐없이 입력해주세요.</p>
      <button type="submit" id="cf-submit">보내기 <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </div>
</div>

<div id="copy-toast" role="status" aria-live="polite">이메일 주소가 복사되었습니다.</div>

<script>
(function initContactModal() {
  var FORMSPREE_ENDPOINT = 'https://formspree.io/f/xjybggkw';
  var openBtns = document.querySelectorAll('.open-contact-modal');
  var overlay = document.getElementById('contact-modal-overlay');
  var closeEls = document.querySelectorAll('[data-close-modal]');
  var form = document.getElementById('contact-form');
  var submitBtn = document.getElementById('cf-submit');
  var errorMsg = document.getElementById('cf-error');
  var toast = document.getElementById('copy-toast');
  var toastTimer = null;

  if (!overlay) return;

  /* ── 전환 측정 ──────────────────────────────────────────────
     문의는 모달 안에서 AJAX로 전송돼 페이지 이동이 없습니다. 그래서 아무것도
     심지 않으면 GA4는 이 사이트의 유일한 목표 행동(문의)을 볼 수 없습니다.
     아래 track()이 GA4 이벤트와 Clarity 태그를 함께 남깁니다.
     - GA4  : contact_open(관심) / generate_lead(전환) / contact_error(실패)
              generate_lead는 GA4 표준 리드 이벤트명이라 전환으로 바로 잡힙니다.
     - Clarity: 세션 녹화를 "문의한 사람"으로 필터링해 볼 수 있게 태그를 답니다.
     둘 중 하나가 없거나 광고차단으로 막혀도 문의 전송 자체는 영향받지 않도록
     전부 try/catch로 감쌉니다. */
  function track(eventName, clarityValue, leadType) {
    try {
      if (typeof window.gtag === 'function') {
        var payload = { page_path: location.pathname, page_title: document.title };
        if (leadType) payload.lead_type = leadType;   /* coaching / speaking / other */
        window.gtag('event', eventName, payload);
      }
    } catch (e) {}
    try {
      if (typeof window.clarity === 'function') {
        if (clarityValue) window.clarity('set', 'contact', clarityValue);
        if (leadType) window.clarity('set', 'lead_type', leadType);
      }
    } catch (e) {}
  }

  function showToast(message) {
    if(!toast) return;
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add('show');
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
  }

  /* ── 문의 유형 ────────────────────────────────────────────────
     엔드포인트를 나누지 않고 payload에 type을 실어 보냅니다. Formspree는
     임의 필드를 그대로 받아 메일에 표시하므로 SaaS 쪽 설정 변경이 없습니다.
     _subject는 Formspree 특수 필드라 메일 제목이 유형별로 갈립니다. */
  var TYPES = {
    coaching: { label: '스타트업 코칭',      subject: '[코칭 문의]' },
    speaking: { label: '강연 · 워크숍 섭외', subject: '[강연 섭외]' },
    other:    { label: '그 외',              subject: '[일반 문의]' }
  };
  var typeBtns = document.querySelectorAll('.cf-type');
  var orgGroup = document.getElementById('cf-org-group');
  var selectedType = null;

  function selectType(type) {
    selectedType = TYPES[type] ? type : null;
    typeBtns.forEach(function (b) {
      b.setAttribute('aria-checked', b.dataset.type === selectedType ? 'true' : 'false');
    });
    /* 기관명은 섭외 건에서만 실제로 쓸모가 있어 그때만 보여줍니다. */
    if (orgGroup) orgGroup.hidden = (selectedType !== 'speaking');
  }
  var typesGroup = document.querySelector('.cf-types');
  typeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      selectType(b.dataset.type);
      if (errorMsg) errorMsg.classList.remove('show');
      if (typesGroup) typesGroup.classList.remove('cf-invalid');
    });
  });

  function openModal(presetType) {
    selectType(presetType || null);
    track('contact_open', 'opened');
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
    var first = document.getElementById('cf-phone');
    if (first) first.focus();
  }

  function closeModal() {
    overlay.classList.remove('show');
    document.body.style.overflow = '';
  }

  /* 버튼에 data-contact-type="speaking" 을 달아두면 그 유형이 미리 선택된 채
     열립니다. 강연 섭외용 CTA를 따로 둘 때 쓰세요. */
  openBtns.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      openModal(btn.getAttribute('data-contact-type'));
    });
  });

  closeEls.forEach(function (el) { el.addEventListener('click', closeModal); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });

  /* ── 검증 ────────────────────────────────────────────────────
     예전엔 "비어있는지"만 봤어서 이메일/전화번호에 아무 글자나 넣어도
     그대로 통과했다. 실제 형식까지 확인한다. novalidate가 폼에 걸려있어
     브라우저 기본 검증은 애초에 안 도니, 여기서 직접 해야 한다. */
  function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function isValidPhone(v) {
    if (!/^[0-9+\-\s()]+$/.test(v)) return false;
    var digits = v.replace(/[^0-9]/g, '');
    // 010-1234-5678(11자리)부터 +82 10-1234-5678 같은 국가번호 포함 표기(12~13자리)까지 허용
    return digits.length >= 9 && digits.length <= 13;
  }

  var phoneEl = document.getElementById('cf-phone');
  var emailEl = document.getElementById('cf-email');
  var messageEl = document.getElementById('cf-message');

  /* 에러가 뜬 채로 방치되지 않도록, 문제였던 입력을 고치기 시작하면 바로 지운다
     (문의 유형 버튼은 이미 클릭 시 지우고 있었는데 텍스트 입력엔 없어서 비대칭이었다). */
  [phoneEl, emailEl, messageEl].forEach(function (el) {
    el.addEventListener('input', function () {
      el.classList.remove('cf-invalid');
      errorMsg.classList.remove('show');
    });
  });

  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorMsg.classList.remove('show');
      [phoneEl, emailEl, messageEl].forEach(function (el) { el.classList.remove('cf-invalid'); });
      if (typesGroup) typesGroup.classList.remove('cf-invalid');

      var data = { phone: phoneEl.value.trim(), email: emailEl.value.trim(), message: messageEl.value.trim() };

      /* 어디가 문제인지 메시지만으론 잘 안 보였다(에러 문구는 폼 맨 아래에 뜨는데
         문의 유형 버튼은 맨 위에 있음). 문제 필드를 직접 하이라이트하고
         스크롤+포커스까지 옮겨서 눈에 바로 띄게 한다. */
      var invalidEl = null, invalidMsg = '';
      if (!selectedType) {
        invalidEl = typesGroup;
        invalidMsg = '어떤 일로 연락 주셨는지 먼저 골라주세요.';
      } else if (!data.phone || !isValidPhone(data.phone)) {
        invalidEl = phoneEl;
        invalidMsg = data.phone ? '전화번호 형식을 다시 확인해주세요.' : '전화번호를 입력해주세요.';
      } else if (!data.email || !isValidEmail(data.email)) {
        invalidEl = emailEl;
        invalidMsg = data.email ? '이메일 형식을 다시 확인해주세요.' : '이메일을 입력해주세요.';
      } else if (!data.message) {
        invalidEl = messageEl;
        invalidMsg = '전달하실 내용을 입력해주세요.';
      }

      if (invalidEl) {
        invalidEl.classList.add('cf-invalid');
        errorMsg.textContent = invalidMsg;
        errorMsg.classList.add('show');
        invalidEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (typeof invalidEl.focus === 'function') invalidEl.focus({ preventScroll: true });
        return;
      }

      var meta = TYPES[selectedType];
      data.type = meta.label;
      data._subject = meta.subject + ' ' + (form.org && form.org.value.trim() ? form.org.value.trim() + ' · ' : '') + data.email;
      if (selectedType === 'speaking' && form.org && form.org.value.trim()) {
        data.org = form.org.value.trim();
      }

      submitBtn.disabled = true;
      fetch(FORMSPREE_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data)
      })
      .then(function (res) {
        if (res.ok) {
          /* ← 이 사이트의 핵심 전환. 유형을 같이 보내야 GA4에서
             "강연 섭외가 몇 건인지"를 코칭과 나눠 볼 수 있습니다. */
          track('generate_lead', 'submitted', selectedType);
          form.reset(); selectType(null); closeModal(); showToast('문의가 정상적으로 접수되었습니다.');
        } else {
          track('contact_error', 'failed');
          showToast('전송에 실패했습니다. 잠시 후 다시 시도해주세요.');
        }
      })
      .catch(function () {
        track('contact_error', 'failed');
        showToast('전송에 실패했습니다. 잠시 후 다시 시도해주세요.');
      })
      .finally(function () { submitBtn.disabled = false; });
    });
  }
})();
</script>
