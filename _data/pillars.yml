pillars:
  - category: "스타트업 인사이트"
    status: "연재중"
    intro: "스타트업이 커지면서 마주치는 진짜 문제들을 다룹니다."
    intro_extended: "시리즈B 이후 왜 더 어려워지는지, 파운더가 스스로 만드는 성장의 한계는 무엇인지, 잘되는 가게와 그렇지 않은 가게는 무엇이 다른지 — 빗썸 COO, 요기요 CPO로 직접 겪은 조직의 안과, 여러 스타트업을 코칭하며 본 패턴을 엮어 씁니다. 정답보다 질문을 남기는 글이 많습니다. 조직이 커지면서 생기는 커뮤니케이션 단절, 창업자가 놓치기 쉬운 확장의 함정, 투자 유치 이후 오히려 늘어나는 의사결정 피로, 그리고 겉보기엔 무관해 보이는 소비재·플랫폼 사례(넷플릭스, 에어비앤비, 스포티파이 등)에서 끌어낸 조직 운영 인사이트까지 포함합니다. 정해진 정답을 제시하기보다, 지금 조직이 겪는 문제가 '나만의 문제가 아니다'라는 걸 확인시켜주는 데 초점을 둡니다."
    published: true
