pillars:
  - category: "스타트업 인사이트"
    status: "연재중"
    intro: "PMF를 찾은 후 조직이 커질수록 왜 더 어려워지는지, 스타트업이 마주하는 진짜 문제들을 다룹니다."
    intro_extended: "시리즈B 이후 왜 더 어려워지는지, 파운더가 스스로 만드는 성장의 한계는 무엇인지, 잘되는 가게와 그렇지 않은 가게는 무엇이 다른지를 다룹니다. 빗썸 COO, 요기요 CPO로 직접 겪은 조직의 안과, 여러 스타트업을 코칭하며 본 패턴을 엮어 씁니다. 정답보다 질문을 남기는 글이 많습니다. 조직이 커지면서 생기는 커뮤니케이션 단절, 창업자가 놓치기 쉬운 확장의 함정, 투자 유치 이후 오히려 늘어나는 의사결정 피로, 그리고 겉보기엔 무관해 보이는 소비재·플랫폼 사례(넷플릭스, 에어비앤비, 스포티파이 등)에서 끌어낸 조직 운영 인사이트까지 포함합니다. 정해진 정답을 제시하기보다, 지금 조직이 겪는 문제가 '나만의 문제가 아니다'라는 걸 확인시켜주는 데 초점을 둡니다."
    published: true

  - category: "UX의 언어들"
    status: "연재중"
    intro: "'왜 이렇게 사용하기 편하지?' 그 대답은 UX 원리가 담긴 언어입니다."
    intro_extended: "맥도날드 드라이브스루가 90초 만에 끝나는 이유, 스타벅스가 다른 카페와 다르게 느껴지는 이유, 공항과 기차역 화장실 표지판이 길을 잃지 않게 설계된 원리까지 다룹니다. 온보딩, 그리드 시스템, Conversational UX, Predictive UX, Clean UI처럼 실무에서 자주 쓰지만 정확히 설명하긴 어려운 UX 용어들을 실제 서비스 사례로 풀어씁니다. 저서 《UX의 언어들》에 담긴 관점을 계속 확장해가는 카테고리로, 'UX가 뭔가요'라는 질문에 이론이 아니라 사례로 답하는 것을 목표로 합니다."
    published: true

  - category: "심플리파이어 라이프"
    status: "연재중"
    intro: "개인으로서의 심플리파이어가 보고 겪은 이야기를 담았습니다."
    intro_extended: "책을 읽은 감상부터 저서 《기획자의 질문법》 출간과 2쇄 뒷이야기, '심플리파이어 코칭 다이어리' 연재, 1인 기업 창업이나 AI 시대 개발자 진로 같은 주변의 질문에 대한 생각까지 다룹니다. 정리된 조언이라기보다, 스타트업에게 드리는 조언이 어떤 사람의 머릿속에서 나오는지 보여주는 개인적인 기록입니다."
    published: true

  - category: "기획일상"
    status: "연재중"
    intro: "기획자의 시선과 생각으로 해석한 세상 이야기입니다."
    intro_extended: "회의실에서 목소리 큰 사람이 왜 가장 위험한지, 커리어는 왜 자꾸 꼬이는지, AI 시대의 '할루시네이션'이 조직 안에서는 어떤 모습으로 나타나는지를 다룹니다. 손흥민, 조용필, 우즈처럼 각자의 영역에서 성과를 눈덩이처럼 불려간 사람들을 '스노우볼'이라는 개념으로 분석하는 연재도 이 카테고리에 있습니다. 결론을 내리기보다 질문을 던지는, 실무에서 매일 부딪히는 것들의 기록입니다."
    published: true

  - category: "토크세션"
    status: "연재중"
    intro: "강연이나 모임에서 나온 대화와 인사이트를 모았습니다."
    intro_extended: "트레바리 기획자 모임 '기밀서재'에서 함께 읽은 《존 도어의 OKR》, 《생각의 탄생》, 《설득의 심리학》, 《로지컬 씽킹》 같은 책들, 마루 커넥트에서의 멘토링, 대학교 강단에 선 경험까지 담습니다. 코치나 강연자가 아니라 한 명의 참여자로서 쓰는 글이라, 다른 카테고리가 정리된 인사이트라면 이쪽은 그게 만들어지기 전 현장의 기록에 가깝습니다."
    published: true

  - category: "Be the PO"
    status: "연재중"
    intro: "PO나 PM이 되기 위해 필요한 사고와 행동을 다룹니다."
    intro_extended: "고수 PO는 감정을 어떻게 다루는지, 객관적이어야 할 때는 언제인지, 데이터를 어떻게 읽는지, 쿠팡이나 토스 같은 조직엔 왜 PO 문화가 자리잡기 어려운지를 다룹니다. 스킬셋보다 PO·PM이라는 역할의 정체성과 판단 기준에 집중한 글이 많고, 네이버·요기요·빗썸에서 실무와 임원 자리를 오가며 겪은 경험이 바탕입니다."
    published: true

  - category: "대한민국 스타트업 미국진출을 묻다"
    status: "완결"
    intro: "미국 진출, 기본적으로 알아야 할 것들을 리서치해서 정리했습니다."
    intro_extended: "어떤 액셀러레이터가 맞는지, 현지 파트너는 어떻게 찾는지, 실리콘밸리에서 한국 팀도 채용이 가능한지, 법인은 언제 설립해야 하는지, 프라이싱과 고객 페르소나는 한국과 어떻게 다른지, SaaS 스타트업이라면 GTM 전략과 초기 고객은 어떻게 확보하는지까지 다룹니다. 실제로 미국 진출을 준비하며 부딪히는 질문 단위로 하나씩 정리한 시리즈입니다."
    published: true

  - category: "PO의 프레임웍"
    status: "완결"
    intro: "PO/PM이 기본적으로 알아야 할 프레임웍을 정리했습니다."
    intro_extended: "스타트업과 대기업에서 애자일을 다르게 적용해야 하는 이유, 우리 팀이 애자일인지 스크럼인지 헷갈릴 때 구분하는 법, 스프린트 주기를 정하는 기준, 레거시 시스템과 기술부채를 함께 풀어가는 전략, PM·PL·TPM의 차이, AI 시대에 PO가 대체되지 않고 살아남는 법까지 다룹니다. 원론이 아니라 실제로 조직에 적용해본 프레임웍만 골라 담았습니다."
    published: true

  - category: "AI의 언어들"
    status: "완결"
    intro: "AI가 만들어지는 기본 원리와 시스템을 쉽게 정리했습니다."
    intro_extended: "Transformer의 병목을 어떻게 푸는지, NPU가 왜 중요한지, 데이터 병렬화와 모델 병렬화는 뭐가 다른지, AWS·Google·Azure의 AI 학습 클라우드는 어떻게 다른지, InfiniBand·NVLink 같은 데이터센터 인프라, 혼합 정밀도·희소 연산·가지치기로 비용을 줄이는 법, TensorCores·FLOPS·TOPS·HBM 같은 성능 지표까지 다룹니다. AI 모델이 실제로 어떻게 만들어지고 돌아가는지, 전문 용어를 하나씩 풀어가며 정리한 시리즈입니다."
    published: true

  - category: "기획자의 프레임웍"
    status: "완결"
    intro: "기획자가 꼭 알아야 하는 전략적 프레임웍을 정리했습니다."
    intro_extended: "3 Horizons 모델로 현재와 미래를 함께 그리는 법, 포터의 5 Forces로 경쟁 구도를 분석하는 법, 고객이 제품을 '고용'한다고 보는 JTBD, Lean Canvas로 하루만에 사업 아이디어를 정리하는 법, LTV/CAC와 리텐션 커브·코호트 분석으로 숫자를 읽는 법, 로직 트리와 'So What, Why So'로 생각을 정리하는 법까지 다룹니다. 이름은 들어봤지만 실제 적용 순서는 헷갈리는 프레임웍들을 하나씩 정리합니다."
    published: true

  - category: "코치S"
    status: "완결"
    intro: "코칭 현장에서 벌어질 법한 에피소드들을 다룬 웹툰입니다."
    intro_extended: "노답 CEO 삼형제, 목표는 몇 개가 적당한지, 브랜딩과 '브랜딩병'의 차이, 콜드브루 장사로 배우는 유입율과 전환율까지 다룹니다. 실제 코칭 중 마주한 딜레마와 순간들을 캐릭터와 에피소드로 각색한 연재 웹툰으로, 무거운 조언 대신 짧은 이야기로 코칭 현장의 생생함을 전달하는 데 목적을 둡니다."
    published: true

  - category: "잉크드인대 기획학과"
    status: "연재중"
    intro: "'잉크드인대학교 기획학과'라는 가상의 학교에서, 기획의 기본 원리를 다루는 웹툰입니다."
    intro_extended: "문제정의, 과제폭탄, 고민상담 동아리, 4개국어 능력자 조조의 등장까지, 기획을 처음 배우는 학생들이 실제로 부딪히는 상황과 개념을 캐릭터로 풀어낸 연재물입니다. 코치S가 현직 코칭 사례라면, 이쪽은 그 이전, 기획의 기본기를 익히는 단계의 눈높이에 맞춘 이야기입니다."
    published: true
