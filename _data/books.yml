books:
  - slug: "기획자의-질문법"
    title: "기획자의 질문법"
    subtitle: "27가지 질문이 만드는 완성도 있는 기획"
    author: "한성희"
    coauthor: ""
    publisher: "파지트"
    published_date: "2025.06.13"
    isbn: "9791171520947"
    pages: 240
    price: 18000
    cover_image: "/assets/books/book-question.png"
    purchase_url: "https://www.yes24.com/product/goods/147079674"
    retailers:
      - name: "예스24"
        url: "https://www.yes24.com/product/goods/147079674"
      - name: "교보문고"
        url: "https://product.kyobobook.co.kr/detail/S000216681258"
      - name: "알라딘"
        url: "https://www.aladin.co.kr/shop/wproduct.aspx?ItemId=364986311"
    intro: "25년간 현장에서 부딪히며 스스로에게 던져온 27가지 질문을 담았습니다. 하나하나 답하다 보면, 어느 순간 완성도 있는 기획을 하고 있는 자신을 만나게 됩니다."
    intro_extended: "'왜 어떤 기획은 성공하고, 어떤 기획은 실패할까?' 25년간 기획자로 일하며 늘 품고 있던 질문이었습니다. 첫 회사의 작은 기능 기획부터 글로벌 기업의 수천만 사용자 서비스, 지금 코칭하는 스타트업들까지 — 답을 찾는 과정에서 하나의 패턴을 발견했습니다. 성공하는 기획은 모두 좋은 질문에서 출발한다는 것.|||이 책은 비즈니스뿐 아니라 SNS·유튜브 개설·책쓰기처럼 목표 달성이 필요한 모든 일에 쓸 수 있는 27가지 질문 프레임워크(27Qs Framework)를 담았습니다. 실제로 이 책 자체도 이 템플릿을 통해 완성됐습니다.|||주류를 이루는 기획 단상들과 달리, 실전에서 바로 쓸 수 있는 교과서를 만들자는 마음으로 썼습니다. 처음 읽을 때는 2시간 안에 후루룩 읽히지만, 자기 것으로 만들려는 순간 27개의 질문 하나하나를 곱씹게 됩니다."
    seal: "2쇄"
    stat_badges:
      - "교보문고 자기계발 베스트셀러"
      - "출간 3개월 만에 2쇄"
      - "27가지 질문 프레임워크"
    benefits:
      - "27가지 질문만으로 완성도 있는 기획을 만드는 법"
      - "질문과 답을 AI에 붙여넣기만 해도 전략적인 기획서가 나오는 템플릿"
      - "SNS 운영, 유튜브 개설, 책쓰기까지 — 목표가 있는 모든 일에 쓰는 프레임워크"
      - "2시간이면 완독, 그러나 곱씹을수록 깊어지는 27개의 질문"
    framework_title: "책에 담긴 27Qs 프레임워크"
    framework_intro: "5단계, 27개의 질문으로 구성됩니다. 질문에 하나씩 답하고 그 답을 AI에 붙여넣어 기획서로 만들어 달라고 하면, 전략적인 기획서가 나옵니다 — 이 책 자체도 이 프레임워크로 완성됐습니다."
    framework_groups:
      - heading: "기획을 시작하는 질문들"
        items:
          - "이 기획은 무엇을 이루기 위해 존재할까?"
          - "가장 먼저 해결해야 할 일은 무엇일까?"
          - "우리는 어떤 결과를 성공이라고 부를 수 있을까?"
      - heading: "고객을 명확히 하는 질문들"
        items:
          - "이 일에 영향을 주고받는 사람은 누구일까?"
          - "각자의 입장에서 원하는 건 무엇일까?"
          - "목표 달성을 위해 꼭 움직여야 하는 사람은 누구일까?"
          - "결국 우리는 누구의 문제를 해결해야 할까?"
          - "겉으론 말하지 않지만 정말 원하는 건 무엇일까?"
          - "우리가 발견한 니즈가 정말 중요한 문제일까?"
      - heading: "실행을 위한 질문들"
        items:
          - "이 아이디어는 정말 효과가 있을까?"
          - "고객이 실제로 해야 하는 행동은 무엇일까?"
          - "그들은 왜 행동해야 할까?"
          - "그들이 행동을 하지 않는다면 그 이유는 뭘까?"
          - "어떻게 행동을 설계할까?"
          - "우리는 지금 어디에 있고, 고객은 왜 우리를 쓸까?"
          - "경쟁자보다 어떻게 우월해질 수 있을까?"
          - "어떻게 효과적으로 만들까?"
          - "누구와 함께해야 하고, 어떻게 힘을 모을 수 있을까?"
      - heading: "실행에 옮기기 전의 질문들"
        items:
          - "고객에게 꼭 전달하고 싶은 메시지는 무엇일까?"
          - "그들은 어떤 감정과 기억을 가져가야 할까?"
          - "고객은 무엇을 통해 우리와 만날까?"
          - "기획 외에 더 필요한 건 없을까?"
      - heading: "기획을 마친 후의 질문들"
        items:
          - "지금까지의 기획은 목표와 맞닿아 있을까?"
          - "최대 다수를 만족시키는 기획일까?"
          - "문서를 작성할 수 있을 만큼 충분히 질문했을까?"
          - "어떤 변화와 성과가 남았을까?"
          - "다시 시작한다면 무엇을 다르게 할까?"
    testimonial: "이용자의 니즈를 파악하고 서비스의 방향성을 정할 때도 이 책에서 말하는 질문들이 굉장히 유용하게 사용될 수 있다. 질문이 단순히 문제를 해결하는 도구가 아니라, 나 자신을 돌아보고 성찰하게 만드는 과정이라는 것도 인상 깊었다."
    testimonial_source: "한 독자 (사회복지사)"
    flank_right_text: "네이버, 삼성전자, 요기요, 빗썸 — 실무자부터 C레벨까지. 25년간 현장에서 검증한 질문들입니다."
    flank_right_source: "저자 한성희"
    stats:
      - value: "2쇄"
        label: "출간 3개월 만에 돌입"
      - value: "9개월+"
        label: "교보문고 자기계발 분야 주간 베스트셀러 유지"
      - value: "27"
        label: "현장에서 검증된 질문의 수"
    published: true

  - slug: "UX의-언어들"
    title: "UX의 언어들"
    subtitle: "일상 속에 숨은 UX의 원리를 발견하는 책"
    author: "한성희"
    coauthor: "신행철"
    publisher: "파지트"
    published_date: "2026.07.07"
    isbn: "9791171521470"
    pages: 214
    price: 17000
    cover_image: "/assets/books/book-ux.png"
    purchase_url: "https://www.yes24.com/product/goods/193444437"
    retailers:
      - name: "예스24"
        url: "https://www.yes24.com/product/goods/193444437"
      - name: "교보문고"
        url: "https://product.kyobobook.co.kr/detail/S000220493173"
    intro: "맥도날드 드라이브스루, 스타벅스, 넷플릭스, 카카오 — 익숙한 서비스 속에 숨은 UX의 원리를, 기획자와 디자이너 두 시선으로 풀어냈습니다."
    intro_extended: "이 책의 시작점은 좌절이었습니다. 행동설계 전문가로 20여 년을 일했는데, 정부 온라인 서비스 신청 과정에서 열 번 넘게 반려를 당했습니다. 많은 매뉴얼과 안내 영상이 전혀 친절하지 않았습니다. 그 경험이 이 책을 써야겠다는 확신이 됐습니다.|||브랜딩 전문가, IT 전문가, 그리고 평범한 직장인까지 — 주변에서 자주 듣는 질문이 있습니다. 'UX가 정확히 뭐예요?' 그 질문도 이 책을 쓰는 동기가 됐습니다. 어렵지 않으면서 UX에 빠져들 수 있도록 세심하게 썼습니다.|||무신사 디자인헤드 신행철님과 함께 썼습니다. 기획자의 눈과 디자이너의 눈, 두 시선으로 1년을 씨름한 결과물입니다. 일상에 녹아 있는 UX를 발견하다 보면, 어느새 매일 만나는 서비스와 제품이 다르게 보이기 시작할 겁니다."
    seal: "공저"
    stat_badges:
      - "2026년 신간"
      - "기획자 × 디자이너 공저"
    benefits:
      - "맥도날드·스타벅스·넷플릭스 사례로 배우는 일상 속 UX 원리"
      - "온보딩, Conversational UX 같은 실무 용어를 사례로 정확히 이해하기"
      - "기획자와 디자이너, 두 시선으로 겹쳐 보는 UX"
      - "매일 만나는 서비스와 제품이 다르게 보이기 시작하는 경험"
    framework_title: "책에서 다루는 이야기들"
    framework_intro: "일상 사례로 UX 원리를 설명하고, 실무에서 자주 쓰지만 정확히 설명하긴 어려운 UX 용어들을 함께 풀어씁니다."
    framework_groups:
      - heading: "일상 속 UX 발견하기"
        items:
          - "맥도날드 드라이브스루가 90초 만에 끝나는 이유"
          - "스타벅스가 다른 카페와 다르게 느껴지는 이유"
          - "공항과 기차역 화장실 표지판이 길을 잃지 않게 설계된 원리"
          - "넷플릭스·카카오 같은 서비스를 우리가 경험하고 소비하는 방식"
      - heading: "UX 용어, 사례로 이해하기"
        items:
          - "온보딩 — 처음 쓰는 사람을 붙잡는 설계"
          - "그리드 시스템 — 화면에 질서를 부여하는 원리"
          - "Conversational UX — 대화하듯 자연스러운 인터페이스"
          - "Predictive UX — 사용자보다 한 발 먼저 움직이는 설계"
          - "Clean UI — 덜어낼수록 명확해지는 화면"
    testimonial: "기획자의 눈으로 20년, 행동설계를 다루며 쌓은 UX의 언어를 나눕니다."
    testimonial_source: "저자 한성희"
    flank_right_text: "무신사 디자인헤드로 일하며 본 UX를, 디자이너의 눈으로 함께 썼습니다."
    flank_right_source: "공저자 신행철"
    stats:
      - value: "공저"
        label: "기획자(한성희) × 디자이너(신행철), 두 시선"
      - value: "1년"
        label: "두 저자가 함께 씨름한 집필 기간"
      - value: "20년+"
        label: "저자가 행동설계 전문가로 일해온 시간"
    published: true
