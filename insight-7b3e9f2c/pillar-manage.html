<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>필러 관리 - Simplifier</title>

<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="/insight-7b3e9f2c/studio.css">

<style>
  .edit-line{font-size:12.5px; color:var(--muted); margin-bottom:12px;}
  .edit-line a{color:var(--dim);}
  .edit-line a:hover{color:var(--ink);}

  /* ---- GitHub 연결(토큰) ---- */
  .token-panel{font-size:12.5px; color:var(--dim); margin-bottom:20px; padding:12px 16px; background:#f7f6f2; border-radius:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .token-ok{color:var(--good); font-weight:600;}
  .token-panel input[type="password"]{font-family:inherit; font-size:12.5px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; min-width:220px;}
  .token-panel button, .token-link{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:6px; padding:6px 12px;
  }
  .token-panel button:hover, .token-link:hover{background:var(--line-soft);}
  .token-link{background:none; border-color:transparent; font-weight:400; color:var(--dim); padding:6px 4px;}
  .token-msg{font-size:12px; color:var(--muted);}
  .token-msg.warn{color:var(--bad);}

  /* ---- 편집 폼 ---- */
  .edit-toggle{
    display:inline-flex; align-items:center; margin-left:6px; vertical-align:middle;
    font-size:11.5px; font-weight:600; color:var(--dim); cursor:pointer;
    background:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px;
    font-family:inherit; white-space:nowrap;
    transition:background-color .15s, border-color .15s, color .15s;
  }
  .edit-toggle:hover{color:var(--ink); border-color:var(--ink);}
  .edit-form{display:flex; flex-direction:column; gap:12px; background:#f7f6f2; border-radius:8px; padding:16px;}
  .edit-form label{display:flex; flex-direction:column; gap:5px; font-size:11.5px; color:var(--muted); font-weight:600;}
  .edit-form input[type="text"], .edit-form textarea, .edit-form select{
    font-family:inherit; font-size:13px; color:var(--ink); font-weight:400;
    padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff;
  }
  .edit-form textarea{resize:vertical; line-height:1.6;}
  .ef-actions{display:flex; align-items:center; gap:10px;}
  .ef-actions button{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:6px; padding:7px 14px; border:1px solid var(--line);
  }
  .btn-save{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn-save:hover{opacity:0.85;}
  .btn-save:disabled{opacity:0.5; cursor:default;}
  .btn-cancel{background:#fff; color:var(--dim);}
  .btn-cancel:hover{background:var(--line-soft);}
  .ef-msg{font-size:12px; color:var(--muted);}
  .ef-msg.warn{color:var(--bad);}
  .ef-msg.ok{color:var(--good);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:600; padding:0 12px 10px; border-bottom:1px solid var(--line);}
  tbody td{padding:12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .cat-name{font-weight:600;}
  .count{color:var(--muted); font-variant-numeric:tabular-nums;}
  .intro-cell{display:inline-block; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; color:var(--dim);}
  .intro-cell.empty{color:var(--muted); opacity:0.6;}
  .more-toggle{
    display:inline-flex; align-items:center; margin-left:8px; vertical-align:middle;
    font-size:11.5px; font-weight:600; color:var(--dim); cursor:pointer;
    background:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px;
    font-family:inherit; white-space:nowrap;
    transition:background-color .15s, border-color .15s, color .15s;
  }
  .more-toggle:hover{color:var(--ink); border-color:var(--ink);}
  .detail-row td{padding:0 12px 16px; border-bottom:1px solid var(--line-soft);}
  .intro-extended{background:#f7f6f2; border-radius:8px; padding:14px 16px; font-size:12.5px; color:var(--dim); line-height:1.7;}
  .intro-extended p{margin:0 0 0.9em;}
  .intro-extended p:last-child{margin-bottom:0;}
  .sort-badge{font-size:11.5px; color:var(--muted); white-space:nowrap;}
  .status{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px;}
  .status.live{background:rgba(31,122,79,0.1); color:var(--good);}
  .status.staging{background:rgba(163,105,15,0.1); color:var(--warn);}
  .status.none{background:var(--line-soft); color:var(--muted);}
  .links a{color:var(--dim); text-decoration:none; font-size:12.5px; margin-right:12px;}
  .links a:hover{color:var(--ink); text-decoration:underline;}
  .loading, .err{font-size:13px; color:var(--muted); padding:20px 0;}
  .err{color:var(--bad);}
</style>
</head>
<body class="has-shell-nav">
<nav id="adminShellNav"></nav>

<div class="wrap">
  <header>
    <h1>필러 관리<button type="button" class="info-dot" id="titleInfo" aria-label="설명 보기">ⓘ<span class="info-text" id="titleInfoText"></span></button></h1>
    <button class="refresh" id="refreshBtn"><span class="refresh-icon">↻</span> <span class="refresh-label">새로고침</span></button>
    <span id="dataAsOf" class="meta-text"></span>
  </header>

  <div class="edit-line">소개 한 줄·자세히·정렬 기본값은 <code>_data/pillars.yml</code> 기준입니다. 아래에서 GitHub 연결 후 바로 고치거나, <a href="/insight-7b3e9f2c/write.html#/collections/pillars/entries/pillars" target="_blank" rel="noopener">CMS에서 편집 ↗</a>해도 됩니다.</div>

  <div id="tokenPanel" class="token-panel"></div>

  <div id="content"><div class="loading">불러오는 중…</div></div>
</div>

<script>
(function () {
  var POSTS_URL = "/assets/data/posts.json";
  // _data/pillars.yml은 Jekyll 데이터 파일이라 이 페이지(순수 정적 HTML)가
  // 직접 못 읽는다 -- multi-publish.html이 글 원문(.md)을 읽을 때 쓰는 것과
  // 같은 방식으로, GitHub의 raw 파일을 그대로 가져와 가볍게 파싱한다.
  var PILLARS_RAW_URL = "https://raw.githubusercontent.com/hansunghee7/hansunghee7.github.io/main/_data/pillars.yml";

  var content = document.getElementById("content");

  var TITLE_INFO_BASE =
    "카테고리별 필러(주제 소개) 페이지 현황판입니다. 소개 한 줄·자세히·정렬 기본값(최신순/오래된순)은 " +
    "_data/pillars.yml 기준으로 보여줍니다. GitHub 토큰을 연결하면 여기서 바로 고칠 수 있고, CMS에서 편집해도 됩니다.";

  var REPO = "hansunghee7/hansunghee7.github.io";
  var PILLARS_API_URL = "https://api.github.com/repos/" + REPO + "/contents/_data/pillars.yml";
  var TOKEN_KEY = "simplifierPillarManageToken";

  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
  function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function ghHeaders(token) { return { Authorization: "token " + token, Accept: "application/vnd.github+json" }; }

  function stampRefresh() {
    var time = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("titleInfoText").textContent = TITLE_INFO_BASE + " 마지막 새로고침: " + time + ".";
  }

  /* GitHub 쓰기 연결 -- SNS 확장의 PAT 직접 입력 방식과 동일하게, 저장하기
     전에 실제로 이 저장소에 쓸 수 있는 토큰인지 먼저 확인한다(잘못된
     토큰을 넣고도 저장 시도할 때가 돼서야 아는 상황을 막기 위해). 토큰은
     이 페이지의 localStorage에만 남고 채팅이나 서버로 전송되지 않는다. */
  var tokenPanel = document.getElementById("tokenPanel");
  function renderTokenPanel() {
    var token = getToken();
    if (token) {
      tokenPanel.innerHTML = '<span class="token-ok">✓ GitHub 연결됨 — 아래에서 바로 편집할 수 있습니다.</span><button type="button" class="token-link" id="tokenDisconnectBtn">연결 해제</button>';
      document.getElementById("tokenDisconnectBtn").addEventListener("click", function () {
        clearToken();
        renderTokenPanel();
      });
      return;
    }
    tokenPanel.innerHTML =
      '<span>여기서 바로 고치려면 쓰기 권한 있는 GitHub 토큰이 필요합니다.</span>' +
      '<input type="password" id="tokenInput" placeholder="github_pat_... 또는 ghp_...">' +
      '<button type="button" id="tokenConnectBtn">연결</button>' +
      '<span class="token-msg" id="tokenMsg"></span>';
    document.getElementById("tokenConnectBtn").addEventListener("click", function () {
      var input = document.getElementById("tokenInput");
      var msg = document.getElementById("tokenMsg");
      var value = input.value.trim();
      if (!value) { msg.className = "token-msg warn"; msg.textContent = "토큰을 입력해주세요."; return; }
      msg.className = "token-msg"; msg.textContent = "확인 중...";
      fetch("https://api.github.com/repos/" + REPO, { headers: ghHeaders(value) })
        .then(function (r) {
          if (!r.ok) return r.json().catch(function () { return {}; }).then(function (body) {
            throw new Error(r.status + (body && body.message ? " - " + body.message : ""));
          });
          setToken(value);
          renderTokenPanel();
        })
        .catch(function (e) {
          msg.className = "token-msg warn";
          msg.textContent = "연결 실패 — " + String((e && e.message) || e) + ". 토큰과 저장소 접근 권한(Contents: Read and write)을 확인하세요.";
        });
    });
  }
  renderTokenPanel();

  function load() {
    content.innerHTML = '<div class="loading">불러오는 중…</div>';
    return Promise.all([
      fetch(POSTS_URL + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }),
      fetch(PILLARS_RAW_URL + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(parsePillarsYaml)
        .catch(function () { return []; }),
    ])
      .then(function (results) {
        render(results[0], results[1]);
        return true;
      })
      .catch(function (e) {
        content.innerHTML = '<div class="err">데이터를 못 불러왔습니다: ' + escapeHtml(String(e)) + "</div>";
        return false;
      });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    var btn = this;
    Studio.setRefreshState(btn, "loading");
    load().then(function (ok) {
      stampRefresh();
      Studio.setRefreshState(btn, ok ? "success" : "error");
      setTimeout(function () { Studio.setRefreshState(btn, "idle"); }, 1600);
    });
  });
  load().then(function () { stampRefresh(); });

  // 편집 폼을 열 때(저장 직후 재조회 없이) 현재 값을 채워야 하므로,
  // 마지막으로 그린 pillar 데이터를 모듈 범위에 남겨둔다.
  var lastPillarByCategory = {};

  function render(posts, pillars) {
    var counts = {};
    posts.forEach(function (p) {
      var cat = p.category || "(분류 없음)";
      counts[cat] = (counts[cat] || 0) + 1;
    });

    var pillarByCategory = {};
    pillars.forEach(function (p) { pillarByCategory[p.category] = p; });
    lastPillarByCategory = pillarByCategory;

    var cats = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    var liveCount = pillars.filter(function (p) { return p.published; }).length;
    document.getElementById("dataAsOf").textContent = "· 필러 " + liveCount + "개 운영중 · 카테고리 " + cats.length + "개";

    var rows = cats.map(function (cat) {
      var pillar = pillarByCategory[cat];
      var statusHtml = pillar && pillar.published
        ? '<span class="status live">운영 반영됨</span>'
        : pillar
          ? '<span class="status staging">스테이징</span>'
          : '<span class="status none">아직 없음</span>';
      var linksHtml = pillar && pillar.pillar_url
        ? '<span class="links"><a href="' + escapeHtml(pillar.pillar_url) + '" target="_blank" rel="noopener">페이지 보기 ↗</a></span>'
        : "";
      var introHtml = pillar && pillar.intro
        ? '<span class="intro-cell" title="' + escapeHtml(pillar.intro) + '">' + escapeHtml(pillar.intro) + "</span>"
        : '<span class="intro-cell empty">—</span>';
      var sortHtml = pillar
        ? '<span class="sort-badge">' + (pillar.sort_order === "asc" ? "오래된순" : "최신순") + "</span>"
        : '<span class="sort-badge">—</span>';
      // 소개 한 줄만 있고 자세히(intro_extended)는 아예 안 보여서 "없는 줄
      // 알았다"는 피드백을 받았다 -- 더보기 버튼을 눌러야 아코디언처럼
      // 펼쳐지는 상세 행을 그 아래 붙인다(테이블 안이라 실제 사이트의
      // 모달 대신 행을 펼치는 방식을 썼다).
      var moreBtnHtml = pillar && pillar.intro_extended
        ? '<button type="button" class="more-toggle" aria-expanded="false">더보기 ▾</button>'
        : "";
      // 편집은 이미 pillars.yml에 항목이 있는 카테고리만 지원한다(글은
      // 있는데 필러 항목이 아직 없는 카테고리는 CMS에서 새로 만들어야
      // 함 -- 이 페이지는 "있는 항목 고치기"만 다룬다).
      var editBtnHtml = pillar
        ? '<button type="button" class="edit-toggle" data-cat="' + escapeHtml(cat) + '">편집</button>'
        : "";
      var detailRowHtml = pillar
        ? '<tr class="detail-row" hidden data-cat="' + escapeHtml(cat) + '"><td colspan="6"><div class="intro-extended">' + buildDetailBodyHtml(pillar) + "</div></td></tr>"
        : "";
      return (
        "<tr>" +
        '<td class="cat-name">' + escapeHtml(cat) + "</td>" +
        '<td class="count">' + counts[cat] + "건</td>" +
        "<td>" + statusHtml + "</td>" +
        "<td>" + introHtml + moreBtnHtml + editBtnHtml + "</td>" +
        "<td>" + sortHtml + "</td>" +
        "<td>" + linksHtml + "</td>" +
        "</tr>" + detailRowHtml
      );
    }).join("");

    content.innerHTML =
      "<div class=\"tablebox\"><table><thead><tr>" +
      "<th>카테고리</th><th>글 수</th><th>필러 페이지</th><th>소개 한 줄</th><th>정렬 기본값</th><th></th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function buildDetailBodyHtml(pillar) {
    return pillar && pillar.intro_extended
      ? pillar.intro_extended.split("|||").map(function (p) { return "<p>" + escapeHtml(p.trim()) + "</p>"; }).join("")
      : '<p class="ef-msg">자세히 내용이 아직 없습니다.</p>';
  }

  /* 더보기/편집 버튼은 매 렌더마다 innerHTML로 새로 생기므로, 버튼 자체가
     아니라 content(고정된 부모)에 한 번만 클릭 위임을 건다. */
  content.addEventListener("click", function (e) {
    var moreBtn = e.target.closest(".more-toggle");
    if (moreBtn) {
      var row = moreBtn.closest("tr");
      var detail = row.nextElementSibling;
      if (!detail || !detail.classList.contains("detail-row")) return;
      var cat = detail.getAttribute("data-cat");
      // "더보기"를 누르면 편집 폼이 열려있던 상태와 상관없이 항상
      // 읽기 전용 보기로 되돌린다 -- 편집 중이던 내용을 실수로 계속
      // 보이게 두지 않기 위해.
      detail.querySelector("td").innerHTML = '<div class="intro-extended">' + buildDetailBodyHtml(lastPillarByCategory[cat]) + "</div>";
      var willOpen = detail.hasAttribute("hidden");
      detail.toggleAttribute("hidden", !willOpen);
      moreBtn.textContent = willOpen ? "접기 ▴" : "더보기 ▾";
      moreBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
      return;
    }

    var editBtn = e.target.closest(".edit-toggle");
    if (editBtn) {
      var erow = editBtn.closest("tr");
      var edetail = erow.nextElementSibling;
      if (!edetail || !edetail.classList.contains("detail-row")) return;
      var ecat = edetail.getAttribute("data-cat");
      edetail.removeAttribute("hidden");
      renderEditForm(edetail, ecat);
      return;
    }

    var cancelBtn = e.target.closest(".btn-cancel");
    if (cancelBtn) {
      var crow = cancelBtn.closest("tr");
      var ccat = crow.getAttribute("data-cat");
      crow.setAttribute("hidden", "");
      crow.querySelector("td").innerHTML = '<div class="intro-extended">' + buildDetailBodyHtml(lastPillarByCategory[ccat]) + "</div>";
      var mainRow = crow.previousElementSibling;
      var mb = mainRow ? mainRow.querySelector(".more-toggle") : null;
      if (mb) { mb.textContent = "더보기 ▾"; mb.setAttribute("aria-expanded", "false"); }
      return;
    }

    var saveBtn = e.target.closest(".btn-save");
    if (saveBtn) {
      var srow = saveBtn.closest("tr");
      var scat = srow.getAttribute("data-cat");
      var form = srow.querySelector(".edit-form");
      var msg = form.querySelector(".ef-msg");
      var token = getToken();
      if (!token) { msg.className = "ef-msg warn"; msg.textContent = "먼저 위에서 GitHub 토큰을 연결하세요."; return; }
      var newIntro = form.querySelector(".ef-intro").value.trim();
      var newExtendedRaw = form.querySelector(".ef-extended").value;
      var newSort = form.querySelector(".ef-sort").value;
      savePillar(scat, newIntro, newExtendedRaw, newSort, token, msg, saveBtn);
      return;
    }
  });

  function renderEditForm(detailRow, cat) {
    var pillar = lastPillarByCategory[cat] || { category: cat };
    var extendedText = pillar.intro_extended ? pillar.intro_extended.split("|||").map(function (p) { return p.trim(); }).join("\n\n") : "";
    detailRow.querySelector("td").innerHTML =
      '<div class="edit-form">' +
      '<label>소개 한 줄<input type="text" class="ef-intro" value="' + escapeHtml(pillar.intro || "") + '"></label>' +
      '<label>자세히 (문단은 빈 줄로 구분)<textarea class="ef-extended" rows="7">' + escapeHtml(extendedText) + '</textarea></label>' +
      '<label>정렬 기본값<select class="ef-sort">' +
      '<option value="desc"' + (pillar.sort_order !== "asc" ? " selected" : "") + '>최신순</option>' +
      '<option value="asc"' + (pillar.sort_order === "asc" ? " selected" : "") + '>오래된순</option>' +
      "</select></label>" +
      '<div class="ef-actions"><button type="button" class="btn-save">저장</button><button type="button" class="btn-cancel">취소</button><span class="ef-msg"></span></div>' +
      "</div>";
  }

  /* 저장 흐름(SNS 확장의 commitCapture와 동일한 패턴):
     1) 커밋 직전에 pillars.yml을 새로 GET해서 최신 sha를 받는다(그 사이
        다른 곳에서 먼저 커밋했을 수 있으므로, 페이지 로드 시점의 sha를
        재사용하지 않는다).
     2) 방금 받은 최신 내용을 파싱해서, 고치는 카테고리 항목만 값을
        바꾸고 나머지 11개 항목과 다른 필드는 그대로 둔다.
     3) 다시 직렬화해서 그 sha로 PUT. 409(그 사이 또 다른 커밋이 끼어듦)면
        사용자가 다시 저장을 누르면 되므로 자동 재시도는 하지 않고
        메시지로 안내한다. */
  function savePillar(cat, newIntro, newExtendedRaw, newSort, token, msgEl, saveBtn) {
    saveBtn.disabled = true;
    msgEl.className = "ef-msg";
    msgEl.textContent = "저장 중...";

    fetch(PILLARS_API_URL, { headers: ghHeaders(token), cache: "no-store" })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (body) {
          throw new Error("GET 실패: " + r.status + (body && body.message ? " - " + body.message : ""));
        });
        return r.json();
      })
      .then(function (fileRes) {
        var text = decodeURIComponent(escape(atob(fileRes.content.replace(/\n/g, ""))));
        var entries = parsePillarsYaml(text);
        var entry = entries.filter(function (p) { return p.category === cat; })[0];
        if (!entry) throw new Error("pillars.yml에서 이 카테고리를 찾지 못했습니다: " + cat);

        entry.intro = newIntro;
        entry.intro_extended = newExtendedRaw
          .split(/\n\s*\n/)
          .map(function (p) { return p.trim(); })
          .filter(Boolean)
          .join("|||");
        entry.sort_order = newSort;

        var newText = serializePillarsYaml(entries);
        var b64 = btoa(unescape(encodeURIComponent(newText)));
        return fetch(PILLARS_API_URL, {
          method: "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)),
          body: JSON.stringify({
            message: "필러 관리: " + cat + " 소개 수정 (Simplifier Studio)",
            content: b64,
            sha: fileRes.sha,
          }),
        });
      })
      .then(function (putRes) {
        if (putRes.status === 409) {
          throw new Error("다른 변경과 충돌했습니다(그 사이 다른 곳에서 먼저 저장함). 저장을 다시 눌러주세요.");
        }
        if (!putRes.ok) return putRes.json().catch(function () { return {}; }).then(function (body) {
          throw new Error("커밋 실패: " + putRes.status + (body && body.message ? " - " + body.message : ""));
        });
        return putRes.json();
      })
      .then(function () {
        msgEl.className = "ef-msg ok";
        msgEl.textContent = "저장됐습니다. 새로고침합니다…";
        setTimeout(function () { load().then(function () { stampRefresh(); }); }, 700);
      })
      .catch(function (e) {
        saveBtn.disabled = false;
        msgEl.className = "ef-msg warn";
        msgEl.textContent = "저장 실패 — " + String((e && e.message) || e);
      });
  }

  /* _data/pillars.yml 직렬화(parsePillarsYaml의 역방향) -- 지금 파일의
     필드 순서(category -> status -> sort_order -> pillar_url -> intro ->
     intro_extended -> published)를 그대로 지켜서, CMS나 이 화면 어느
     쪽으로 다음에 다시 저장해도 diff가 커지지 않게 한다. 값 없는 필드는
     건너뛴다(지금 12개 항목은 전부 다 채워져 있지만, 앞으로 빈 필드가
     생겨도 깨지지 않도록). */
  function serializePillarsYaml(entries) {
    var FIELD_ORDER = ["status", "sort_order", "pillar_url", "intro", "intro_extended"];
    var lines = ["pillars:"];
    entries.forEach(function (p, i) {
      lines.push("  - category: " + yamlQuote(p.category));
      FIELD_ORDER.forEach(function (key) {
        if (p[key] != null && p[key] !== "") lines.push("    " + key + ": " + yamlQuote(p[key]));
      });
      lines.push("    published: " + (p.published ? "true" : "false"));
      if (i < entries.length - 1) lines.push("");
    });
    return lines.join("\n") + "\n";
  }

  function yamlQuote(v) {
    return '"' + String(v == null ? "" : v).replace(/"/g, '\\"') + '"';
  }

  /* _data/pillars.yml 전용 파서 -- "pillars:" 아래 "  - category: ..."로
     시작하는 항목 하나씩, 그 아래 "    key: value" 줄들을 읽는다. 이
     파일은 CMS(list 위젯)가 항상 이 두 단계 들여쓰기 구조로만 쓰므로,
     범용 YAML 파서 대신 이 스키마 전용으로 가볍게 짰다(multi-publish.html의
     front matter 파서와 같은 접근). intro_extended처럼 긴 값도 CMS가
     한 줄 큰따옴표 문자열로 저장해서 블록 스칼라 처리는 필요 없다. */
  function parsePillarsYaml(raw) {
    var lines = (raw || "").split("\n");
    var entries = [];
    var current = null;
    lines.forEach(function (line) {
      var head = line.match(/^  - category:\s*(.*)$/);
      if (head) {
        current = { category: unquoteYaml(head[1]) };
        entries.push(current);
        return;
      }
      if (!current) return;
      var kv = line.match(/^    ([a-z_]+):\s*(.*)$/);
      if (!kv) return;
      var key = kv[1], val = kv[2];
      current[key] = val === "true" ? true : val === "false" ? false : unquoteYaml(val);
    });
    return entries;
  }

  function unquoteYaml(v) {
    v = (v || "").trim();
    if (v.length >= 2 && v[0] === '"' && v[v.length - 1] === '"') {
      return v.slice(1, -1).replace(/\\"/g, '"');
    }
    if (v.length >= 2 && v[0] === "'" && v[v.length - 1] === "'") {
      return v.slice(1, -1).replace(/''/g, "'");
    }
    return v;
  }

  function escapeHtml(s) {
    return (s || "").toString().replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
