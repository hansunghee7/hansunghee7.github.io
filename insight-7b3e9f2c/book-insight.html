<title>북 인사이트 - Simplifier</title>

     robots.txt에 Disallow를 쓰면 오히려 주소가 공개되므로, 여기서 noindex만 겁니다.
     sitemap.xml에도 넣지 마세요. -->

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">

<style>
  :root{
    --bg:#ffffff; --ink:#121210; --muted:#6e6a62; --dim:#403d37;
    --line:#c8c6bf; --line-soft:rgba(20,20,15,0.07);
    --card:#ffffff; --good:#1f7a4f; --warn:#a3690f; --bad:#b8402a;
    --gutter:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  /* 다른 Studio 페이지보다 넓게 잡는다 -- 두 책을 좌우로 나란히 놓고
     비교하려면 1100px로는 컬럼 하나가 너무 좁아진다. */
  .wrap{max-width:1600px; margin:0 auto; padding:0 var(--gutter) 60px;}
  @media (min-width:761px){ :root{ --gutter:32px; } }

  .books-columns{display:grid; grid-template-columns:1fr 1fr; column-gap:32px; row-gap:22px; align-items:start;}
  @media (max-width:900px){ .books-columns{grid-template-columns:1fr;} }
  /* 제목·새로고침 버튼·데이터 기준 날짜를 한 줄에 몰아서 세로 공간을
     아낀다 -- 마지막 새로고침 시각·자동 갱신 주기 같은 한 번만 알면
     되는 정보는 제목 옆 ⓘ 아이콘 hover 툴팁으로 뺐다. */
  header{display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:28px 0 18px; border-bottom:1px solid var(--line-soft); margin-bottom:24px;}
  h1{font-family:'Noto Serif KR',serif; font-weight:400; font-size:30px; letter-spacing:-0.01em; margin:0; display:inline-flex; align-items:baseline; gap:8px;}
  @media (min-width:761px){ h1{font-size:36px;} }
  h1 .info-dot{font-size:15px;}
  .meta-text{color:var(--muted); font-size:12.5px;}
  .refresh{
    background:none; border:1px solid var(--line); color:var(--dim); cursor:pointer;
    border-radius:999px; padding:7px 15px; font-size:12.5px; font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    transition:background-color .2s,border-color .2s,color .2s;
  }
  .refresh:hover:not(:disabled){background:var(--ink); border-color:var(--ink); color:#fff;}
  .refresh:disabled{cursor:default; opacity:0.75;}
  .refresh.is-success{border-color:var(--good); color:var(--good);}
  .refresh.is-error{border-color:var(--bad); color:var(--bad);}
  .refresh.is-loading .refresh-icon{display:inline-block; animation:refresh-spin .7s linear infinite;}
  @keyframes refresh-spin{ to{ transform:rotate(360deg); } }

  /* ---- admin shell: 사이드바 ----
     insight-7b3e9f2c/index.html, multi-publish.html, write.html, sns-insight.html 과
     동일한 블록입니다. 메뉴를 바꾸면 다른 파일에도 똑같이 반영해야 합니다
     (Jekyll include가 아니라 순수 정적 HTML이라 공유가 안 됩니다). */
  #adminShellNav{position:fixed; top:0; left:0; bottom:0; width:180px; padding:24px 14px; background:#f7f6f2; border-right:1px solid var(--line-soft); overflow-y:auto; z-index:100;}
  #adminShellNav .shell-title{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; margin:0 0 16px; padding:0 10px;}
  #adminShellNav a{display:block; padding:9px 10px; margin-bottom:2px; border-radius:6px; color:var(--dim); text-decoration:none; font-size:14px;}
  #adminShellNav a:hover{background:var(--line-soft);}
  #adminShellNav a.active{background:var(--ink); color:#fff;}
  body.has-shell-nav{padding-left:180px;}
  @media (max-width:760px){
    #adminShellNav{position:static; width:auto; display:flex; gap:4px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line-soft); padding:10px 12px;}
    #adminShellNav .shell-title{display:none;}
    #adminShellNav a{white-space:nowrap; margin-bottom:0;}
    body.has-shell-nav{padding-left:0;}
  }

  .book-col-head h2{font-size:16px; font-weight:600; margin:0; display:flex; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .book-col-head .book-meta{font-size:12px; font-weight:400; color:var(--muted);}

  .source-header{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; font-weight:600; color:var(--dim);}
  .source-header img{height:16px; width:auto; display:block;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px;}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px 12px; min-width:0;}
  .tile.is-empty{opacity:0.45;}
  /* 대표 지표(판매지수/세일즈포인트/주간베스트)는 배경을 살짝 얹어서
     같은 서점의 다른 카테고리 카드들 사이에서 한눈에 띄게 한다. */
  .tile.tile-headline{background:#f7f6f2; border-color:var(--ink);}
  .tile.tile-headline .val{font-size:29px;}

  .tile .label{font-size:12px; color:var(--muted); margin-bottom:6px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tile .label a{color:inherit; text-decoration:none;}
  .tile .label a:hover{color:var(--ink); text-decoration:underline;}
  .tile .latest{display:flex; align-items:baseline; gap:7px;}
  .tile .val{font-weight:500; font-size:26px; line-height:1; letter-spacing:-0.01em;}
  .tile .val .unit{font-size:13px; color:var(--dim); margin-left:2px;}
  .tile .delta{font-size:12px; font-weight:600;}
  .tile .delta.up{color:var(--good);}
  .tile .delta.down{color:var(--bad);}
  /* 날짜/기록수/배지 카테고리명 같은 부가정보는 항상 보여주지 않고,
     이 점 아이콘에 마우스를 올렸을 때만 툴팁으로 보여준다 -- 핵심
     숫자와 그래프만 항상 보이게 해서 세로 공간을 아낀다. */
  .info-dot{margin-left:auto; font-size:11px; color:var(--muted); cursor:help; flex-shrink:0;}
  .tile svg{width:100%; height:40px; display:block; margin-top:6px;}
  .tile .empty{font-size:12px; color:var(--muted); padding:10px 0;}

  .loading, .err{font-size:13px; color:var(--muted); padding:20px 0;}
  .err{color:var(--bad);}
</style>

<script>
(function () {
  function escapeHtml(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* series: [{date, value}] (value는 null 가능, 렌더 전에 걸러짐).
     invert=true면 "낮을수록 좋음"(순위)인 지표 -- 선을 뒤집어서 좋아질수록
     위로 올라가는 것처럼 보이게 그린다.
     w: 내부 viewBox 가로폭(기본 200) -- 그리드에 카드가 1~3개만 있는
     그룹은 auto-fit이 남는 칸을 collapse시켜 카드가 실제로 훨씬 넓게
     렌더링된다. viewBox가 실제 폭보다 훨씬 좁으면 preserveAspectRatio="none"이
     가로로만 비균등하게 늘려서 끝점 원이 타원으로 찌그러지므로, 카드가
     넓어질 걸 아는 경우(그룹 안 카드 수가 적을 때) 호출부에서 더 넓은
     값을 넘긴다. */
  function sparkline(series, invert, w) {
    w = w || 200;
    var h = 44, pad = 4;
    var values = series.map(function (e) { return e.value; });
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var range = max - min || 1;

    var points = series.map(function (e, i) {
      var x = series.length === 1 ? w / 2 : pad + (i / (series.length - 1)) * (w - pad * 2);
      var normalized = invert ? (max - e.value) : (e.value - min);
      var y = h - pad - (normalized / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });

    var path = "M" + points.join(" L");
    var last = points[points.length - 1].split(",");

    return (
      '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="#121210" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="#121210"/>' +
      "</svg>"
    );
  }

  /* href가 있으면 타이틀을 그 출처 페이지로 새 창 링크로 만든다. */
  function labelHtml(text, href) {
    if (!href) return escapeHtml(text);
    return '<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(text) + " ↗</a>";
  }

  /* metric = { label, unit, higherIsBetter, note, href, headline }
     series = [{date, value}] (null 값은 이미 걸러서 넘김)
     noteOverride: 데이터에서 즉석으로 뽑아낸 note가 있으면 metric.note
     대신 이걸 쓴다 (예: 교보 배지의 실제 카테고리명).
     날짜/기록수/note는 항상 보여주지 않고 ⓘ 아이콘에 마우스를 올렸을 때만
     보이는 툴팁으로 묶는다 -- 숫자와 그래프(추세는 핵심 정보라 항상 유지)만
     남기고 세로 공간을 아낀다. */
  function tile(metric, series, noteOverride, w) {
    var clean = series.filter(function (e) { return e.value != null; });
    var cardClass = "tile" + (metric.headline ? " tile-headline" : "");
    var label = '<div class="label" title="' + escapeHtml(metric.label) + '">' + labelHtml(metric.label, metric.href) + "</div>";

    if (!clean.length) {
      // 오늘은 순위 밖이어도 내일 다시 잡힐 수 있으니, 카드를 아예 없애거나
      // 요약 줄로 접지 않고 자리는 그대로 두되 흐리게(딤드)만 한다 --
      // 카드가 나타났다 사라졌다 하면 레이아웃이 들쭉날쭉해서 오히려
      // 스캔하기 불편해진다.
      return '<div class="' + cardClass + ' is-empty">' + label + '<div class="empty">권외 · 데이터 없음</div></div>';
    }

    var latest = clean[clean.length - 1];
    var prev = clean.length > 1 ? clean[clean.length - 2] : null;
    var delta = prev ? latest.value - prev.value : null;
    var deltaHtml = "";
    if (delta) {
      /* 화살표는 숫자의 증감이 아니라 "좋아졌는지"를 가리킨다 -- 순위처럼
         낮을수록 좋은 지표는 숫자가 줄어도 개선이니 ▲(초록)으로 보여준다. */
      var isGood = metric.higherIsBetter ? delta > 0 : delta < 0;
      deltaHtml =
        '<span class="delta ' + (isGood ? "up" : "down") + '">' +
        (isGood ? "▲" : "▼") + Math.abs(delta) +
        "</span>";
    }

    var valDisplay = latest.value.toLocaleString();
    var note = noteOverride != null ? noteOverride : metric.note;
    var infoTitle = latest.date + " 기준 · " + clean.length + "개 기록" + (note ? " · " + note : "");

    return (
      '<div class="' + cardClass + '">' + label +
      '<div class="latest"><span class="val">' + valDisplay +
      (metric.unit ? '<span class="unit">' + escapeHtml(metric.unit) + "</span>" : "") +
      "</span>" + deltaHtml +
      '<span class="info-dot" title="' + escapeHtml(infoTitle) + '">ⓘ</span>' +
      "</div>" +
      sparkline(clean, !metric.higherIsBetter, w) +
      "</div>"
    );
  }

  /* isEmpty: 값이 없을 때(예: 리디북스 "평가 없음") 다른 빈 카드와 같은
     방식(딤드)으로 표시한다. */
  function staticTile(label, valueText, note, href, isEmpty) {
    return (
      '<div class="tile' + (isEmpty ? " is-empty" : "") + '"><div class="label" title="' + escapeHtml(label) + '">' + labelHtml(label, href) + '</div>' +
      '<div class="latest"><span class="val">' + escapeHtml(valueText) + "</span>" +
      (note ? '<span class="info-dot" title="' + escapeHtml(note) + '">ⓘ</span>' : "") +
      "</div></div>"
    );
  }

  /* 서점별로 묶어서 보여준다 -- 로고 반영, 카테고리는 전부 펼쳐서 보여준다.
     metrics 배열 순서가 곧 화면에 나열되는 순서(대표 지표 -> 상위 카테고리
     -> 하위 카테고리)다. g.customBodyHtml이 있으면(리디북스처럼 순위
     지표가 아닌 경우) metrics 대신 그걸 그대로 쓴다. */
  function tileFor(m, history, w) {
    var series = history.map(function (r) { return { date: r.date, value: m.get(r) }; });
    var note = m.noteGet ? m.noteGet(history[history.length - 1]) : null;
    return tile(m, series, note, w);
  }

  function sourceGroupHtml(g, history) {
    // 그룹 안 카드 수가 4개보다 적으면 auto-fit이 남는 칸을 collapse시켜
    // 카드가 그만큼 더 넓게 렌더링된다(밀리의서재처럼 카드가 1개뿐인
    // 그룹은 줄 전체 폭을 혼자 차지). 스파크라인 viewBox를 그 폭에 맞게
    // 넓혀줘야 끝점 원이 옆으로 늘어져 보이지 않는다.
    var w = g.metrics && g.metrics.length && g.metrics.length < 4 ? Math.round(660 / g.metrics.length) : 200;
    var bodyHtml = g.customBodyHtml != null
      ? g.customBodyHtml
      : g.metrics.map(function (m) { return tileFor(m, history, w); }).join("");
    return (
      '<div class="source-group">' +
      '<div class="source-header"><img src="' + escapeHtml(g.logo) + '" alt="" onerror="this.style.display=\'none\'">' +
      escapeHtml(g.label) + "</div>" +
      '<div class="tiles">' + bodyHtml + "</div>" +
      "</div>"
    );
  }

  /* 두 책을 좌우로 나란히 두되, 같은 서점끼리 같은 줄에서 시작하게
     맞춘다 -- 책마다 카테고리 개수가 달라서 그냥 위아래로만 쌓으면
     예스24/교보문고/알라딘 구간이 책마다 다른 높이에서 시작해 비교하기
     어려웠다. #bookGrid를 2열 grid로 두고, 서점 하나당 왼쪽 칸(UX책)과
     오른쪽 칸(질문법책)을 한 쌍으로 순서대로 넣으면, grid가 자동으로
     같은 서점을 같은 줄에 정렬해준다 -- 한쪽 책에 없는 서점(예: UX책엔
     밀리의서재가 없음)은 빈 칸으로 채워 줄이 안 밀리게 한다. */
  var STORE_ORDER = ["yes24", "kyobo", "aladin", "millie", "ridibooks"];

  function findGroup(groups, key) {
    return (groups || []).filter(function (g) { return g.key === key; })[0] || null;
  }

  function errorHtml(result) {
    if (result.notYet) {
      return '<div class="empty">아직 수집 전입니다. GitHub Actions에서 <code>Fetch book insight</code> 워크플로가 한 번 돌면 채워집니다 (매일 06:41 자동 실행).</div>';
    }
    return '<div class="err">불러오기 실패했습니다' + (result.message ? ": " + escapeHtml(result.message) : "") + "</div>";
  }

  function renderBookGrid(ux, q) {
    var html =
      '<div class="book-col-head"><h2>UX의 언어들 <span class="book-meta">한성희·신행철 저 · 파지트</span></h2></div>' +
      '<div class="book-col-head"><h2>기획자의 질문법 <span class="book-meta">한성희 저 · 파지트 · 2025-06-13 출간</span></h2></div>';

    STORE_ORDER.forEach(function (key) {
      var ug = findGroup(ux.groups, key);
      var qg = findGroup(q.groups, key);
      if (!ug && !qg) return;
      html += ug ? sourceGroupHtml(ug, ux.history) : "<div></div>";
      html += qg ? sourceGroupHtml(qg, q.history) : "<div></div>";
    });

    if (!ux.groups) html += errorHtml(ux) + "<div></div>";
    if (!q.groups) html += "<div></div>" + errorHtml(q);

    document.getElementById("bookGrid").innerHTML = html;
  }

  /* 순위 방향·데이터 수집 방식·자동 갱신 주기 같은 설명은 한 번 알면
     되는 정보라 제목 옆 ⓘ 아이콘 hover 툴팁에 몰아둔다. 여기에 매 새로고침마다
     바뀌는 "마지막 새로고침" 시각만 이어붙인다. */
  var TITLE_INFO_BASE =
    "출간한 책들의 서점 베스트셀러 순위·판매지수 추이입니다. 순위는 낮을수록(1위에 가까울수록) 좋습니다. " +
    "두 책 모두 이 저장소가 직접 예스24·알라딘·교보문고를 수집합니다(기획자의 질문법은 리디북스·밀리의서재도 추가). " +
    "하루 4번(05:02·06:41·11:23·17:37 KST) 자동 갱신되며, 지금 당장 갱신하려면 새로고침 버튼을 누르거나 " +
    "GitHub Actions에서 Fetch book insight 워크플로를 수동 실행하세요.";

  function stampRefresh() {
    var time = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("titleInfo").title = TITLE_INFO_BASE + " 마지막 새로고침: " + time + ".";
  }

  function setRefreshState(btn, state) {
    btn.classList.remove("is-loading", "is-success", "is-error");
    var icon = btn.querySelector(".refresh-icon");
    var label = btn.querySelector(".refresh-label");
    if (state === "loading") {
      btn.disabled = true; btn.classList.add("is-loading");
      icon.textContent = "↻"; label.textContent = "불러오는 중…";
    } else if (state === "success") {
      btn.disabled = false; btn.classList.add("is-success");
      icon.textContent = "✓"; label.textContent = "완료";
    } else if (state === "error") {
      btn.disabled = false; btn.classList.add("is-error");
      icon.textContent = "✕"; label.textContent = "실패";
    } else {
      btn.disabled = false;
      icon.textContent = "↻"; label.textContent = "새로고침";
    }
  }

  /* 각 타일에 반복해서 찍던 "OO 기준" 날짜를 페이지 상단 한 곳으로
     모은다 -- 어차피 하루 한 번 수집이라 거의 모든 타일이 같은 날짜다. */
  function stampDataAsOf(results) {
    var dates = results.map(function (r) {
      var h = r && r.history;
      return h && h.length ? h[h.length - 1].date : null;
    }).filter(Boolean);
    var el = document.getElementById("dataAsOf");
    if (!dates.length) { el.textContent = ""; return; }
    el.textContent = "· 데이터 기준 " + dates.sort().pop();
  }

  function load() {
    return Promise.all([loadUxBookGroups(), loadQuestionBookGroups()]).then(function (results) {
      renderBookGrid(results[0], results[1]);
      stampDataAsOf(results);
      return results[0].ok && results[1].ok;
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    var btn = this;
    setRefreshState(btn, "loading");
    load().then(function (ok) {
      stampRefresh();
      setRefreshState(btn, ok ? "success" : "error");
      setTimeout(function () { setRefreshState(btn, "idle"); }, 1600);
    });
  });
  load().then(function () { stampRefresh(); });

  /* ── UX의 언어들 (자체 수집 -- 기획자의 질문법과 동일한 방식) ──
     예전엔 cinaeng/ux-book-tracker(외부 저장소)를 미러링만 했는데, 그쪽
     스키마 변경에 이 페이지가 휘둘리는 걸 없애려고 다른 책과 같은 방식
     (이 저장소가 직접 예스24·알라딘·교보문고 스크래핑)으로 통일했다.
     예전 히스토리는 assets/data/ux-book-insight.json으로 마이그레이션해서
     그대로 이어붙였다. */
  function loadUxBookGroups() {
    return fetch("/assets/data/ux-book-insight.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw { notYet: r.status === 404 }; return r.json(); })
      .then(function (data) {
        var history = (data && data.history) || [];
        if (!history.length) return { ok: true, notYet: true, groups: null, history: null };
        return { ok: true, groups: buildUxGroups(history), history: history };
      })
      .catch(function (e) {
        return { ok: !!(e && e.notYet), notYet: !!(e && e.notYet), groups: null, history: null, message: e && e.notYet ? "" : String((e && e.message) || e) };
      });
  }

  function buildUxGroups(history) {
    var Y24_GOODS = "https://www.yes24.com/product/goods/193444437";
    var Y24_BEST = function (cat) { return "https://www.yes24.com/product/category/bestseller?categoryNumber=" + cat + "&pageNumber=1&pageSize=100"; };
    var ALADIN_PRODUCT = "https://www.aladin.co.kr/shop/wproduct.aspx?ItemId=397807838";
    var ALADIN_BEST = function (cid) { return "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=" + cid + "&BestType=Bestseller&cnt=100&SortOrder=1&page=1"; };
    var KYOBO_PRODUCT = "https://product.kyobobook.co.kr/detail/S000220493173";
    var KYOBO_UXUI = "https://store.kyobobook.co.kr/category/domestic/331902/best";
    var KYOBO_STRATEGY = "https://store.kyobobook.co.kr/category/domestic/130701/best";

    // 대표 지표(판매지수/세일즈포인트/주간베스트)를 맨 앞에 두고, 그 뒤로
    // 카테고리를 상위(넓은 카테고리)->하위(좁은 카테고리) 순으로 나열한다.
    // 예스24는 카테고리 코드 앞자리가 상위 카테고리를 그대로 물려받는
    // 구조라 실제 트리를 확인해 순서를 정했다: 경제경영종합 > 마케팅/세일즈
    // > 광고/홍보/PR (한 갈래), 웹사이트 > UX/UI (다른 갈래), 디자인(독립 갈래).
    // 서점 순서는 예스24 -> 교보문고 -> 알라딘.
    var groups = [
      {
        key: "yes24", label: "예스24", logo: "/assets/logos/yes24.png",
        metrics: [
          { key: "sales_index", label: "판매지수", unit: "", higherIsBetter: true, headline: true, href: Y24_GOODS, get: function (r) { return r.yes24 && r.yes24.sales_index; } },
          { key: "reviews", label: "리뷰 수", unit: "건", higherIsBetter: true, href: Y24_GOODS, get: function (r) { return r.yes24 && r.yes24.reviews; } },
          { key: "econ", label: "경제경영 종합", unit: "위", higherIsBetter: false, href: Y24_BEST("001001025"), get: function (r) { return r.yes24 && r.yes24.econ_rank; } },
          { key: "mkt", label: "마케팅/세일즈", unit: "위", higherIsBetter: false, href: Y24_BEST("001001025009"), get: function (r) { return r.yes24 && r.yes24.mkt_rank; } },
          { key: "ad", label: "광고/홍보/PR", unit: "위", higherIsBetter: false, href: Y24_BEST("001001025009006"), get: function (r) { return r.yes24 && r.yes24.ad_rank; } },
          { key: "web", label: "웹사이트", unit: "위", higherIsBetter: false, href: Y24_BEST("001001003020"), get: function (r) { return r.yes24 && r.yes24.web_rank; } },
          { key: "uxui", label: "UX/UI", unit: "위", higherIsBetter: false, href: Y24_BEST("001001003020004"), get: function (r) { return r.yes24 && r.yes24.uxui_rank; } },
          { key: "design", label: "디자인", unit: "위", higherIsBetter: false, href: Y24_BEST("001001007003004"), get: function (r) { return r.yes24 && r.yes24.design_rank; } },
        ],
      },
      {
        key: "kyobo", label: "교보문고", logo: "/assets/logos/kyobo.png",
        metrics: [
          // 라벨을 "온라인 주간"으로 고정해뒀었는데, 실제 배지 카테고리명은
          // 책마다 다르다(이 책은 "경제/경영"). 이름을 지어내는 대신 스크래핑
          // 시점에 실제로 읽은 카테고리명을 note로 그대로 보여준다.
          { key: "kyobo_badge", label: "주간베스트", unit: "위", higherIsBetter: false, headline: true, href: KYOBO_PRODUCT,
            get: function (r) { return r.kyobo && r.kyobo.badge_rank; },
            noteGet: function (r) { return r.kyobo && r.kyobo.badge_category ? "카테고리: " + r.kyobo.badge_category : null; } },
          { key: "kyobo_strategy", label: "경영전략일반", unit: "위", higherIsBetter: false, href: KYOBO_STRATEGY, get: function (r) { return r.kyobo && r.kyobo.strategy_rank; } },
          { key: "kyobo_uxui", label: "UX/UI", unit: "위", higherIsBetter: false, href: KYOBO_UXUI, get: function (r) { return r.kyobo && r.kyobo.uxui_cat; } },
        ],
      },
      {
        key: "aladin", label: "알라딘", logo: "/assets/logos/aladin.jpg",
        metrics: [
          { key: "aladin_sp", label: "세일즈포인트", unit: "", higherIsBetter: true, headline: true, href: ALADIN_PRODUCT, get: function (r) { return r.aladin && r.aladin.sales_point; } },
          { key: "aladin_brand", label: "마케팅/브랜드", unit: "위", higherIsBetter: false, href: ALADIN_BEST("1632"), get: function (r) { return r.aladin && r.aladin.brand_rank; } },
          { key: "aladin_ad", label: "광고/홍보/PR", unit: "위", higherIsBetter: false, href: ALADIN_BEST("268"), get: function (r) { return r.aladin && r.aladin.ad_rank; } },
          { key: "aladin_design", label: "디자인이야기", unit: "위", higherIsBetter: false, href: ALADIN_BEST("51089"), get: function (r) { return r.aladin && r.aladin.design_rank; } },
        ],
      },
    ];

    return groups;
  }

  /* ── 기획자의 질문법 (자체 수집) ── */
  function loadQuestionBookGroups() {
    return fetch("/assets/data/book-insight.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw { notYet: r.status === 404 }; return r.json(); })
      .then(function (data) {
        var history = (data && data.history) || [];
        if (!history.length) return { ok: true, notYet: true, groups: null, history: null };
        return { ok: true, groups: buildQuestionGroups(history), history: history };
      })
      .catch(function (e) {
        return { ok: !!(e && e.notYet), notYet: !!(e && e.notYet), groups: null, history: null, message: e && e.notYet ? "" : String((e && e.message) || e) };
      });
  }

  function buildQuestionGroups(history) {
    var Y24_GOODS = "https://www.yes24.com/product/goods/147079674";
    var Y24_BEST = "https://www.yes24.com/product/category/bestseller?categoryNumber=001001026003&pageNumber=1&pageSize=100";
    var Y24_BEST2 = "https://www.yes24.com/product/category/bestseller?categoryNumber=001001025001004&pageNumber=1&pageSize=100";
    var ALADIN_PRODUCT = "https://www.aladin.co.kr/shop/wproduct.aspx?ItemId=364986311";
    var ALADIN_BEST = function (cid) { return "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=" + cid + "&BestType=Bestseller&cnt=100&SortOrder=1&page=1"; };
    var KYOBO_PRODUCT = "https://product.kyobobook.co.kr/detail/S000216681258";
    var KYOBO_CAT = "https://store.kyobobook.co.kr/category/domestic/150503/best";

    // 서점 순서는 예스24 -> 교보문고 -> 알라딘 -> 밀리의서재.
    var groups = [
      {
        key: "yes24", label: "예스24", logo: "/assets/logos/yes24.png",
        metrics: [
          { key: "y24si", label: "판매지수", unit: "", higherIsBetter: true, headline: true, href: Y24_GOODS, get: function (r) { return r.yes24 && r.yes24.sales_index; } },
          { key: "y24rv", label: "리뷰 수", unit: "건", higherIsBetter: true, href: Y24_GOODS, get: function (r) { return r.yes24 && r.yes24.reviews; } },
          { key: "y24cat", label: "기획/정보/시간관리", unit: "위", higherIsBetter: false, href: Y24_BEST, get: function (r) { return r.yes24 && r.yes24.category_rank; } },
          { key: "y24cat2", label: "CEO/비즈니스맨 기획/정보/시간관리", unit: "위", higherIsBetter: false, href: Y24_BEST2, get: function (r) { return r.yes24 && r.yes24.category2_rank; } },
        ],
      },
      {
        key: "kyobo", label: "교보문고", logo: "/assets/logos/kyobo.png",
        metrics: [
          // "온라인 주간"으로 라벨을 고정해뒀었는데, 실제 배지 카테고리명은
          // 책마다 다르다(이 책은 "자기계발"). 이름을 지어내는 대신 스크래핑
          // 시점에 실제로 읽은 카테고리명을 note로 그대로 보여준다.
          { key: "kybadge", label: "주간베스트", unit: "위", higherIsBetter: false, headline: true, href: KYOBO_PRODUCT,
            get: function (r) { return r.kyobo && r.kyobo.badge_rank; },
            noteGet: function (r) { return r.kyobo && r.kyobo.badge_category ? "카테고리: " + r.kyobo.badge_category : null; } },
          { key: "kycat", label: "기획력", unit: "위", higherIsBetter: false, href: KYOBO_CAT, get: function (r) { return r.kyobo && r.kyobo.category_rank; } },
        ],
      },
      {
        key: "aladin", label: "알라딘", logo: "/assets/logos/aladin.jpg",
        metrics: [
          { key: "alsp", label: "세일즈포인트", unit: "", higherIsBetter: true, headline: true, href: ALADIN_PRODUCT, get: function (r) { return r.aladin && r.aladin.sales_point; } },
          { key: "alplan", label: "기획", unit: "위", higherIsBetter: false, href: ALADIN_BEST("70229"), get: function (r) { return r.aladin && r.aladin.planning_rank; } },
          { key: "alinfo", label: "정보관리", unit: "위", higherIsBetter: false, href: ALADIN_BEST("70222"), get: function (r) { return r.aladin && r.aladin.info_mgmt_rank; } },
        ],
      },
      {
        key: "millie", label: "밀리의서재", logo: "/assets/logos/millie.png",
        metrics: [
          { key: "millie", label: "자기계발>기획 인기순", unit: "위", higherIsBetter: false, href: "https://www.millie.co.kr/v3/search/3depth/1298/?parentSeq=1287&nav_hidden=y", get: function (r) { return r.millie && r.millie.category_rank; } },
        ],
      },
    ];

    // 리디북스는 순위 자체가 없는 참고용 정적 지표라, 스파크라인이 있는
    // 다른 그룹과 다르게 customBodyHtml로 직접 넣는다.
    var latest = history[history.length - 1];
    var ridi = latest && latest.ridibooks;
    if (ridi) {
      groups.push({
        key: "ridibooks", label: "리디북스", logo: "/assets/logos/ridi.png",
        customBodyHtml: staticTile(
          "참고",
          ridi.rating ? ridi.rating.toFixed(1) + "점" : "평가 없음",
          "평가 " + (ridi.rating_count || 0) + "명 · 베스트셀러 순위 없음(전자책 전용 플랫폼)",
          "https://ridibooks.com/books/2234005394",
          !ridi.rating
        ),
      });
    }

    return groups;
  }
})();
