<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콘텐츠 인사이트 - Simplifier</title>

<!-- 이 페이지는 검색에 노출되면 안 됩니다.
     robots.txt에 Disallow를 쓰면 오히려 주소가 공개되므로, 여기서 noindex만 겁니다.
     sitemap.xml에도 넣지 마세요. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="/insight-7b3e9f2c/studio.css">

<style>
  /* 이 페이지 카드 안 ⓘ는 studio.css 기본값(420px)보다 좁게 쓴다(다른
     인사이트 페이지와 동일한 관례). */
  .info-text{max-width:min(360px, 90vw);}

  .source-header{display:flex; align-items:center; gap:8px; margin:28px 0 12px; font-size:14px; font-weight:600; color:var(--dim);}
  .source-header .shortcut-link{font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; border:1px solid var(--line-soft); border-radius:5px; width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; line-height:1;}
  .source-header .shortcut-link:hover{color:var(--ink); border-color:var(--ink);}

  /* 정렬 전환(최신순/인기순) -- 섹션 헤더 오른쪽 끝에 붙인다. info-dot과
     달리 "설명"이 아니라 그 자체가 조작 가능한 컨트롤이라 STYLE_GUIDE의
     info-dot 배치 규칙(줄 끝에 밀어두지 않기)과는 무관하다. */
  .sort-toggle{display:flex; gap:4px; margin-left:auto;}
  .sort-btn{font-size:11.5px; font-weight:600; color:var(--muted); background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer;}
  .sort-btn:hover{color:var(--ink); border-color:var(--ink);}
  .sort-btn.is-active{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* 채널 요약은 studio.css .tile.tile-accent 표준을 그대로 쓴다(다른
     인사이트 페이지와 통일, 2026-08-30 규칙). */
  .channel-card .foot{margin-top:10px;}
  .channel-card svg{width:100%; height:44px; display:block; margin-top:10px;}

  /* 네이버 블로그 게시글은 썸네일 없는 텍스트 카드라 book-insight.html과
     같은 .tile/.tile-sm 표준 + label-text 말줄임 패턴을 그대로 쓴다. */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .tile .label{display:flex; align-items:center; gap:4px;}
  .tile .label-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .tile .label a{color:inherit; text-decoration:none;}
  .tile .label a:hover{color:var(--ink); text-decoration:underline;}
  .tile svg{width:100%; height:36px; display:block; margin-top:8px;}

  /* 영상 카드는 .tile 표준과 다른 모양(썸네일이 있는 카드)이라 이 페이지
     고유로 선언한다 -- 숏츠는 세로(9:16) 포맷이라 썸네일도 세로로 둔다. */
  .video-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:14px;}
  .video-card{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; min-width:0;}
  .video-card .thumb-wrap{width:100%; aspect-ratio:9/16; background:var(--line-soft); overflow:hidden;}
  .video-card .thumb{width:100%; height:100%; object-fit:cover; display:block;}
  .video-card .body{padding:10px 12px 12px;}
  .video-card .title{font-size:12.5px; font-weight:600; line-height:1.4; margin:0 0 8px; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .video-card .title a{color:inherit; text-decoration:none;}
  .video-card .title a:hover{text-decoration:underline;}
  .video-card .latest{display:flex; align-items:baseline; gap:6px;}
  .video-card .val{font-weight:500; font-size:19px; letter-spacing:-0.01em;}
  .video-card .val .unit{font-size:11px; color:var(--dim); margin-left:2px;}
  .video-card .delta{font-size:11px; font-weight:600;}
  .video-card .delta.up{color:var(--good);}
  .video-card .delta.down{color:var(--bad);}
  .video-card .secondary{font-size:11px; color:var(--muted); margin-top:5px;}
  .video-card .top-comment{font-size:11px; color:var(--dim); margin-top:6px; font-style:italic; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .video-card .date-badge{font-size:10.5px; color:var(--muted); margin-top:6px;}
  .video-card svg{width:100%; height:26px; display:block; margin-top:7px;}
  .video-card.is-empty .body{color:var(--muted); font-size:12px; text-align:center; padding:24px 12px;}
</style>
</head>
<body class="has-shell-nav">
<nav id="adminShellNav"></nav>

<div class="wrap">
  <header>
    <h1>콘텐츠 인사이트<button type="button" class="info-dot" id="titleInfo" aria-label="설명 보기">ⓘ<span class="info-text" id="titleInfoText"></span></button></h1>
    <button class="refresh" id="refreshBtn"><span class="refresh-icon">↻</span> <span class="refresh-label">새로고침</span></button>
    <span id="dataAsOf" class="meta-text"></span>
  </header>

  <div id="channelArea"><div class="loading">데이터 불러오는 중…</div></div>
  <div id="videoArea"></div>
  <div id="blogArea"></div>
  <div id="clipArea"></div>
</div>

<script>
(function () {
  var DATA_URL = "/assets/data/youtube-insight.json";
  var CHANNEL_URL = "https://www.youtube.com/@sinkihanapt";
  var NAVER_DATA_URL = "/assets/data/naver-content.json";
  var BLOG_URL = "https://blog.naver.com/sinkihanapt";
  var CLIP_URL = "https://clip.naver.com/@simkihanapt";

  var TITLE_INFO_BASE =
    "\"신기한 아파트사전\" 채널의 콘텐츠 성과입니다 — 유튜브 숏츠(채널 지표 + 영상별 조회수·좋아요·댓글), " +
    "네이버 블로그(게시글별 조회수), 네이버 클립(조회수)을 모읍니다. " +
    "유튜브 숏츠 판정은 영상 길이 3분(180초) 이하 기준입니다. " +
    "하루 2번(유튜브 05:37·19:37, 네이버 05:43·19:43 KST) 자동 갱신되며, 지금 당장 갱신하려면 " +
    "새로고침 버튼을 누르거나 GitHub Actions에서 해당 워크플로를 수동 실행하세요.";

  function escapeHtml(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function sparkline(series, getVal, w, h) {
    w = w || 260; h = h || 44;
    var pad = 4;
    var values = series.map(getVal);
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var range = max - min || 1;

    var points = series.map(function (e, i) {
      var x = series.length === 1 ? w / 2 : pad + (i / (series.length - 1)) * (w - pad * 2);
      var y = h - pad - ((getVal(e) - min) / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });

    var path = "M" + points.join(" L");
    var last = points[points.length - 1].split(",");

    return (
      '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="#121210" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="#121210"/>' +
      "</svg>"
    );
  }

  function deltaHtml(delta) {
    if (!delta) return "";
    return '<span class="delta ' + (delta > 0 ? "up" : "down") + '">' + (delta > 0 ? "▲" : "▼") + Math.abs(delta).toLocaleString() + "</span>";
  }

  function renderChannel(data) {
    var ch = data.channel || {};
    var history = ch.history || [];
    var el = document.getElementById("channelArea");

    if (!history.length) {
      el.innerHTML = '<div class="empty">아직 수집 전입니다. GitHub Actions에서 <code>Fetch YouTube shorts</code> 워크플로가 한 번 돌면 채워집니다 (매일 05:37 자동 실행).</div>';
      return;
    }

    var latest = history[history.length - 1];
    var prev = history.length > 1 ? history[history.length - 2] : null;
    var delta = prev ? latest.subscribers - prev.subscribers : null;

    el.innerHTML =
      '<div class="tile tile-accent channel-card">' +
      '<div class="label">' + escapeHtml(ch.title || "유튜브 채널") +
      ' <a class="shortcut-link" href="' + escapeHtml(CHANNEL_URL) + '" target="_blank" rel="noopener noreferrer" aria-label="채널 바로가기">↗</a></div>' +
      '<div class="latest"><span class="val">' + latest.subscribers.toLocaleString() + '<span class="unit">명 구독</span></span>' + deltaHtml(delta) + "</div>" +
      '<div class="foot">총 조회수 ' + latest.total_views.toLocaleString() + " · 영상 " + latest.video_count.toLocaleString() + "개</div>" +
      sparkline(history, function (e) { return e.subscribers; }, 900) +
      "</div>";
  }

  function videoCardHtml(video) {
    var history = video.history || [];
    var clean = history.filter(function (e) { return e.views != null; });
    if (!clean.length) {
      return '<div class="video-card is-empty"><div class="body">데이터 없음</div></div>';
    }

    var latest = clean[clean.length - 1];
    var prev = clean.length > 1 ? clean[clean.length - 2] : null;
    var delta = prev ? latest.views - prev.views : null;

    var secondary = [];
    if (latest.likes != null) secondary.push("좋아요 " + latest.likes.toLocaleString());
    if (latest.comments != null) secondary.push("댓글 " + latest.comments.toLocaleString());

    // 관련도순 1등 댓글만 짧게 보여준다 -- 카드가 수십 개인 화면에서
    // 댓글 전체를 다 늘어놓으면 스캔하기 어려워지므로, "반응이 어떤지"
    // 감을 잡는 용도로 한 줄만 쓴다. 전체는 영상 링크에서 직접 본다.
    var topCommentHtml = "";
    if (video.top_comments && video.top_comments.length) {
      var top = video.top_comments[0];
      topCommentHtml = '<div class="top-comment">"' + escapeHtml(top.text || "") + '" — ' + escapeHtml(top.author || "") + "</div>";
    }

    var dateBadge = "";
    if (video.published_at) {
      var d = new Date(video.published_at);
      dateBadge = '<div class="date-badge">' + d.toLocaleDateString("ko-KR", { month: "2-digit", day: "2-digit" }) + " 게시</div>";
    }

    // video.url이 있으면(클립처럼 자체 링크가 있는 콘텐츠) 그걸 쓰고,
    // 없으면(유튜브 숏츠) id로 시청 URL을 조립한다.
    var watchUrl = video.url || ("https://www.youtube.com/shorts/" + encodeURIComponent(video.id));
    var thumb = '<div class="thumb-wrap">' + (video.thumbnail ? '<img class="thumb" src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy">' : "") + "</div>";

    return (
      '<div class="video-card">' + thumb +
      '<div class="body">' +
      '<p class="title"><a href="' + escapeHtml(watchUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(video.title || "(제목 없음)") + "</a></p>" +
      '<div class="latest"><span class="val">' + latest.views.toLocaleString() + '<span class="unit">회</span></span>' + deltaHtml(delta) + "</div>" +
      (secondary.length ? '<div class="secondary">' + escapeHtml(secondary.join(" · ")) + "</div>" : "") +
      topCommentHtml +
      (clean.length > 1 ? sparkline(clean, function (e) { return e.views; }, 200, 40) : "") +
      dateBadge +
      "</div></div>"
    );
  }

  var sortMode = "recent"; // "recent" | "views"

  function latestViews(v) {
    var clean = (v.history || []).filter(function (e) { return e.views != null; });
    return clean.length ? clean[clean.length - 1].views : -1;
  }

  function renderVideos(data) {
    var videos = data.videos || {};
    var el = document.getElementById("videoArea");
    var ids = Object.keys(videos);
    if (!ids.length) {
      el.innerHTML = "";
      return;
    }

    if (sortMode === "views") {
      // 조회수 내림차순 -- "뭐가 잘 됐는지" 바로 보고 싶을 때.
      ids.sort(function (a, b) { return latestViews(videos[b]) - latestViews(videos[a]); });
    } else {
      // 기본값: 최신 업로드가 먼저 보이게 게시일 내림차순 -- 크리에이터가
      // 새 영상 성과를 가장 먼저 확인하고 싶어할 것이므로.
      ids.sort(function (a, b) {
        return (videos[b].published_at || "").localeCompare(videos[a].published_at || "");
      });
    }

    var html =
      '<div class="source-header">유튜브 숏츠 <a class="shortcut-link" href="' + escapeHtml(CHANNEL_URL + "/shorts") + '" target="_blank" rel="noopener noreferrer" aria-label="채널 숏츠 바로가기">↗</a>' +
      '<div class="sort-toggle" role="group" aria-label="정렬">' +
      '<button type="button" class="sort-btn' + (sortMode === "recent" ? " is-active" : "") + '" data-sort="recent">최신순</button>' +
      '<button type="button" class="sort-btn' + (sortMode === "views" ? " is-active" : "") + '" data-sort="views">인기순</button>' +
      "</div></div>";
    html += '<div class="video-grid">' + ids.map(function (id) {
      var v = videos[id];
      v.id = id;
      return videoCardHtml(v);
    }).join("") + "</div>";
    el.innerHTML = html;

    el.querySelectorAll(".sort-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (sortMode === btn.dataset.sort) return;
        sortMode = btn.dataset.sort;
        renderVideos(lastData);
      });
    });
  }

  function blogPostTileHtml(post) {
    var history = (post.history || []).filter(function (e) { return e.views != null; });
    if (!history.length) return "";

    var latest = history[history.length - 1];
    var prev = history.length > 1 ? history[history.length - 2] : null;
    var delta = prev ? latest.views - prev.views : null;

    var labelText =
      '<span class="label-text" title="' + escapeHtml(post.title || "") + '">' +
      '<a href="' + escapeHtml(post.url || "#") + '" target="_blank" rel="noopener noreferrer">' +
      escapeHtml(post.title || "(제목 없음)") + " ↗</a></span>";

    return (
      '<div class="tile tile-sm"><div class="label">' + labelText + "</div>" +
      '<div class="latest"><span class="val">' + latest.views.toLocaleString() + '<span class="unit">회</span></span>' + deltaHtml(delta) + "</div>" +
      (history.length > 1 ? sparkline(history, function (e) { return e.views; }, 200, 36) : "") +
      "</div>"
    );
  }

  function renderBlogPosts(data) {
    var posts = data.posts || {};
    var el = document.getElementById("blogArea");
    var ids = Object.keys(posts).filter(function (id) {
      return (posts[id].history || []).some(function (e) { return e.views != null; });
    });
    if (!ids.length) { el.innerHTML = ""; return; }

    // 게시일 내림차순(최신 글 먼저) -- 유튜브 섹션 기본 정렬과 동일한 기준.
    ids.sort(function (a, b) { return (posts[b].published_at || "").localeCompare(posts[a].published_at || ""); });

    el.innerHTML =
      '<div class="source-header">네이버 블로그 <a class="shortcut-link" href="' + escapeHtml(BLOG_URL) + '" target="_blank" rel="noopener noreferrer" aria-label="블로그 바로가기">↗</a></div>' +
      '<div class="tiles">' + ids.map(function (id) { return blogPostTileHtml(posts[id]); }).join("") + "</div>";
  }

  function renderClips(data) {
    var clips = data.clips || {};
    var el = document.getElementById("clipArea");
    var ids = Object.keys(clips).filter(function (id) {
      return (clips[id].history || []).some(function (e) { return e.views != null; });
    });
    if (!ids.length) { el.innerHTML = ""; return; }

    // 클립은 게시일을 안 모으므로(수집 근거가 약해 우선 조회수만) 조회수
    // 내림차순으로 보여준다.
    ids.sort(function (a, b) { return latestViews(clips[b]) - latestViews(clips[a]); });

    el.innerHTML =
      '<div class="source-header">네이버 클립 <a class="shortcut-link" href="' + escapeHtml(CLIP_URL) + '" target="_blank" rel="noopener noreferrer" aria-label="클립 바로가기">↗</a></div>' +
      '<div class="video-grid">' + ids.map(function (id) {
        var c = clips[id];
        c.id = id;
        return videoCardHtml(c);
      }).join("") + "</div>";
  }

  // 소스가 두 개(유튜브·네이버)라 각자 updated_at을 갖는다 -- 더 최근
  // 시각을 대표값으로 보여준다(book-insight.html과 동일한 방식).
  function stampDataAsOf(dataList) {
    var el = document.getElementById("dataAsOf");
    var times = dataList.map(function (d) { return d && d.updated_at ? new Date(d.updated_at) : null; }).filter(Boolean);
    if (!times.length) { el.textContent = ""; return; }
    var latest = times.reduce(function (a, b) { return b > a ? b : a; });
    var y = latest.getFullYear(), m = String(latest.getMonth() + 1).padStart(2, "0"), day = String(latest.getDate()).padStart(2, "0");
    var time = latest.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    el.textContent = "· 데이터 기준 " + y + "-" + m + "-" + day + " " + time;
  }

  function stampTitleInfo() {
    var time = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("titleInfoText").textContent = TITLE_INFO_BASE + " 마지막 새로고침: " + time + ".";
  }

  var lastData = {};
  var lastNaverData = {};

  function fetchJson(url) {
    return fetch(url + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; });
  }

  function load() {
    return Promise.all([fetchJson(DATA_URL), fetchJson(NAVER_DATA_URL)])
      .then(function (results) {
        lastData = results[0] || {};
        lastNaverData = results[1] || {};
        renderChannel(lastData);
        renderVideos(lastData);
        renderBlogPosts(lastNaverData);
        renderClips(lastNaverData);
        stampDataAsOf([lastData, lastNaverData]);
        return true;
      })
      .catch(function (e) {
        document.getElementById("channelArea").innerHTML = '<div class="err">불러오기 실패했습니다: ' + escapeHtml(String(e)) + "</div>";
        return false;
      });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    var btn = this;
    Studio.setRefreshState(btn, "loading");
    load().then(function (ok) {
      stampTitleInfo();
      Studio.setRefreshState(btn, ok ? "success" : "error");
      setTimeout(function () { Studio.setRefreshState(btn, "idle"); }, 1600);
    });
  });
  load().then(function () { stampTitleInfo(); });
})();
</script>
<script src="/insight-7b3e9f2c/studio.js"></script>
</body>
</html>
