<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콘텐츠 인사이트 - Simplifier</title>

<!-- 이 페이지는 검색에 노출되면 안 됩니다.
     robots.txt에 Disallow를 쓰면 오히려 주소가 공개되므로, 여기서 noindex만 겁니다.
     sitemap.xml에도 넣지 마세요. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="/insight-7b3e9f2c/studio.css">

<style>
  /* 이 페이지 카드 안 ⓘ는 studio.css 기본값(420px)보다 좁게 쓴다(다른
     인사이트 페이지와 동일한 관례). */
  .info-text{max-width:min(360px, 90vw);}

  .source-header{display:flex; align-items:center; gap:8px; margin:28px 0 12px; font-size:14px; font-weight:600; color:var(--dim);}
  /* 예전엔 화살표(↗) 아이콘만 별도 링크였다 -- 클릭 영역이 너무 작다는
     지적(2026-09-01)으로, 타이틀 전체를 링크에 포함시킨다. 화살표는 그
     안에 딸린 글자로만 남긴다(UX_GUIDE.md 1.4 참고). */
  .source-header a{color:inherit; text-decoration:none;}
  .source-header a:hover{text-decoration:underline;}

  /* 정렬 전환(최신순/인기순) -- 섹션 헤더 오른쪽 끝에 붙인다. info-dot과
     달리 "설명"이 아니라 그 자체가 조작 가능한 컨트롤이라 STYLE_GUIDE의
     info-dot 배치 규칙(줄 끝에 밀어두지 않기)과는 무관하다. */
  .sort-toggle{display:flex; gap:4px; margin-left:auto;}
  .sort-btn{font-size:11.5px; font-weight:600; color:var(--muted); background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer;}
  .sort-btn:hover{color:var(--ink); border-color:var(--ink);}
  .sort-btn.is-active{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* 채널 요약은 studio.css .tile.tile-accent 표준을 그대로 쓴다(다른
     인사이트 페이지와 통일, 2026-08-30 규칙). */
  .channel-card{margin-bottom:14px;}
  .channel-card .foot{margin-top:10px;}
  .channel-card svg{width:100%; height:44px; display:block; margin-top:10px;}

  /* 네이버 블로그 게시글은 썸네일 없는 텍스트 카드라 book-insight.html과
     같은 .tile/.tile-sm 표준 + label-text 말줄임 패턴을 그대로 쓴다. */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .tile .label{display:flex; align-items:center; gap:4px;}
  .tile .label-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .tile .label a{color:inherit; text-decoration:none;}
  .tile .label a:hover{color:var(--ink); text-decoration:underline;}
  .tile svg{width:100%; height:36px; display:block; margin-top:8px;}

  /* 영상 카드는 .tile 표준과 다른 모양(썸네일이 있는 카드)이라 이 페이지
     고유로 선언한다 -- 숏츠는 세로(9:16) 포맷이라 썸네일도 세로로 둔다. */
  .video-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:14px;}
  .video-card{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; min-width:0;}
  .video-card .thumb-wrap{position:relative; width:100%; aspect-ratio:9/16; background:var(--line-soft); overflow:hidden;}
  .video-card .thumb{width:100%; height:100%; object-fit:cover; display:block;}
  .video-card .platform-badge{position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .video-card .platform-badge svg{width:13px; height:13px; display:block;}
  .platform-badge.pf-youtube{background:#FF0000;}
  .platform-badge.pf-naver_clip{background:#03C75A;}
  .platform-badge.pf-content_instagram{background:radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);}
  .platform-badge.pf-content_threads{background:#000;}
  .platform-badge.pf-content_facebook{background:#1877F2;}
  .platform-badge.pf-content_tiktok{background:#000;}
  .platform-badge.pf-content_x{background:#000;}
  .video-card .body{padding:10px 12px 12px;}
  .video-card .title{font-size:12.5px; font-weight:600; line-height:1.4; margin:0 0 8px; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .video-card .title a{color:inherit; text-decoration:none;}
  .video-card .title a:hover{text-decoration:underline;}
  .video-card .latest{display:flex; align-items:baseline; gap:6px;}
  .video-card .val{font-weight:500; font-size:19px; letter-spacing:-0.01em;}
  .video-card .val .unit{font-size:11px; color:var(--dim); margin-left:2px;}
  .video-card .delta{font-size:11px; font-weight:600;}
  .video-card .delta.up{color:var(--good);}
  .video-card .delta.down{color:var(--bad);}
  .video-card .secondary{font-size:11px; color:var(--muted); margin-top:5px;}
  .video-card .top-comment{font-size:11px; color:var(--dim); margin-top:6px; font-style:italic; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .video-card .date-badge{font-size:10.5px; color:var(--muted); margin-top:6px;}
  .video-card svg{width:100%; height:26px; display:block; margin-top:7px;}
  .video-card.is-empty .body{color:var(--muted); font-size:12px; text-align:center; padding:24px 12px;}
</style>
</head>

<div class="wrap">
  <header>
    <h1>콘텐츠 인사이트<button type="button" class="info-dot" id="titleInfo" aria-label="설명 보기">ⓘ<span class="info-text" id="titleInfoText"></span></button></h1>

</div>

<script>
(function () {
  var DATA_URL = "/assets/data/youtube-insight.json";
  var NAVER_DATA_URL = "/assets/data/naver-content.json";
  var BLOG_URL = "https://blog.naver.com/sinkihanapt";

  // 유튜브를 포함한 7개 채널을 전부 같은 레벨(카드 크기·정렬 방식)로
  // 다룬다(2026-09-01, "최상단이 유튜브만 특별 취급되는 게 이상하다"는
  // 지적으로 통합) -- 유튜브·네이버 블로그를 뺀 나머지는 로그인 세션이
  // 있어야 보이는 화면(또는 봇 차단이 심한 사이트)이라 서버 자동화로는
  // 못 읽는다(네이버 클립 API가 "Session not found"로 거절한 걸 실측
  // 확인, scripts/fetch_naver_content.py 참고). 대신 사장님이 실제
  // 로그인해 쓰는 크롬 확장(_sns-extension)이 각 채널 페이지를 방문할
  // 때 팔로워 등 채널 요약 수치를 읽어 기록한다.
  var CHANNEL_META = {
    youtube: { label: "유튜브", url: "https://www.youtube.com/@sinkihanapt", unit: "명 구독" },
    naver_clip: { label: "네이버 클립", url: "https://clip.naver.com/@simkihanapt", unit: "명 팔로워" },
    content_instagram: { label: "인스타그램", url: "https://www.instagram.com/sinkihanapt/", unit: "명 팔로워" },
    content_threads: { label: "스레드", url: "https://www.threads.com/@sinkihanapt", unit: "명 팔로워" },
    content_facebook: { label: "페이스북", url: "https://www.facebook.com/profile.php?id=61593748241305", unit: "명 팔로워" },
    content_tiktok: { label: "틱톡", url: "https://www.tiktok.com/@sinkihanapt", unit: "명 팔로워" },
    content_x: { label: "X", url: "https://x.com/sinkihanapt", unit: "명 팔로워" },
  };
  var CHANNEL_URL = CHANNEL_META.youtube.url;

  // 콘텐츠 개별 성과 카드가 여러 플랫폼을 한 그리드에 섞어 보여주므로,
  // id 접두사(naver_clip_·content_instagram_ 등, 클립 수집 시 "플랫폼_
  // 원본id"로 만든 키)로 출처를 되짚어 썸네일 위에 로고 배지를 붙인다
  // (2026-09-01, "어느 채널인지 식별돼야 한다"는 요청). id에 접두사가
  // 없으면 유튜브 원본 영상id 그대로다.
  var PLATFORM_ICON = {
    youtube: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>',
    naver_clip: '<svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Arial,sans-serif">N</text></svg>',
    content_instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>',
    content_threads: '<svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Arial,sans-serif">@</text></svg>',
    content_facebook: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 21v-8.5H16l.5-3.5h-3V6.7c0-1 .3-1.7 1.7-1.7H16V1.8C15.7 1.8 14.7 1.7 13.6 1.7c-2.5 0-4.1 1.5-4.1 4.3V9H7v3.5h2.5V21h4z"/></svg>',
    content_tiktok: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M16.5 3c.3 2.4 1.8 4 4.2 4.2v3c-1.5 0-2.9-.5-4.2-1.4v6.7c0 3.6-2.9 6.5-6.5 6.5S3.5 19.1 3.5 15.5 6.4 9 10 9c.3 0 .6 0 .9.1v3.1c-.3-.1-.6-.1-.9-.1-1.9 0-3.4 1.5-3.4 3.4s1.5 3.4 3.4 3.4 3.5-1.5 3.5-3.4V3h3z"/></svg>',
    content_x: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M18.9 3H21l-6.6 7.5L22 21h-6.1l-4.8-6.3L5.5 21H3.4l7-8L2 3h6.2l4.4 5.8L18.9 3zM17.8 19.3h1.6L8.3 4.6H6.6l11.2 14.7z"/></svg>',
  };

  function contentPlatformKey(id) {
    var keys = Object.keys(CHANNEL_META);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i] !== "youtube" && id.indexOf(keys[i] + "_") === 0) return keys[i];
    }
    return "youtube";
  }

  function platformBadgeHtml(id) {
    var key = contentPlatformKey(id);
    return '<span class="platform-badge pf-' + key + '" title="' + escapeHtml(CHANNEL_META[key].label) + '">' + PLATFORM_ICON[key] + "</span>";
  }

  var TITLE_INFO_BASE =
    "\"신기한 아파트사전\" 채널의 콘텐츠 성과입니다. 위 \"채널\" 카드 7개(유튜브·네이버 클립·" +
    "인스타그램·스레드·페이스북·틱톡·X)는 실제로 값이 잘 잡히는 채널일수록 위에 오도록 자동 " +
    "정렬됩니다. 아래 \"콘텐츠 개별 성과\"는 유튜브 숏츠·인스타 릴스·틱톡 영상의 개별 조회수를 " +
    "모아 최신순/인기순으로 보여줍니다(유튜브 숏츠 판정은 영상 길이 3분 이하 기준). " +
    "유튜브·네이버 블로그(게시글별 조회수)는 GitHub Actions가 하루 2번(05:37·19:37, " +
    "05:43·19:43 KST) 자동 수집합니다 — 로그인 없이 보이는 공개 페이지라서 서버가 읽을 수 " +
    "있습니다. 지금 당장 갱신하려면 GitHub Actions에서 해당 워크플로를 수동 실행하세요(공개 " +
    "페이지라 여기서 직접 실행 버튼을 두진 않았습니다). 나머지 채널(네이버 클립·인스타·스레드·" +
    "페이스북·틱톡·X)은 로그인 세션이 있어야 하는 화면이라 자동화가 안 돼, 사장님이 실제 " +
    "로그인한 크롬 확장(_sns-extension)이 대신 읽습니다 — 새로고침 버튼을 누르면 그 확장이 " +
    "설치된 경우 각 채널 페이지를 실제로 열었다 닫으며 그 자리에서 다시 수집합니다(20여 초 " +
    "걸리며, 끝나면 이 페이지가 자동으로 한 번 더 값을 불러옵니다).";

  function escapeHtml(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function sparkline(series, getVal, w, h) {
    w = w || 260; h = h || 44;
    var pad = 4;
    var values = series.map(getVal);
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var range = max - min || 1;

    var points = series.map(function (e, i) {
      var x = series.length === 1 ? w / 2 : pad + (i / (series.length - 1)) * (w - pad * 2);
      var y = h - pad - ((getVal(e) - min) / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });

    var path = "M" + points.join(" L");
    var last = points[points.length - 1].split(",");

    return (
      '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="#121210" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="#121210"/>' +
      "</svg>"
    );
  }

  function deltaHtml(delta) {
    if (!delta) return "";
    return '<span class="delta ' + (delta > 0 ? "up" : "down") + '">' + (delta > 0 ? "▲" : "▼") + Math.abs(delta).toLocaleString() + "</span>";
  }

  function videoCardHtml(video) {
    var history = video.history || [];
    var clean = history.filter(function (e) { return e.views != null; });
    if (!clean.length) {
      return '<div class="video-card is-empty"><div class="body">데이터 없음</div></div>';
    }

    var latest = clean[clean.length - 1];
    var prev = clean.length > 1 ? clean[clean.length - 2] : null;
    var delta = prev ? latest.views - prev.views : null;

    var secondary = [];
    if (latest.likes != null) secondary.push("좋아요 " + latest.likes.toLocaleString());
    if (latest.comments != null) secondary.push("댓글 " + latest.comments.toLocaleString());

    // 관련도순 1등 댓글만 짧게 보여준다 -- 카드가 수십 개인 화면에서
    // 댓글 전체를 다 늘어놓으면 스캔하기 어려워지므로, "반응이 어떤지"
    // 감을 잡는 용도로 한 줄만 쓴다. 전체는 영상 링크에서 직접 본다.
    var topCommentHtml = "";
    if (video.top_comments && video.top_comments.length) {
      var top = video.top_comments[0];
      topCommentHtml = '<div class="top-comment">"' + escapeHtml(top.text || "") + '" — ' + escapeHtml(top.author || "") + "</div>";
    }

    var dateBadge = "";
    if (video.published_at) {
      var d = new Date(video.published_at);
      dateBadge = '<div class="date-badge">' + d.toLocaleDateString("ko-KR", { month: "2-digit", day: "2-digit" }) + " 게시</div>";
    }

    // video.url이 있으면(클립처럼 자체 링크가 있는 콘텐츠) 그걸 쓰고,
    // 없으면(유튜브 숏츠) id로 시청 URL을 조립한다.
    var watchUrl = video.url || ("https://www.youtube.com/shorts/" + encodeURIComponent(video.id));
    // 일부 플랫폼(틱톡 등) CDN은 다른 사이트에서 직접 불러오는 걸
    // 막는다(핫링크 차단) -- referrerpolicy로 우회를 시도해보고, 그래도
    // 안 뜨면 깨진 이미지 아이콘 대신 조용히 숨겨서 빈 회색 박스만
    // 남긴다(2026-09-01, 깨진 아이콘보다는 낫다는 판단).
    var thumb = '<div class="thumb-wrap">' + (video.thumbnail
      ? '<img class="thumb" src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">'
      : "") + platformBadgeHtml(video.id) + "</div>";

    return (
      '<div class="video-card">' + thumb +
      '<div class="body">' +
      '<p class="title"><a href="' + escapeHtml(watchUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(video.title || "(제목 없음)") + "</a></p>" +
      '<div class="latest"><span class="val">' + latest.views.toLocaleString() + '<span class="unit">회</span></span>' + deltaHtml(delta) + "</div>" +
      (secondary.length ? '<div class="secondary">' + escapeHtml(secondary.join(" · ")) + "</div>" : "") +
      topCommentHtml +
      (clean.length > 1 ? sparkline(clean, function (e) { return e.views; }, 200, 40) : "") +
      dateBadge +
      "</div></div>"
    );
  }

  var sortMode = "recent"; // "recent" | "views"

  function latestViews(v) {
    var clean = (v.history || []).filter(function (e) { return e.views != null; });
    return clean.length ? clean[clean.length - 1].views : -1;
  }

  function blogPostTileHtml(post) {
    var history = (post.history || []).filter(function (e) { return e.views != null; });
    if (!history.length) return "";

    var latest = history[history.length - 1];
    var prev = history.length > 1 ? history[history.length - 2] : null;
    var delta = prev ? latest.views - prev.views : null;

    var labelText =
      '<span class="label-text" title="' + escapeHtml(post.title || "") + '">' +
      '<a href="' + escapeHtml(post.url || "#") + '" target="_blank" rel="noopener noreferrer">' +
      escapeHtml(post.title || "(제목 없음)") + " ↗</a></span>";

    return (
      '<div class="tile tile-sm"><div class="label">' + labelText + "</div>" +
      '<div class="latest"><span class="val">' + latest.views.toLocaleString() + '<span class="unit">회</span></span>' + deltaHtml(delta) + "</div>" +
      (history.length > 1 ? sparkline(history, function (e) { return e.views; }, 200, 36) : "") +
      "</div>"
    );
  }

  function renderBlogPosts(data) {
    var posts = data.posts || {};
    var el = document.getElementById("blogArea");
    var ids = Object.keys(posts).filter(function (id) {
      return (posts[id].history || []).some(function (e) { return e.views != null; });
    });
    if (!ids.length) { el.innerHTML = ""; return; }

    // 게시일 내림차순(최신 글 먼저) -- 유튜브 섹션 기본 정렬과 동일한 기준.
    ids.sort(function (a, b) { return (posts[b].published_at || "").localeCompare(posts[a].published_at || ""); });

    el.innerHTML =
      '<div class="source-header"><a href="' + escapeHtml(BLOG_URL) + '" target="_blank" rel="noopener noreferrer" aria-label="블로그 바로가기">네이버 블로그 ↗</a></div>' +
      '<div class="tiles">' + ids.map(function (id) { return blogPostTileHtml(posts[id]); }).join("") + "</div>";
  }

  // 채널 요약(유튜브·네이버 클립·인스타·스레드·페이스북·틱톡·X)은
  // 전부 같은 모양(팔로워/구독자 중심, 필드 몇 개 더)이라 플랫폼마다
  // 렌더 함수를 새로 만들지 않고 하나로 처리한다(2026-09-01, 유튜브도
  // 이 카드 레벨로 통합).
  function channelTileHtml(meta, channel) {
    var history = channel.history || [];
    var latest = history[history.length - 1];
    var prev = history.length > 1 ? history[history.length - 2] : null;
    var delta = prev && latest.followers != null && prev.followers != null ? latest.followers - prev.followers : null;

    var foot = [];
    if (latest.total_views != null) foot.push("총 조회수 " + latest.total_views.toLocaleString());
    if (latest.following != null) foot.push("팔로잉 " + latest.following.toLocaleString());
    if (latest.content_count != null) foot.push("콘텐츠 " + latest.content_count.toLocaleString() + "개");
    if (latest.likes != null) foot.push("좋아요 " + latest.likes.toLocaleString());

    var followerSeries = history.filter(function (e) { return e.followers != null; });

    return (
      '<div class="tile tile-accent channel-card">' +
      '<div class="label"><a href="' + escapeHtml(meta.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(meta.label) + ' 바로가기">' +
      escapeHtml(meta.label) + ' ↗</a></div>' +
      (latest.followers != null
        ? '<div class="latest"><span class="val">' + latest.followers.toLocaleString() + '<span class="unit">' + escapeHtml(meta.unit) + '</span></span>' + deltaHtml(delta) + "</div>"
        : '<div class="latest"><span class="val" style="font-size:15px;color:var(--muted)">수집 대기</span></div>') +
      (foot.length ? '<div class="foot">' + escapeHtml(foot.join(" · ")) + "</div>" : "") +
      (followerSeries.length > 1 ? sparkline(followerSeries, function (e) { return e.followers; }, 240, 40) : "") +
      "</div>"
    );
  }

  // "지표가 잘 나오는 순" -- 손으로 순서를 정하면 실제 수집 결과와
  // 어긋날 수 있어(오늘 스레드 스코핑 버그처럼) 채워진 필드 수·기록
  // 일수를 기준으로 실측 데이터가 스스로 순서를 정하게 한다.
  function channelFieldScore(entry) {
    return ["followers", "total_views", "following", "content_count", "likes"].filter(function (k) { return entry[k] != null; }).length;
  }

  // 유튜브 채널(data.channel, {subscribers,total_views,video_count})을
  // 나머지 채널과 같은 모양({followers,total_views,content_count})으로
  // 바꿔서 같은 렌더 함수·같은 정렬 로직을 그대로 쓴다.
  function youtubeAsChannelEntry(youtubeData) {
    var history = (youtubeData.channel || {}).history || [];
    return {
      url: CHANNEL_URL,
      history: history.map(function (e) {
        return { date: e.date, followers: e.subscribers, total_views: e.total_views, content_count: e.video_count };
      }),
    };
  }

  function renderChannelSummary(youtubeData, naverData) {
    var channels = Object.assign({}, naverData.channels || {});
    if (((youtubeData.channel || {}).history || []).length) {
      channels.youtube = youtubeAsChannelEntry(youtubeData);
    }
    var el = document.getElementById("channelSummaryArea");
    var keys = Object.keys(CHANNEL_META).filter(function (key) {
      return channels[key] && (channels[key].history || []).length;
    });
    if (!keys.length) { el.innerHTML = ""; return; }

    keys.sort(function (a, b) {
      var ha = channels[a].history, hb = channels[b].history;
      var scoreDiff = channelFieldScore(hb[hb.length - 1]) - channelFieldScore(ha[ha.length - 1]);
      return scoreDiff !== 0 ? scoreDiff : hb.length - ha.length;
    });

    el.innerHTML =
      '<div class="source-header">채널 (신기한 아파트사전)</div>' +
      '<div class="tiles">' + keys.map(function (key) {
        return channelTileHtml(CHANNEL_META[key], channels[key]);
      }).join("") + "</div>";
  }

  // 유튜브 숏츠·인스타 릴스·틱톡 영상을 한 그리드에 같이 보여준다
  // (2026-09-01, "유튜브 숏츠"와 "콘텐츠 개별 성과"를 같은 레벨로
  // 합쳐달라는 요청으로 통합) -- id가 서로 안 겹치므로(유튜브는
  // 원본 영상id, 나머지는 "플랫폼_원본id") 그냥 합치면 된다. 인스타/
  // 틱톡은 게시일을 안 모으므로(수집 근거가 약해 우선 조회수만) 최신순
  // 정렬에서는 자연히 맨 뒤로 밀린다.
  // 같은 영상을 여러 플랫폼에 동시 발행하는 운영 방식이라, 캡션에 서로의
  // 제목이 그대로 포함된다(예: 틱톡 자동 캡션이 "...(으)로 만든 <원제목>..."
  // 형태로 유튜브/인스타 원제목을 통째로 담음, 2026-09-01 실측). 틱톡 CDN
  // 핫링크 차단으로 썸네일을 못 받아온 카드는, 같은 콘텐츠로 보이는 다른
  // 플랫폼(유튜브·인스타)의 성공한 썸네일을 대신 빌려 쓴다("거의 같은
  // 사진일 것"이라는 판단으로 도입) -- 실제 그 카드 플랫폼에서 받아온
  // 이미지는 아니라는 점은 감안할 것.
  function firstLine(s) {
    return (s || "").split("\n")[0].trim();
  }

  function borrowThumbnails(items, ids) {
    var donors = ids.filter(function (id) { return items[id].thumbnail && items[id].title; });
    ids.forEach(function (id) {
      var v = items[id];
      if (v.thumbnail || !v.title) return;
      var donor = donors.map(function (d) { return items[d]; }).filter(function (d) {
        var donorTitle = firstLine(d.title);
        return donorTitle.length >= 6 && v.title.indexOf(donorTitle) !== -1;
      })[0];
      if (donor) v.thumbnail = donor.thumbnail;
    });
  }

  function renderContent(youtubeData, naverData) {
    var items = Object.assign({}, youtubeData.videos || {}, naverData.clips || {});
    var el = document.getElementById("clipArea");
    var ids = Object.keys(items).filter(function (id) {
      return (items[id].history || []).some(function (e) { return e.views != null; });
    });
    if (!ids.length) { el.innerHTML = ""; return; }
    borrowThumbnails(items, ids);

    if (sortMode === "views") {
      ids.sort(function (a, b) { return latestViews(items[b]) - latestViews(items[a]); });
    } else {
      ids.sort(function (a, b) {
        return (items[b].published_at || "").localeCompare(items[a].published_at || "");
      });
    }

    var html =
      '<div class="source-header">콘텐츠 개별 성과' +
      '<div class="sort-toggle" role="group" aria-label="정렬">' +
      '<button type="button" class="sort-btn' + (sortMode === "recent" ? " is-active" : "") + '" data-sort="recent">최신순</button>' +
      '<button type="button" class="sort-btn' + (sortMode === "views" ? " is-active" : "") + '" data-sort="views">인기순</button>' +
      "</div></div>";
    html += '<div class="video-grid">' + ids.map(function (id) {
      var v = items[id];
      v.id = id;
      return videoCardHtml(v);
    }).join("") + "</div>";
    el.innerHTML = html;

    el.querySelectorAll(".sort-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (sortMode === btn.dataset.sort) return;
        sortMode = btn.dataset.sort;
        renderContent(lastData, lastNaverData);
      });
    });
  }

  // 소스가 두 개(유튜브·네이버)라 각자 updated_at을 갖는다 -- 더 최근
  // 시각을 대표값으로 보여준다(book-insight.html과 동일한 방식).
  function stampDataAsOf(dataList) {
    var el = document.getElementById("dataAsOf");
    var times = dataList.map(function (d) { return d && d.updated_at ? new Date(d.updated_at) : null; }).filter(Boolean);
    if (!times.length) { el.textContent = ""; return; }
    var latest = times.reduce(function (a, b) { return b > a ? b : a; });
    var y = latest.getFullYear(), m = String(latest.getMonth() + 1).padStart(2, "0"), day = String(latest.getDate()).padStart(2, "0");
    var time = latest.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    el.textContent = "· 데이터 기준 " + y + "-" + m + "-" + day + " " + time;
  }

  function stampTitleInfo() {
    var time = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("titleInfoText").textContent = TITLE_INFO_BASE + " 마지막 새로고침: " + time + ".";
  }

  var lastData = {};
  var lastNaverData = {};

  function fetchJson(url) {
    return fetch(url + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; });
  }

  function load() {
    return Promise.all([fetchJson(DATA_URL), fetchJson(NAVER_DATA_URL)])
      .then(function (results) {
        lastData = results[0] || {};
        lastNaverData = results[1] || {};
        renderChannelSummary(lastData, lastNaverData);
        renderBlogPosts(lastNaverData);
        renderContent(lastData, lastNaverData);
        stampDataAsOf([lastData, lastNaverData]);
        return true;
      })
      .catch(function (e) {
        document.getElementById("channelSummaryArea").innerHTML = '<div class="err">불러오기 실패했습니다: ' + escapeHtml(String(e)) + "</div>";
        return false;
      });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    var btn = this;
    Studio.setRefreshState(btn, "loading");
    // 크롬 확장(_sns-extension)이 설치돼 있으면, "신기한 아파트사전"
    // 채널들(네이버 클립·인스타·스레드·페이스북·틱톡·X)을 백그라운드
    // 창으로 실제로 열었다 닫으며 방금 값을 재수집하도록 요청한다
    // (SNS 인사이트 페이지의 강제 새로고침과 같은 방식, 2026-09-01
    // "새로고침하면 실시간 데이터를 가져왔으면 한다"는 요청에 대응).
    // 확장이 없으면 이 이벤트는 그냥 무시된다(안전).
    window.dispatchEvent(new CustomEvent("simplifier-content-force-refresh"));
    load().then(function (ok) {
      stampTitleInfo();
      Studio.setRefreshState(btn, ok ? "success" : "error");
      setTimeout(function () { Studio.setRefreshState(btn, "idle"); }, 1600);
      // 확장이 각 페이지를 열었다 닫는 데 20여 초 걸린다
      // (_sns-extension/background.js TAB_CLOSE_DELAY_MS) -- 그 뒤에 한 번
      // 더 자동으로 불러와서, 새로고침을 두 번 누르지 않아도 방금 수집된
      // 값이 보이게 한다.
      setTimeout(function () {
        load().then(function () { stampTitleInfo(); });
      }, 24000);
    });
  });
  load().then(function () { stampTitleInfo(); });
})();
</script>
<script src="/insight-7b3e9f2c/studio.js"></script>
</body>
