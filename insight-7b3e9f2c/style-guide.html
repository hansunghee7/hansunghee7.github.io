<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 UX 가이드 - Simplifier</title>

<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="/insight-7b3e9f2c/studio.css">

<style>
  /* STYLE_GUIDE.md의 .doc 패턴 -- 표·코드가 있는 긴 참조 문서를 읽기 좋게.
     :root/body/header/#adminShellNav는 studio.css 그대로 쓰고, 여기서는
     .doc 안에서만 쓰는 선택자만 추가합니다. */
  /* 너비(컨테이너 표준형 + 러닝 텍스트만 읽기 폭)는 studio.css의
     .doc 패턴 규칙이 처리한다 -- 여기 다시 선언하지 않는다(2026-08-30). */
  .doc{ font-size:15px; line-height:1.75; color:var(--dim); }
  .doc h2{ font-family:'Noto Serif KR',serif; font-weight:400; font-size:22px; color:var(--ink); margin:56px 0 6px; }
  .doc h2:first-child{ margin-top:0; }
  .doc h3{ font-size:15.5px; font-weight:700; color:var(--ink); margin:28px 0 10px; }
  .doc .h2-note{ font-size:12px; color:var(--muted); margin:0 0 16px; }
  .doc p{ margin:0 0 14px; }
  .doc ul, .doc ol{ margin:0 0 14px; padding-left:22px; }
  .doc li{ margin-bottom:6px; }
  .doc li b, .doc p b{ color:var(--ink); font-weight:700; }
  .doc code{ font-family:ui-monospace,'SFMono-Regular',Menlo,monospace; font-size:0.88em; background:#f7f6f2; padding:1.5px 5px; border-radius:4px; color:var(--dim); }
  .doc .lede{ font-size:15.5px; color:var(--dim); border-left:2px solid var(--line); padding-left:14px; margin-bottom:16px; }
  .doc .lede + .lede{ margin-top:-4px; }

  .table-wrap{ overflow-x:auto; margin:0 0 14px; -webkit-overflow-scrolling:touch; }
  .doc table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .doc th{ text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); padding:0 12px 8px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  .doc td{ padding:10px 12px 10px 0; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  .doc td:last-child, .doc th:last-child{ padding-right:0; }

  /* 목차 */
  .toc{ display:flex; flex-direction:column; gap:2px; margin:0 0 32px; padding:14px 16px; background:#f7f6f2; border-radius:10px; font-size:13px; }
  .toc a{ color:var(--dim); text-decoration:none; padding:3px 0; }
  .toc a:hover{ color:var(--ink); }
  /* 폭(가운데 정렬 720px)은 studio.css의 .doc > * 규칙이 모든 직계 자식에
     일괄 적용한다 -- 여기서 따로 선언하지 않는다(2026-08-31). */

  /* 색상칩 */
  .swatch{ display:inline-block; width:14px; height:14px; border-radius:4px; border:1px solid var(--line-soft); vertical-align:-2px; margin-right:8px; }

  /* 컴포넌트 미리보기 -- 실제 사이트 색(다크)을 그대로 써서 눈으로 바로 비교되게 함 */
  .preview{ background:#080808; border-radius:10px; padding:28px 24px; margin:14px 0 20px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .preview.tight{ padding:20px 24px; gap:10px; }
  .preview.cream{ background:#f5f3ee; }
  .px-btn{ display:inline-block; background:#f5f3ee; color:#080808; font-family:'Boska','Source Serif 4',serif; font-style:italic; font-weight:400; font-size:15px; padding:12px 30px; border-radius:999px; border:none; }
  .px-btn-outline{ display:inline-block; background:#080808; color:#f5f3ee; font-family:'Boska','Source Serif 4',serif; font-style:italic; font-weight:400; font-size:14px; padding:11px 26px; border-radius:999px; border:1px solid #f5f3ee; }
  .px-tag{ display:inline-block; background:#f5f3ee; color:#080808; font-family:'Pretendard Variable',sans-serif; font-size:11px; font-weight:600; padding:4px 8px; border-radius:4px; }
  .px-badge{ display:inline-flex; align-items:center; font-family:'Pretendard Variable',sans-serif; font-size:12px; font-weight:500; color:#8f8b82; border:1px solid rgba(245,243,238,0.16); border-radius:999px; padding:4px 12px; }
  .px-h1{ font-family:'Boska','Source Serif 4',serif; font-weight:200; font-size:32px; color:#ffffff; margin:0; }
  .px-body{ font-family:'Source Serif 4','Noto Serif KR',serif; font-weight:300; font-size:15px; color:#c9c8c2; margin:0; max-width:360px; line-height:1.8; }
  .px-label{ font-family:'Pretendard Variable',sans-serif; font-size:11px; color:#8f8b82; text-transform:uppercase; letter-spacing:0.1em; margin:0; }

  .incident{ border-left:3px solid var(--bad); background:#fdf4f1; padding:12px 14px; border-radius:0 8px 8px 0; margin-bottom:12px; font-size:13.5px; line-height:1.7; }
  .incident b{ color:var(--bad); }

  /* 대시보드형 vs 문서형 두 패턴 비교(3장) -- 미니 목업 */
  .pattern-compare{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0 20px; }
  .pattern-card{ border:1px solid var(--line-soft); border-radius:10px; overflow:hidden; }
  .pattern-card .mock{ height:90px; background:#fff; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .pattern-card .mock .bar{ height:8px; border-radius:3px; background:var(--line-soft); }
  .pattern-card.dash .mock{ display:grid; grid-template-columns:1fr 1fr; gap:6px; align-content:start; }
  .pattern-card.dash .mock .bar{ height:26px; }
  .pattern-card.docp .mock .bar{ width:70%; }
  .pattern-card .cap{ padding:8px 12px; font-size:12px; color:var(--muted); border-top:1px solid var(--line-soft); }
  @media (max-width:600px){ .pattern-compare{ grid-template-columns:1fr; } }

  .diff-list{ display:flex; flex-direction:column; gap:8px; margin:0 0 14px; }
  .diff-item{ display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line-soft); border-radius:8px; font-size:13.5px; line-height:1.65; }
  .diff-item .dot{ flex-shrink:0; width:8px; height:8px; border-radius:50%; margin-top:6px; }
  .diff-item .dot.keep{ background:var(--good); }
  .diff-item .dot.todo{ background:var(--warn); }
</style>
</head>
<body class="has-shell-nav">
<nav id="adminShellNav"></nav>
<main class="container doc">
<h1>통합 UX 가이드는 비공개로 옮겼습니다</h1>
<p class="meta-text">2026-09-24 · 사장님 지시로 원문과 렌더링본을 비공개 새김 저장소로 이관</p>
<p>에이전트는 새김 MCP(<code>lookup(doc="UX_GUIDE", query=...)</code>)로 조회합니다. 원문 열람은 대표 승인이 필요합니다.</p>
</main>
<script src="/insight-7b3e9f2c/studio.js"></script>
</body>
</html>
