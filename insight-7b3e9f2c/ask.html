<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplifier Q&amp;A - Simplifier</title>

<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root{
    --bg:#ffffff; --ink:#121210; --muted:#6e6a62; --dim:#403d37;
    --line:#c8c6bf; --line-soft:rgba(20,20,15,0.07);
    --bad:#b8402a;
    --gutter:16px;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
    display:flex; flex-direction:column;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 var(--gutter); width:100%; flex:1; display:flex; flex-direction:column; min-height:0;}
  @media (min-width:761px){ :root{ --gutter:32px; } }

  header{padding:28px 0 18px; border-bottom:1px solid var(--line-soft); display:flex; align-items:flex-end; justify-content:space-between; gap:16px;}
  .heading h1{font-family:'Noto Serif KR',serif; font-weight:400; font-size:30px; letter-spacing:-0.01em; margin:0 0 8px;}
  @media (min-width:761px){ .heading h1{font-size:36px;} }
  .sub{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .new-chat{background:none; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:8px 16px; font-size:12.5px; font-family:inherit; cursor:pointer; white-space:nowrap; transition:background-color .15s, border-color .15s;}
  .new-chat:hover{background:var(--ink); border-color:var(--ink); color:#fff;}

  .setup-note{background:#f7f6f2; border-radius:10px; padding:16px 18px; font-size:12.5px; color:var(--dim); line-height:1.7; margin:20px 0;}

  /* ---- 빈 화면(첫 방문) ---- */
  #emptyState{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 0; gap:20px;}
  #emptyState .hint{font-size:13.5px; color:var(--muted); max-width:420px; line-height:1.7;}
  .suggestions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:520px;}
  .suggestion-chip{background:#f7f6f2; border:1px solid var(--line-soft); color:var(--dim); border-radius:999px; padding:9px 16px; font-size:13px; font-family:inherit; cursor:pointer; text-align:left; transition:background-color .15s, border-color .15s;}
  .suggestion-chip:hover{background:var(--line-soft); border-color:var(--line);}

  /* ---- 대화 스레드 ---- */
  #thread{display:none; flex-direction:column; gap:28px; padding:24px 0 20px; flex:1; overflow-y:auto;}
  #thread.active{display:flex;}
  .row{display:flex; animation:row-in .25s ease;}
  .row.q{justify-content:flex-end;}
  .row.a{justify-content:flex-start;}
  @keyframes row-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .cursor{display:inline-block; width:2px; height:1em; background:var(--ink); vertical-align:text-bottom; margin-left:2px; animation:cursor-blink 0.9s step-end infinite;}
  @keyframes cursor-blink{0%,50%{opacity:1;} 50.01%,100%{opacity:0;}}

  .bubble.q{background:var(--ink); color:#fff; border-radius:16px 16px 4px 16px; padding:11px 16px; font-size:14.5px; line-height:1.6; max-width:80%; white-space:pre-wrap;}

  .answer{max-width:100%; font-size:15px; line-height:1.75;}
  .answer p{margin:0 0 12px;}
  .answer p:last-child{margin-bottom:0;}
  .answer ul, .answer ol{margin:0 0 12px; padding-left:22px;}
  .answer li{margin-bottom:4px;}
  .answer strong{font-weight:600;}
  .answer code{background:#f0efe9; padding:1px 5px; border-radius:4px; font-size:0.92em;}

  .answer.err{color:var(--bad); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .retry-btn{background:none; border:1px solid rgba(184,64,42,0.4); color:var(--bad); border-radius:999px; padding:4px 12px; font-size:11.5px; font-family:inherit; cursor:pointer; flex-shrink:0; transition:background-color .15s;}
  .retry-btn:hover{background:rgba(184,64,42,0.08);}

  .thinking{display:inline-flex; gap:4px; padding:4px 0;}
  .thinking span{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:thinking-bounce 1.2s infinite ease-in-out;}
  .thinking span:nth-child(2){animation-delay:.15s;}
  .thinking span:nth-child(3){animation-delay:.3s;}
  @keyframes thinking-bounce{0%,80%,100%{opacity:.3; transform:translateY(0);} 40%{opacity:1; transform:translateY(-3px);}}

  .sources{margin-top:14px; display:flex; flex-wrap:wrap; gap:7px;}
  .source-chip{display:inline-flex; align-items:center; gap:6px; background:#f7f6f2; border:1px solid var(--line-soft); color:var(--dim); border-radius:999px; padding:5px 12px 5px 9px; font-size:12px; text-decoration:none; max-width:220px;}
  .source-chip .title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .source-chip svg{width:13px; height:13px; flex-shrink:0; color:var(--muted);}
  a.source-chip{cursor:pointer; transition:background-color .15s, border-color .15s;}
  a.source-chip:hover{background:var(--line-soft); border-color:var(--line); color:var(--ink);}
  a.source-chip:hover svg{color:var(--ink);}

  .feedback{margin-top:12px; display:flex; align-items:center; gap:6px;}
  .fb-btn{background:none; border:1px solid var(--line-soft); border-radius:8px; width:30px; height:30px; font-size:14px; cursor:pointer; transition:background-color .15s, border-color .15s; line-height:1;}
  .fb-btn.copy-btn{width:auto; height:30px; padding:0 12px; font-size:12px; font-family:inherit; color:var(--dim);}
  .fb-btn:hover:not(:disabled){background:var(--line-soft); border-color:var(--line);}
  .fb-btn:disabled{cursor:default; opacity:0.45;}
  .fb-btn.chosen{opacity:1; border-color:var(--ink); background:#f7f6f2;}
  .fb-thanks{font-size:12px; color:var(--muted); opacity:0; transition:opacity .2s;}
  .fb-thanks.show{opacity:1;}

  /* ---- 입력창 ---- */
  .composer{position:sticky; bottom:0; background:var(--bg); padding:14px 0 22px;}
  .composer-box{display:flex; align-items:flex-end; gap:8px; border:1px solid var(--line); border-radius:16px; padding:8px 8px 8px 16px; transition:border-color .15s;}
  .composer-box:focus-within{border-color:var(--ink);}
  textarea{flex:1; border:none; outline:none; resize:none; font-family:inherit; font-size:14.5px; line-height:1.5; max-height:160px; padding:6px 0; background:transparent;}
  .send-btn{background:var(--ink); color:#fff; border:none; border-radius:12px; width:38px; height:38px; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .send-btn:disabled{opacity:0.35; cursor:default;}
  .send-btn svg{width:16px; height:16px;}

  #adminShellNav{position:fixed; top:0; left:0; bottom:0; width:180px; padding:24px 14px; background:#f7f6f2; border-right:1px solid var(--line-soft); overflow-y:auto; z-index:100;}
  #adminShellNav .shell-title{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; margin:0 0 16px; padding:0 10px;}
  #adminShellNav a{display:block; padding:9px 10px; margin-bottom:2px; border-radius:6px; color:var(--dim); text-decoration:none; font-size:14px;}
  #adminShellNav a:hover{background:var(--line-soft);}
  #adminShellNav a.active{background:var(--ink); color:#fff;}
  body.has-shell-nav{padding-left:180px;}
  @media (max-width:760px){
    #adminShellNav{position:static; width:auto; display:flex; gap:4px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line-soft); padding:10px 12px;}
    #adminShellNav .shell-title{display:none;}
    #adminShellNav a{white-space:nowrap; margin-bottom:0;}
    body.has-shell-nav{padding-left:0;}
    .wrap{height:calc(100vh - 56px);}
  }
  @media (min-width:761px){ .wrap{height:100vh;} }
</style>
</head>

<div class="wrap">
  <header>
    <div class="heading">
      <h1>Simplifier Q&amp;A</h1>
      <div class="sub">그동안 쓰신 글과 책 내용을 근거로만 답변하는 테스트 에이전트</div>
    </div>
    <button type="button" class="new-chat" id="newChatBtn">새 대화</button>
  </header>

  <div class="setup-note" id="setupNote" style="display:none">
    아직 연결 설정이 안 됐습니다. 이 파일 맨 아래 <code>WORKER_URL</code> 값을 실제 Cloudflare Worker 주소로 바꿔주세요.
  </div>

  <div id="emptyState">
    <div class="hint">근거가 없으면 지어내지 않고 "찾지 못했다"고 답합니다. 아래에서 골라보시거나 직접 질문해보세요.</div>
    <div class="suggestions">
      <button type="button" class="suggestion-chip">우선순위 정할 때 쓰는 프레임워크 알려줘</button>
      <button type="button" class="suggestion-chip">좋은 PO의 조건이 뭐야?</button>
      <button type="button" class="suggestion-chip">리텐션을 높이는 방법 알려줘</button>
    </div>
  </div>

  <div id="thread"></div>

  <div class="composer">
    <form id="askForm">
      <div class="composer-box">
        <textarea id="questionInput" rows="1" placeholder="무엇이든 물어보세요" autocomplete="off"></textarea>
        <button type="submit" class="send-btn" id="askBtn" aria-label="전송">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Cloudflare에서 이 Worker를 배포하면 나오는 실제 주소로 바꿔주세요.
  // 예: https://simplifier-ask.simon-8be.workers.dev
  const WORKER_URL = "https://simplifier-ask.simon-8be.workers.dev";

  // Worker의 ASK_SHARED_SECRET과 반드시 똑같은 값이어야 합니다.
  // 이건 진짜 보안이 아니라(공개 저장소라 이 값도 누구나 볼 수 있음),
  // 이 주소를 우연히 발견한 봇이 함부로 두드리지 못하게 막는 정도입니다.
  const ASK_SHARED_SECRET = "mSoMs0NZ28KYk7dEFd8hchvyND2A2NC5";

  // 이전 질문/답변을 여기 쌓아뒀다가 다음 질문 보낼 때 같이 넘긴다 --
  // 새로고침하면 사라지는 세션 한정 기억이고, 최근 5턴(10개)만 유지해서
  // 프롬프트가 한도 없이 길어지는 걸 막는다.
  let conversationHistory = [];
  const MAX_HISTORY_ENTRIES = 10;

  const thread = document.getElementById("thread");
  const emptyState = document.getElementById("emptyState");
  const form = document.getElementById("askForm");
  const input = document.getElementById("questionInput");
  const btn = document.getElementById("askBtn");
  const setupNote = document.getElementById("setupNote");
  const newChatBtn = document.getElementById("newChatBtn");

  // 답변 끝에 모델이 스스로 붙이는 "(blog - ..., book - ...)" 인용을 떼어낸다 --
  // 아래에서 출처를 칩으로 따로, 더 깔끔하게 보여주기 때문에 중복이 된다.
  function stripInlineCitation(text) {
    return text.replace(/\n*\([^()]*(?:blog|book)\s*-[^()]*\)\s*$/i, "").trim();
  }

  function resetToEmpty() {
    thread.innerHTML = "";
    thread.classList.remove("active");
    emptyState.style.display = "flex";
    conversationHistory = [];
    input.value = "";
    autoGrow();
    input.focus();
  }

  function showThread() {
    emptyState.style.display = "none";
    thread.classList.add("active");
  }

  function addUserRow(text) {
    const row = document.createElement("div");
    row.className = "row q";
    const bubble = document.createElement("div");
    bubble.className = "bubble q";
    bubble.textContent = text;
    row.appendChild(bubble);
    thread.appendChild(row);
    row.scrollIntoView({ behavior: "smooth", block: "end" });
    return row;
  }

  function addAnswerRow() {
    const row = document.createElement("div");
    row.className = "row a";
    const answer = document.createElement("div");
    answer.className = "answer";
    answer.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
    row.appendChild(answer);
    thread.appendChild(row);
    row.scrollIntoView({ behavior: "smooth", block: "end" });
    return answer;
  }

  function renderStreamingText(el, text) {
    const clean = stripInlineCitation(text);
    el.innerHTML = (window.marked ? marked.parse(clean) : clean) + '<span class="cursor"></span>';
  }

  const ICON_ARTICLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>';
  const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>';

  function renderActions(el, logId, plainText) {
    const box = document.createElement("div");
    box.className = "feedback";

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "fb-btn copy-btn";
    copyBtn.textContent = "복사";
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(plainText);
        copyBtn.textContent = "복사됨";
        setTimeout(() => { copyBtn.textContent = "복사"; }, 1500);
      } catch (e) {
        // 클립보드 권한이 없는 브라우저 환경이면 조용히 넘어간다
      }
    });
    box.appendChild(copyBtn);

    if (!logId) {
      // 기록이 실패했으면 평가 대상이 없어서 복사 버튼만 두고 나머지는 생략
      el.appendChild(box);
      return;
    }

    const up = document.createElement("button");
    up.type = "button";
    up.className = "fb-btn";
    up.textContent = "👍";
    const down = document.createElement("button");
    down.type = "button";
    down.className = "fb-btn";
    down.textContent = "👎";
    const thanks = document.createElement("span");
    thanks.className = "fb-thanks";
    thanks.textContent = "감사합니다";

    async function send(rating, chosenBtn) {
      up.disabled = true;
      down.disabled = true;
      chosenBtn.classList.add("chosen");
      thanks.classList.add("show");
      try {
        await fetch(WORKER_URL + "/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Ask-Secret": ASK_SHARED_SECRET },
          body: JSON.stringify({ id: logId, rating }),
        });
      } catch (e) {
        // 평가 전송 실패는 조용히 넘어간다 -- 답변 자체엔 지장 없음
      }
    }
    up.addEventListener("click", () => send("up", up));
    down.addEventListener("click", () => send("down", down));

    box.appendChild(up);
    box.appendChild(down);
    box.appendChild(thanks);
    el.appendChild(box);
  }

  function finalizeAnswer(el, text, sources, logId) {
    const clean = stripInlineCitation(text);
    el.innerHTML = window.marked ? marked.parse(clean) : clean;
    const plainText = el.innerText; // 칩·버튼 붙기 전, 답변 본문만 복사용으로 떼어둔다
    if (sources && sources.length) {
      const box = document.createElement("div");
      box.className = "sources";
      sources.forEach((s) => {
        // 클릭 가능한 링크로 원문을 새 탭에 열어준다 -- 책은 공개 페이지가
        // 없어서 링크 없이 아이콘만 붙인 칩으로 둔다.
        const chip = document.createElement(s.source_url ? "a" : "span");
        chip.className = "source-chip";
        if (s.source_url) {
          chip.href = s.source_url;
          chip.target = "_blank";
          chip.rel = "noopener";
        }
        chip.innerHTML =
          (s.source_type === "book" ? ICON_BOOK : ICON_ARTICLE) +
          '<span class="title">' + s.title + "</span>";
        box.appendChild(chip);
      });
      el.appendChild(box);
    }
    renderActions(el, logId, plainText);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function renderErrorWithRetry(el, rawMessage, onRetry) {
    console.error("Simplifier Q&A 오류:", rawMessage);
    el.className = "answer err";
    el.innerHTML = "";
    const text = document.createElement("div");
    text.textContent = "답변을 만드는 중 문제가 생겼습니다. 잠시 후 다시 시도해주세요.";
    el.appendChild(text);
    const retryBtn = document.createElement("button");
    retryBtn.type = "button";
    retryBtn.className = "retry-btn";
    retryBtn.textContent = "다시 시도";
    retryBtn.addEventListener("click", () => onRetry());
    el.appendChild(retryBtn);
  }

  // 네트워크로 도착하는 덩어리(문장 단위)를 그대로 찍지 않고, 큐에 쌓아뒀다가
  // 일정한 속도로 한 글자씩 풀어서 보여준다 -- 실제 클로드/챗GPT가 하는 방식.
  function createTypewriter(el) {
    let pending = "";
    let revealed = "";
    let streamEnded = false;
    let timer = null;
    let resolveDone;
    const done = new Promise((resolve) => { resolveDone = resolve; });

    function tick() {
      if (pending.length > 0) {
        // 쌓인 게 많으면 조금씩 빨리, 거의 다 풀렸으면 한 글자씩 -- 자연스러운 타이핑 느낌.
        const step = Math.max(1, Math.ceil(pending.length / 20));
        revealed += pending.slice(0, step);
        pending = pending.slice(step);
        renderStreamingText(el, revealed);
      } else if (streamEnded) {
        clearInterval(timer);
        timer = null;
        resolveDone(revealed);
      }
    }
    timer = setInterval(tick, 16);

    return {
      push(text) { pending += text; },
      end() { streamEnded = true; },
      stop() {
        if (timer) { clearInterval(timer); timer = null; }
        resolveDone(revealed + pending);
      },
      done,
    };
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.querySelectorAll(".suggestion-chip").forEach((chip) => {
    chip.addEventListener("click", function () {
      input.value = chip.textContent;
      form.requestSubmit();
    });
  });

  newChatBtn.addEventListener("click", resetToEmpty);

  async function ask(question) {
    showThread();
    addUserRow(question);
    const answerEl = addAnswerRow();
    await fetchAnswer(question, answerEl);
  }

  async function fetchAnswer(question, answerEl) {
    btn.disabled = true;
    answerEl.className = "answer";
    answerEl.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';

    let sources = null;
    let logId = null;
    let started = false;
    const typewriter = createTypewriter(answerEl);
    const retry = () => fetchAnswer(question, answerEl);

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Ask-Secret": ASK_SHARED_SECRET,
        },
        body: JSON.stringify({ question, history: conversationHistory }),
      });

      if (!res.ok || !res.body) {
        const data = await res.json().catch(() => ({}));
        renderErrorWithRetry(answerEl, data.error || res.status, retry);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let raw = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        raw += decoder.decode(value, { stream: true });

        const events = raw.split("\n\n");
        raw = events.pop();

        for (const block of events) {
          let eventType = "message";
          let dataStr = "";
          for (const line of block.split("\n")) {
            if (line.startsWith("event:")) eventType = line.slice(6).trim();
            else if (line.startsWith("data:")) dataStr += line.slice(5).trim();
          }
          if (!dataStr) continue;

          let payload;
          try {
            payload = JSON.parse(dataStr);
          } catch (e) {
            continue;
          }

          if (eventType === "sources") {
            sources = payload.sources;
          } else if (eventType === "chunk") {
            if (!started) {
              started = true;
              answerEl.innerHTML = "";
            }
            typewriter.push(payload.text);
          } else if (eventType === "log_id") {
            logId = payload.id;
          } else if (eventType === "error") {
            typewriter.stop();
            renderErrorWithRetry(answerEl, payload.error, retry);
            return;
          }
        }
      }

      typewriter.end();
      const finalText = await typewriter.done;
      finalizeAnswer(answerEl, finalText, sources, logId);

      conversationHistory.push({ role: "user", content: question });
      conversationHistory.push({ role: "model", content: finalText });
      if (conversationHistory.length > MAX_HISTORY_ENTRIES) {
        conversationHistory = conversationHistory.slice(-MAX_HISTORY_ENTRIES);
      }
    } catch (err) {
      typewriter.stop();
      renderErrorWithRetry(answerEl, "연결 오류 — " + err.message, retry);
      setupNote.style.display = "block";
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    autoGrow();
    ask(question);
  });
</script>
</body>
