<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI에게 물어보기 - Simplifier</title>

<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">

<style>
  :root{
    --bg:#ffffff; --ink:#121210; --muted:#6e6a62; --dim:#403d37;
    --line:#c8c6bf; --line-soft:rgba(20,20,15,0.07);
    --gutter:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 var(--gutter) 60px;}
  @media (min-width:761px){ :root{ --gutter:32px; } }
  header{padding:28px 0 18px; border-bottom:1px solid var(--line-soft); margin-bottom:24px;}
  h1{font-family:'Noto Serif KR',serif; font-weight:400; font-size:30px; letter-spacing:-0.01em; margin:0 0 8px;}
  @media (min-width:761px){ h1{font-size:36px;} }
  .sub{font-size:12.5px; color:var(--muted); line-height:1.6;}

  #adminShellNav{position:fixed; top:0; left:0; bottom:0; width:180px; padding:24px 14px; background:#f7f6f2; border-right:1px solid var(--line-soft); overflow-y:auto; z-index:100;}
  #adminShellNav .shell-title{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; margin:0 0 16px; padding:0 10px;}
  #adminShellNav a{display:block; padding:9px 10px; margin-bottom:2px; border-radius:6px; color:var(--dim); text-decoration:none; font-size:14px;}
  #adminShellNav a:hover{background:var(--line-soft);}
  #adminShellNav a.active{background:var(--ink); color:#fff;}
  body.has-shell-nav{padding-left:180px;}
  @media (max-width:760px){
    #adminShellNav{position:static; width:auto; display:flex; gap:4px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line-soft); padding:10px 12px;}
    #adminShellNav .shell-title{display:none;}
    #adminShellNav a{white-space:nowrap; margin-bottom:0;}
    body.has-shell-nav{padding-left:0;}
  }

  .setup-note{background:#f7f6f2; border-radius:10px; padding:16px 18px; font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:24px;}

  #thread{display:flex; flex-direction:column; gap:18px; margin-bottom:24px;}
  .msg{padding:14px 16px; border-radius:12px; font-size:14.5px; line-height:1.7; white-space:pre-wrap;}
  .msg.q{background:#f7f6f2; font-weight:500;}
  .msg.a{border:1px solid var(--line-soft);}
  .msg.err{border:1px solid rgba(184,64,42,0.3); color:#b8402a; background:rgba(184,64,42,0.05);}
  .sources{margin-top:10px; padding-top:10px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--muted);}
  .sources span{display:inline-block; margin:2px 8px 2px 0;}

  form{display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:12px 0;}
  input[type=text]{flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:14.5px; font-family:inherit;}
  input[type=text]:focus{outline:none; border-color:var(--ink);}
  button{background:var(--ink); color:#fff; border:none; border-radius:10px; padding:12px 20px; font-size:14.5px; font-family:inherit; cursor:pointer;}
  button:disabled{opacity:0.5; cursor:default;}
</style>
</head>
<body class="has-shell-nav">
<nav id="adminShellNav">
  <div class="shell-title">Simplifier Studio</div>
  <a href="/insight-7b3e9f2c/">사이트 인사이트</a>
  <a href="/insight-7b3e9f2c/sns-insight.html">SNS 인사이트</a>
  <a href="/insight-7b3e9f2c/book-insight.html">북 인사이트</a>
  <a href="/insight-7b3e9f2c/write.html">글쓰기</a>
  <a href="/insight-7b3e9f2c/multi-publish.html">멀티 퍼블리싱</a>
  <a href="/insight-7b3e9f2c/newsletter-research.html">뉴스레터 리서치</a>
  <a href="/insight-7b3e9f2c/pillar-manage.html">필러 관리</a>
  <a href="/insight-7b3e9f2c/ask.html" class="active">AI에게 물어보기</a>
</nav>

<div class="wrap">
  <header>
    <h1>AI에게 물어보기</h1>
    <div class="sub">테스트용 에이전트입니다. 그동안 쓰신 글과 책 내용을 근거로만 답변합니다 — 근거가 없으면 지어내지 않고 "찾지 못했다"고 답합니다.</div>
  </header>

  <div class="setup-note" id="setupNote" style="display:none">
    아직 연결 설정이 안 됐습니다. 이 파일 맨 아래 <code>WORKER_URL</code> 값을 실제 Cloudflare Worker 주소로 바꿔주세요.
  </div>

  <div id="thread"></div>

  <form id="askForm">
    <input type="text" id="questionInput" placeholder="예: 우선순위 정할 때 쓰는 프레임워크 알려줘" autocomplete="off">
    <button type="submit" id="askBtn">물어보기</button>
  </form>
</div>

<script>
  // Cloudflare에서 이 Worker를 배포하면 나오는 실제 주소로 바꿔주세요.
  // 예: https://simplifier-ask.simon-8be.workers.dev
  const WORKER_URL = "https://simplifier-ask.simon-8be.workers.dev";

  // Worker의 ASK_SHARED_SECRET과 반드시 똑같은 값이어야 합니다.
  // 이건 진짜 보안이 아니라(공개 저장소라 이 값도 누구나 볼 수 있음),
  // 이 주소를 우연히 발견한 봇이 함부로 두드리지 못하게 막는 정도입니다.
  const ASK_SHARED_SECRET = "mSoMs0NZ28KYk7dEFd8hchvyND2A2NC5";

  const thread = document.getElementById("thread");
  const form = document.getElementById("askForm");
  const input = document.getElementById("questionInput");
  const btn = document.getElementById("askBtn");
  const setupNote = document.getElementById("setupNote");

  if (WORKER_URL.includes("simplifier-ask.simon-8be")) {
    // 기본값 그대로면(아직 안 바꿨으면) 안내만 보여주고 실제 호출은 시도해본다.
  }

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    thread.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage("q", question);
    input.value = "";
    btn.disabled = true;
    const loadingEl = addMessage("a", "생각하는 중...");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Ask-Secret": ASK_SHARED_SECRET,
        },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      if (!res.ok) {
        loadingEl.className = "msg err";
        loadingEl.textContent = "오류: " + (data.error || res.status);
      } else {
        loadingEl.textContent = data.answer;
        if (data.sources && data.sources.length) {
          const src = document.createElement("div");
          src.className = "sources";
          src.textContent = "참고: " + data.sources.map((s) => s.title).join(", ");
          loadingEl.appendChild(src);
        }
      }
    } catch (err) {
      loadingEl.className = "msg err";
      loadingEl.textContent = "연결 오류: " + err.message;
      setupNote.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
