<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplifier Dialogue - Simplifier</title>

<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="stylesheet" href="/insight-7b3e9f2c/studio.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  html, body{height:100%;}
  body{
    display:flex; flex-direction:column;
  }
  /* 두 칸 배치: 왼쪽 200px 대화 목록 + 오른쪽 대화(읽기 폭 720px 유지). 클로드 앱처럼
     "이전 대화가 옆에 항상 보이는" 모양이되, 스튜디오 왼쪽 메뉴와 겹쳐 보이지 않게
     목록 칸은 배경 없이 가는 세로선 하나로만 구분한다 (사장님 지시, 2026-09-03). */
  .wrap{max-width:960px; margin:0 auto; padding:0 var(--gutter); width:100%; flex:1; display:grid; grid-template-columns:200px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); column-gap:40px; min-height:0;}
  header{grid-column:1 / -1;}
  .main{grid-column:2; grid-row:2; display:flex; flex-direction:column; min-height:0;}

  header{padding:28px 0 18px; border-bottom:1px solid var(--line-soft); display:flex; align-items:flex-end; justify-content:space-between; gap:16px;}
  .heading h1{font-family:'Noto Serif KR',serif; font-weight:400; font-size:30px; letter-spacing:-0.01em; margin:0 0 8px;}
  @media (min-width:761px){ .heading h1{font-size:36px;} }
  .new-chat{background:none; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:8px 16px; font-size:12.5px; font-family:inherit; cursor:pointer; white-space:nowrap; transition:background-color .15s, border-color .15s;}
  .new-chat:hover{background:var(--ink); border-color:var(--ink); color:#fff;}
  .head-actions{display:none; gap:8px; flex-shrink:0;}
  .new-chat[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff;}

  /* 이전 대화 목록 -- 이 브라우저(localStorage)에만 저장된다. 서버 기록(qa_feedback)과는
     별개이고, 로그인이 없어 "누구의 기록"이 성립하지 않으므로 서버 쪽 개인 기록은
     만들지 않기로 함 (2026-09-03). 스타일은 왼쪽 메뉴(검은 알약 강조)와 달리 글자만:
     테두리·배경 없음, 현재 대화는 굵게, ✕는 올렸을 때만. */
  .rail{grid-column:1; grid-row:2; display:flex; flex-direction:column; min-height:0; padding:22px 16px 18px 0; border-right:1px solid var(--line-soft);}
  .rail-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:20px;}
  .rail-new{background:none; border:none; color:var(--ink); font-family:inherit; font-size:13px; cursor:pointer; padding:0; text-align:left;}
  .rail-new:hover{text-decoration:underline; text-underline-offset:3px;}
  /* 접기/펼치기 -- 글자만 있는 목록 칸에 맞춰 버튼도 아이콘 글자 하나. 데스크톱은 ‹/›,
     모바일 서랍에서는 ✕ (CSS content로 바꿔 JS가 글자를 몰라도 되게). */
  .rail-toggle{background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:2px 6px; border-radius:6px; flex-shrink:0;}
  .rail-toggle:hover{color:var(--ink); background:var(--line-soft);}
  .rail-toggle .glyph::before{content:"‹";}
  @media (min-width:761px){
    /* 접힌 상태: 가는 띠에 › 버튼만 남고 대화 칸이 그만큼 넓어진다. 상태는 localStorage. */
    .wrap.rail-collapsed{grid-template-columns:28px minmax(0,1fr); column-gap:28px;}
    .wrap.rail-collapsed .rail{padding-right:0; border-right-color:transparent;}
    .wrap.rail-collapsed .rail > :not(.rail-head), .wrap.rail-collapsed .rail-new{display:none;}
    .wrap.rail-collapsed .rail-toggle{margin-left:-6px;}
    .wrap.rail-collapsed .rail-toggle .glyph::before{content:"›";}
  }
  .rail-label{display:flex; align-items:center; gap:4px; font-size:11px; letter-spacing:.06em; color:var(--muted); margin-bottom:6px;}
  .rail-list{display:flex; flex-direction:column; gap:1px; flex:1; min-height:0; overflow-y:auto;}
  .rail-item{display:flex; align-items:center; gap:4px; min-width:0;}
  .rail-open{flex:1; min-width:0; background:none; border:none; text-align:left; font-family:inherit; font-size:13px; line-height:1.5; color:var(--dim); cursor:pointer; padding:6px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rail-item:hover .rail-open{color:var(--ink);}
  .rail-item.current .rail-open{color:var(--ink); font-weight:600;}
  .rail-del{background:none; border:none; color:var(--muted); font-size:12px; line-height:1; cursor:pointer; padding:4px; border-radius:4px; opacity:0; flex-shrink:0; transition:opacity .12s;}
  .rail-item:hover .rail-del, .rail-del:focus{opacity:1;}
  .rail-del:hover{color:var(--bad);}
  .rail-empty{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .rail-clear{background:none; border:none; color:var(--muted); font-size:11.5px; font-family:inherit; cursor:pointer; padding:0; text-align:left; margin-top:14px;}
  .rail-clear:hover{color:var(--bad);}

  /* 모바일: 목록 칸은 숨기고 헤더의 "이전 대화" 버튼으로 펼친다 */
  /* 모바일: 스튜디오 메뉴처럼 왼쪽에서 밀려 나오는 서랍. 상단 바(52px) 아래, 메뉴(z 200)보다 아래. */
  @media (max-width:760px){
    .wrap{display:flex; flex-direction:column;}
    .head-actions{display:flex;}
    header{flex-wrap:wrap;}
    /* 답변을 읽을 때 상단이 계속 자리를 차지해 불편하다는 지적(2026-09-03) --
       #thread가 자체 스크롤 컨테이너라 header는 항상 화면에 고정으로 남는데,
       스크롤을 시작하면 타이틀만 남기고 버튼 줄을 접어 공간을 돌려준다.
       max-height+opacity로 접어서(display:none 대신) transition이 걸리게 한다. */
    header{transition:padding .2s ease;}
    .head-actions{overflow:hidden; max-height:40px; transition:opacity .2s ease, max-height .2s ease;}
    header.compact{padding-top:14px; padding-bottom:12px;}
    header.compact .heading h1{margin-bottom:0;}
    header.compact .head-actions{opacity:0; max-height:0; pointer-events:none;}
    .rail{position:fixed; top:52px; left:0; bottom:0; width:min(280px, 84vw); background:var(--bg); border-right:1px solid var(--line-soft); box-shadow:12px 0 32px rgba(0,0,0,0.08); padding:18px 16px 20px; z-index:150; transform:translateX(-102%); transition:transform .2s ease; display:flex;}
    .rail.open{transform:none;}
    .rail-toggle .glyph::before{content:"✕";}
    .rail-del{opacity:1;}
    .rail-backdrop{position:fixed; inset:52px 0 0 0; background:rgba(0,0,0,0.22); z-index:140; opacity:0; pointer-events:none; transition:opacity .2s;}
    .rail-backdrop.show{opacity:1; pointer-events:auto;}
  }
  @media (min-width:761px){ .rail-backdrop{display:none;} }

  .setup-note{background:#f7f6f2; border-radius:10px; padding:16px 18px; font-size:12.5px; color:var(--dim); line-height:1.7; margin:20px 0;}

  /* ---- 빈 화면(첫 방문) ---- */
  #emptyState{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 0; gap:20px;}
  #emptyState .hint{font-size:13.5px; color:var(--muted); max-width:420px; line-height:1.7;}
  .suggestions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:520px;}
  .suggestion-chip{background:#f7f6f2; border:1px solid var(--line-soft); color:var(--dim); border-radius:999px; padding:9px 16px; font-size:13px; font-family:inherit; cursor:pointer; text-align:left; transition:background-color .15s, border-color .15s;}
  .suggestion-chip:hover{background:var(--line-soft); border-color:var(--line);}

  /* ---- 대화 스레드 ---- */
  /* 헤더 구분선과 첫 말풍선이 너무 붙어 답답해(잘린 듯) 보인다는 지적(2026-09-03) --
     실제로 겹치거나 가려지는 버그는 아님(사장님 확인) -- 순수 여백 문제라
     위쪽 여백을 24px→36px로 넓힌다. */
  #thread{display:none; flex-direction:column; gap:28px; padding:36px 0 20px; flex:1; overflow-y:auto;}
  #thread.active{display:flex;}
  .row{display:flex; animation:row-in .25s ease;}
  .row.q{justify-content:flex-end;}
  .row.a{justify-content:flex-start;}
  @keyframes row-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .cursor{display:inline-block; width:2px; height:1em; background:var(--ink); vertical-align:text-bottom; margin-left:2px; animation:cursor-blink 0.9s step-end infinite;}
  @keyframes cursor-blink{0%,50%{opacity:1;} 50.01%,100%{opacity:0;}}

  .bubble.q{background:var(--ink); color:#fff; border-radius:16px 16px 4px 16px; padding:11px 16px; font-size:14.5px; line-height:1.6; max-width:80%; white-space:pre-wrap;}

  .answer{max-width:100%; font-size:15px; line-height:1.75;}
  .answer p{margin:0 0 12px;}
  .answer p:last-child{margin-bottom:0;}
  .answer ul, .answer ol{margin:0 0 12px; padding-left:22px;}
  .answer li{margin-bottom:4px;}
  .answer strong{font-weight:600;}
  .answer code{background:#f0efe9; padding:1px 5px; border-radius:4px; font-size:0.92em;}

  .answer.err{color:var(--bad); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .err-detail{font-size:11.5px; color:var(--muted); margin-top:4px; word-break:break-all;}
  .retry-btn{background:none; border:1px solid rgba(184,64,42,0.4); color:var(--bad); border-radius:999px; padding:4px 12px; font-size:11.5px; font-family:inherit; cursor:pointer; flex-shrink:0; transition:background-color .15s;}
  .retry-btn:hover{background:rgba(184,64,42,0.08);}

  .thinking{display:inline-flex; gap:4px; padding:4px 0;}
  .thinking span{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:thinking-bounce 1.2s infinite ease-in-out;}
  .thinking span:nth-child(2){animation-delay:.15s;}
  .thinking span:nth-child(3){animation-delay:.3s;}
  @keyframes thinking-bounce{0%,80%,100%{opacity:.3; transform:translateY(0);} 40%{opacity:1; transform:translateY(-3px);}}

  .sources{margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;}
  .source-chip{display:inline-flex; align-items:center; gap:4px; background:transparent; border:1px solid var(--line-soft); color:var(--muted); border-radius:999px; padding:2px 9px 2px 7px; font-size:11px; text-decoration:none; max-width:150px;}
  .source-chip .title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .source-chip svg{width:10px; height:10px; flex-shrink:0; color:var(--muted);}
  a.source-chip{cursor:pointer; transition:background-color .15s, border-color .15s;}
  a.source-chip:hover{background:var(--line-soft); border-color:var(--line); color:var(--ink);}
  a.source-chip:hover svg{color:var(--ink);}

  /* 답변 아래 "다음에 물어볼 만한 질문" 칩 -- 첫 화면의 제안 칩과 같은 생김새를
     쓰되 답변 흐름을 방해하지 않게 한 단계 작게. */
  .followups{margin-top:14px; display:flex; flex-wrap:wrap; gap:6px;}
  .followups .suggestion-chip{font-size:12.5px; padding:7px 13px;}

  .feedback{margin-top:12px; display:flex; align-items:center; gap:6px;}
  .fb-btn{background:none; border:1px solid var(--line-soft); border-radius:8px; width:30px; height:30px; font-size:14px; cursor:pointer; transition:background-color .15s, border-color .15s; line-height:1;}
  .fb-btn.copy-btn{width:auto; height:30px; padding:0 12px; font-size:12px; font-family:inherit; color:var(--dim);}
  .fb-btn:hover:not(:disabled){background:var(--line-soft); border-color:var(--line);}
  .fb-btn:disabled{cursor:default; opacity:0.45;}
  .fb-btn.chosen{opacity:1; border-color:var(--ink); background:#f7f6f2;}
  .fb-thanks{font-size:12px; color:var(--muted); opacity:0; transition:opacity .2s;}
  .fb-thanks.show{opacity:1;}

  /* ---- 입력창 ---- */
  .composer{position:sticky; bottom:0; background:var(--bg); padding:14px 0 22px;}
  .composer-box{display:flex; align-items:flex-end; gap:8px; border:1px solid var(--line); border-radius:16px; padding:8px 8px 8px 16px; transition:border-color .15s;}
  .composer-box:focus-within{border-color:var(--ink);}
  textarea{flex:1; border:none; outline:none; resize:none; font-family:inherit; font-size:14.5px; line-height:1.5; max-height:160px; padding:6px 0; background:transparent;}
  .send-btn{background:var(--ink); color:#fff; border:none; border-radius:12px; width:38px; height:38px; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .send-btn:disabled{opacity:0.35; cursor:default;}
  .send-btn svg{width:16px; height:16px;}
  .cooldown-note{font-size:11.5px; color:var(--muted); text-align:right; padding:6px 4px 0;}

  /* 이 페이지는 채팅 화면이라 .wrap이 뷰포트 높이를 꽉 채워야 한다
     (studio.css의 사이드바 모바일 축소 규칙과는 별개로 이 페이지만 필요). */
  @media (max-width:760px){ .wrap{height:calc(100vh - 56px);} }
  @media (min-width:761px){ .wrap{height:100vh;} }
</style>
</head>
<body class="has-shell-nav">
<nav id="adminShellNav"></nav>

<div class="wrap">
  <header>
    <div class="heading">
      <h1>Simplifier Dialogue</h1>
    </div>
    <div class="head-actions">
      <button type="button" class="new-chat" id="historyBtn" aria-pressed="false">이전 대화</button>
      <button type="button" class="new-chat" id="newChatBtn">새 대화</button>
    </div>
  </header>

  <div class="rail-backdrop" id="railBackdrop"></div>
  <aside class="rail" id="rail">
    <div class="rail-head">
      <button type="button" class="rail-new" id="railNewBtn">+ 새 대화</button>
      <button type="button" class="rail-toggle" id="railToggle" aria-label="이전 대화 접기/펼치기" aria-expanded="true"><span class="glyph"></span></button>
    </div>
    <div class="rail-label">
      <span>이전 대화</span>
      <button type="button" class="info-dot" aria-label="설명 보기">ⓘ<span class="info-text">이 브라우저에만 저장됩니다. 다른 기기나 브라우저에서는 보이지 않고, 브라우저 데이터를 지우면 함께 사라집니다. 최근 30개까지 남깁니다.</span></button>
    </div>
    <div class="rail-list" id="historyList"></div>
    <button type="button" class="rail-clear" id="historyClearBtn">모두 지우기</button>
  </aside>

  <main class="main">
  <div class="setup-note" id="setupNote" style="display:none">
    아직 연결 설정이 안 됐습니다. 이 파일 맨 아래 <code>WORKER_URL</code> 값을 실제 Cloudflare Worker 주소로 바꿔주세요.
  </div>

  <div id="emptyState">
    <div class="suggestions" id="suggestions"></div>
    <div class="hint">심플리파이어의 책과 글이 만들어 낸 생각과 대화를 나누세요.</div>
  </div>

  <div id="thread"></div>

  <div class="composer">
    <form id="askForm">
      <div class="composer-box">
        <textarea id="questionInput" rows="1" placeholder="무엇이든 물어보세요" autocomplete="off"></textarea>
        <button type="submit" class="send-btn" id="askBtn" aria-label="전송" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
      <div class="cooldown-note" id="cooldownNote" style="display:none"></div>
    </form>
  </div>
  </main>
</div>

<script>
  // Cloudflare에서 이 Worker를 배포하면 나오는 실제 주소로 바꿔주세요.
  // 예: https://simplifier-ask.simon-8be.workers.dev
  const WORKER_URL = "https://simplifier-ask.simon-8be.workers.dev";

  // Worker의 ASK_SHARED_SECRET과 반드시 똑같은 값이어야 합니다.
  // 이건 진짜 보안이 아니라(공개 저장소라 이 값도 누구나 볼 수 있음),
  // 이 주소를 우연히 발견한 봇이 함부로 두드리지 못하게 막는 정도입니다.
  const ASK_SHARED_SECRET = "mSoMs0NZ28KYk7dEFd8hchvyND2A2NC5";

  // 이전 질문/답변을 여기 쌓아뒀다가 다음 질문 보낼 때 같이 넘긴다 --
  // 새로고침하면 사라지는 세션 한정 기억이고, 최근 5턴(10개)만 유지해서
  // 프롬프트가 한도 없이 길어지는 걸 막는다.
  let conversationHistory = [];
  const MAX_HISTORY_ENTRIES = 10;

  // Voyage AI 무료 티어가 분당 3회로 막혀 있다 -- 결제 수단을 등록하지 않기로
  // 했으므로(2026-08-31, 2026-09-03 재확인), 전송 버튼을 붙잡아둬서 애초에
  // 한도에 안 부딪히게 한다. 처음엔 "매 요청 21초 간격"으로 했는데, 거절
  // 답변처럼 1초 만에 끝나는 질문 뒤에 19초를 멍하니 기다리게 돼서 "뒤에서
  // 뭔가 도는 것 같다"는 오해를 낳았다(2026-09-03). 한도의 실제 모양대로
  // "최근 60초 안에 3번"으로 세면 연달아 3번까지는 바로 물을 수 있고,
  // 4번째만 기다린다. 방문자가 겹쳐 그래도 넘치면 워커가 429를 안내 문구로
  // 바꿔 보내고 재시도 버튼이 뜬다.
  const RATE_LIMIT_COUNT = 3;
  const RATE_LIMIT_WINDOW_MS = 60000;
  const RATE_LIMIT_MARGIN_MS = 1000;
  const requestTimes = [];

  function recordRequest() {
    requestTimes.push(Date.now());
  }

  // 지금 바로 한 번 더 보낼 수 있으면 0, 아니면 기다려야 하는 ms.
  function msUntilNextSlot() {
    const now = Date.now();
    while (requestTimes.length && now - requestTimes[0] >= RATE_LIMIT_WINDOW_MS) {
      requestTimes.shift();
    }
    if (requestTimes.length < RATE_LIMIT_COUNT) return 0;
    return requestTimes[0] + RATE_LIMIT_WINDOW_MS + RATE_LIMIT_MARGIN_MS - now;
  }

  const thread = document.getElementById("thread");
  const emptyState = document.getElementById("emptyState");
  const form = document.getElementById("askForm");
  const input = document.getElementById("questionInput");
  const btn = document.getElementById("askBtn");
  const setupNote = document.getElementById("setupNote");
  const newChatBtn = document.getElementById("newChatBtn");
  const historyBtn = document.getElementById("historyBtn");
  const rail = document.getElementById("rail");
  const railNewBtn = document.getElementById("railNewBtn");
  const railToggle = document.getElementById("railToggle");
  const railBackdrop = document.getElementById("railBackdrop");
  const wrap = document.querySelector(".wrap");
  const RAIL_KEY = "simplifier-ask.rail.v1";
  const mobileQuery = window.matchMedia("(max-width: 760px)");
  const historyList = document.getElementById("historyList");
  const historyClearBtn = document.getElementById("historyClearBtn");

  // ---- 이전 대화 (localStorage) ----
  // 서버는 이미 모든 질문·답변을 qa_feedback에 남기지만 화면에서 다시 볼 수 없었다.
  // 사장님이 "내가 뭘 물었더라"를 볼 수 있게 이 브라우저에만 저장한다 (2026-09-03).
  // localStorage는 시크릿 창·데이터 삭제·차단 설정에서 없거나 예외를 던지므로
  // 읽기·쓰기 모두 감싸고, 없어도 페이지는 그대로 동작해야 한다.
  const HISTORY_KEY = "simplifier-ask.conversations.v1";
  const HISTORY_MAX = 30;
  let currentConvId = null;

  function loadConversations() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      const data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function storeConversations(list) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX)));
    } catch (e) {
      /* 저장 불가 환경 -- 조용히 넘어간다 */
    }
  }

  function saveTurn(question, answer, sources, logId, followUps) {
    const list = loadConversations();
    const now = Date.now();
    let conv = currentConvId ? list.find((c) => c.id === currentConvId) : null;
    if (!conv) {
      conv = { id: String(now), title: question.slice(0, 60), createdAt: now, updatedAt: now, turns: [] };
      list.unshift(conv);
      currentConvId = conv.id;
    } else {
      // 최근 것이 위로 오게
      list.splice(list.indexOf(conv), 1);
      list.unshift(conv);
    }
    conv.updatedAt = now;
    conv.turns.push({ q: question, a: answer, sources: sources || [], logId: logId || null, followUps: followUps || [] });
    storeConversations(list);
    renderHistory();
  }

  function formatWhen(ts) {
    const d = new Date(ts);
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return sameDay ? `오늘 ${hh}:${mm}` : `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm}`;
  }

  function renderHistory() {
    const list = loadConversations();
    historyList.innerHTML = "";
    historyClearBtn.style.display = list.length ? "" : "none";
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "rail-empty";
      empty.textContent = "아직 대화가 없습니다.";
      historyList.appendChild(empty);
      return;
    }
    list.forEach((conv) => {
      const item = document.createElement("div");
      item.className = "rail-item" + (conv.id === currentConvId ? " current" : "");

      const open = document.createElement("button");
      open.type = "button";
      open.className = "rail-open";
      open.textContent = conv.title;
      // 폭이 좁아 말줄임으로 잘리는 제목의 보조 툴팁 -- STYLE_GUIDE가 허용하는 유일한 title= 용도
      open.title = `${conv.title} · ${formatWhen(conv.updatedAt)} · ${conv.turns.length}문답`;
      open.addEventListener("click", () => openConversation(conv.id));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "rail-del";
      del.setAttribute("aria-label", "이 대화 삭제");
      del.textContent = "✕";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        storeConversations(loadConversations().filter((c) => c.id !== conv.id));
        if (conv.id === currentConvId) currentConvId = null;
        renderHistory();
      });

      item.appendChild(open);
      item.appendChild(del);
      historyList.appendChild(item);
    });
  }

  function openConversation(id) {
    const conv = loadConversations().find((c) => c.id === id);
    if (!conv) return;
    if (busy) return; // 답변 스트리밍 중에는 화면을 갈아엎지 않는다
    thread.innerHTML = "";
    conversationHistory = [];
    currentConvId = conv.id;
    showThread();
    conv.turns.forEach((t) => {
      addUserRow(t.q);
      const el = addAnswerRow();
      finalizeAnswer(el, t.a, t.sources, t.logId, t.followUps);
      conversationHistory.push({ role: "user", content: t.q });
      conversationHistory.push({ role: "model", content: t.a });
    });
    if (conversationHistory.length > MAX_HISTORY_ENTRIES) {
      conversationHistory = conversationHistory.slice(-MAX_HISTORY_ENTRIES);
    }
    setHistoryOpen(false);
    renderHistory();
    input.focus();
    updateHeaderCompact();
  }

  // 모바일 서랍 열기/닫기 -- 데스크톱에서는 의미 없음(접기는 아래 setRailCollapsed)
  function setHistoryOpen(open) {
    rail.classList.toggle("open", open);
    railBackdrop.classList.toggle("show", open);
    historyBtn.setAttribute("aria-pressed", open ? "true" : "false");
    // 서랍이 화면 밖에 있을 때는 ⓘ 말풍선 위치 계산(studio.js positionAllInfoDots)이
    // 엉뚱한 좌표로 끝나 있어서, 연 뒤 목록을 다시 그려 DOM 변경 감시가 다시 계산하게 한다.
    if (open) renderHistory();
  }

  // 데스크톱 접기 -- 가는 띠에 › 만 남기고 대화 칸을 넓힌다. 브라우저가 기억.
  function setRailCollapsed(collapsed) {
    wrap.classList.toggle("rail-collapsed", collapsed);
    railToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    try {
      localStorage.setItem(RAIL_KEY, collapsed ? "closed" : "open");
    } catch (e) {
      /* 저장 불가 환경 */
    }
  }

  historyBtn.addEventListener("click", () => {
    setHistoryOpen(!rail.classList.contains("open"));
  });
  railBackdrop.addEventListener("click", () => setHistoryOpen(false));
  railToggle.addEventListener("click", () => {
    if (mobileQuery.matches) setHistoryOpen(false);
    else setRailCollapsed(!wrap.classList.contains("rail-collapsed"));
  });
  railNewBtn.addEventListener("click", resetToEmpty);
  try {
    if (localStorage.getItem(RAIL_KEY) === "closed") setRailCollapsed(true);
  } catch (e) {
    /* 저장 불가 환경 */
  }
  renderHistory();
  historyClearBtn.addEventListener("click", () => {
    if (!confirm("저장된 대화를 모두 지울까요? 되돌릴 수 없습니다.")) return;
    storeConversations([]);
    currentConvId = null;
    renderHistory();
  });
  const cooldownNote = document.getElementById("cooldownNote");

  // 전송 버튼은 (a) 입력창이 비어있거나 (b) 요청 중/쿨다운 중이면 눌러도
  // 소용없으니 딤드해서 비활성화해둔다. 두 조건을 한 곳에서 합쳐서 판단한다.
  let busy = false;
  function syncSendBtn() {
    btn.disabled = busy || !input.value.trim();
  }
  input.addEventListener("input", syncSendBtn);

  // 답변 끝에 모델이 스스로 붙이는 "(blog - ..., book - ...)" 인용을 떼어낸다 --
  // 아래에서 출처를 칩으로 따로, 더 깔끔하게 보여주기 때문에 중복이 된다.
  function stripInlineCitation(text) {
    return text.replace(/\n*\([^()]*(?:blog|book)\s*-[^()]*\)\s*$/i, "").trim();
  }

  function resetToEmpty() {
    thread.innerHTML = "";
    thread.classList.remove("active");
    emptyState.style.display = "flex";
    conversationHistory = [];
    currentConvId = null;
    setHistoryOpen(false);
    renderHistory();
    renderSuggestions();
    input.value = "";
    autoGrow();
    syncSendBtn();
    input.focus();
    updateHeaderCompact();
  }

  function showThread() {
    emptyState.style.display = "none";
    thread.classList.add("active");
  }

  // 모바일 전용: #thread 안에서 스크롤하면 부제목·버튼 줄을 접어 타이틀만 남긴다
  // (데스크톱은 헤더가 원래 작아 접을 필요가 없어 mobileQuery로 건다).
  const headerEl = document.querySelector("header");
  function updateHeaderCompact() {
    headerEl.classList.toggle("compact", mobileQuery.matches && thread.scrollTop > 4);
  }
  thread.addEventListener("scroll", updateHeaderCompact, { passive: true });
  mobileQuery.addEventListener("change", updateHeaderCompact);

  function addUserRow(text) {
    const row = document.createElement("div");
    row.className = "row q";
    const bubble = document.createElement("div");
    bubble.className = "bubble q";
    bubble.textContent = text;
    row.appendChild(bubble);
    thread.appendChild(row);
    row.scrollIntoView({ behavior: "smooth", block: "end" });
    return row;
  }

  function addAnswerRow() {
    const row = document.createElement("div");
    row.className = "row a";
    const answer = document.createElement("div");
    answer.className = "answer";
    answer.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
    row.appendChild(answer);
    thread.appendChild(row);
    row.scrollIntoView({ behavior: "smooth", block: "end" });
    return answer;
  }

  // 마크다운 표준(CommonMark)은 닫는 **가 문장부호 뒤·글자 앞에 오면 굵게로
  // 인정하지 않는다 -- 영어는 뒤에 띄어쓰기가 오지만 한국어는 조사가 바로
  // 붙어서(**'방향'**를, **Grit(…)**이) 별표가 그대로 보였다. marked에
  // 넘기기 전에 **…** 쌍을 먼저 <strong>으로 바꿔 이 규칙을 우회한다
  // (2026-09-02). 줄을 넘는 쌍은 건드리지 않는다.
  function renderMarkdown(text) {
    const boldFixed = text.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
    return window.marked ? marked.parse(boldFixed) : boldFixed;
  }

  function renderStreamingText(el, text) {
    const clean = stripInlineCitation(text);
    el.innerHTML = renderMarkdown(clean) + '<span class="cursor"></span>';
  }

  const ICON_ARTICLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>';
  const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>';

  function renderActions(el, logId, plainText) {
    const box = document.createElement("div");
    box.className = "feedback";

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "fb-btn copy-btn";
    copyBtn.textContent = "복사";
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(plainText);
        copyBtn.textContent = "복사됨";
        setTimeout(() => { copyBtn.textContent = "복사"; }, 1500);
      } catch (e) {
        // 클립보드 권한이 없는 브라우저 환경이면 조용히 넘어간다
      }
    });
    box.appendChild(copyBtn);

    if (!logId) {
      // 기록이 실패했으면 평가 대상이 없어서 복사 버튼만 두고 나머지는 생략
      el.appendChild(box);
      return;
    }

    const up = document.createElement("button");
    up.type = "button";
    up.className = "fb-btn";
    up.textContent = "👍";
    const down = document.createElement("button");
    down.type = "button";
    down.className = "fb-btn";
    down.textContent = "👎";
    const thanks = document.createElement("span");
    thanks.className = "fb-thanks";
    thanks.textContent = "감사합니다";

    async function send(rating, chosenBtn) {
      up.disabled = true;
      down.disabled = true;
      chosenBtn.classList.add("chosen");
      thanks.classList.add("show");
      try {
        await fetch(WORKER_URL + "/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Ask-Secret": ASK_SHARED_SECRET },
          body: JSON.stringify({ id: logId, rating }),
        });
      } catch (e) {
        // 평가 전송 실패는 조용히 넘어간다 -- 답변 자체엔 지장 없음
      }
    }
    up.addEventListener("click", () => send("up", up));
    down.addEventListener("click", () => send("down", down));

    box.appendChild(up);
    box.appendChild(down);
    box.appendChild(thanks);
    el.appendChild(box);
  }

  // 후속 질문 칩. 누르면 입력창에 채우고 바로 보낸다 -- 단, Voyage 쿨다운 중이면
  // 채워두기만 하고 카운트다운이 끝나는 순간 보낸다(사용자가 그 사이 입력창을
  // 고쳤으면 자동 전송하지 않는다).
  let pendingAutoSend = null;
  function renderFollowUps(el, questions) {
    if (!questions || !questions.length) return;
    const box = document.createElement("div");
    box.className = "followups";
    questions.forEach((q) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "suggestion-chip";
      chip.textContent = q;
      chip.addEventListener("click", () => {
        input.value = q;
        autoGrow();
        syncSendBtn();
        if (busy) {
          pendingAutoSend = q;
          input.focus();
        } else {
          form.requestSubmit();
        }
      });
      box.appendChild(chip);
    });
    el.appendChild(box);
  }

  function onCooldownEnd() {
    busy = false;
    syncSendBtn();
    if (pendingAutoSend !== null && input.value.trim() === pendingAutoSend) {
      pendingAutoSend = null;
      form.requestSubmit();
      return;
    }
    pendingAutoSend = null;
    input.focus();
  }

  function finalizeAnswer(el, text, sources, logId, followUps) {
    const clean = stripInlineCitation(text);
    el.innerHTML = renderMarkdown(clean);
    const plainText = el.innerText; // 칩·버튼 붙기 전, 답변 본문만 복사용으로 떼어둔다
    if (sources && sources.length) {
      const box = document.createElement("div");
      box.className = "sources";
      sources.forEach((s) => {
        // 클릭 가능한 링크로 원문을 새 탭에 열어준다 -- 책은 공개 페이지가
        // 없어서 링크 없이 아이콘만 붙인 칩으로 둔다.
        const chip = document.createElement(s.source_url ? "a" : "span");
        chip.className = "source-chip";
        if (s.source_url) {
          chip.href = s.source_url;
          chip.target = "_blank";
          chip.rel = "noopener";
        }
        chip.innerHTML =
          (s.source_type === "book" ? ICON_BOOK : ICON_ARTICLE) +
          '<span class="title">' + s.title + "</span>";
        box.appendChild(chip);
      });
      el.appendChild(box);
    }
    renderFollowUps(el, followUps);
    renderActions(el, logId, plainText);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  // Worker가 보내는 rawMessage 안에 실패한 단계(Voyage/Supabase 등)가 이미
  // 문자열로 찍혀 있어서, 그걸 근거로 어느 단계였는지만 짧게 구분해준다 --
  // 콘솔을 안 열어도 화면에서 바로 원인을 좁힐 수 있게 하기 위함
  // (2026-08-31, "에러가 계속 나는데 원인 파악이 안 된다"는 문의로 추가됨).
  function categorizeError(rawMessage) {
    const msg = String(rawMessage);
    if (msg.includes("Voyage 오류")) return "임베딩(Voyage AI) 단계";
    if (msg.includes("Supabase 오류")) return "검색 DB(Supabase) 단계";
    if (msg.includes("User location is not supported")) return "Gemini 지역 차단";
    if (msg.includes("Gemini") || msg.includes("candidates")) return "답변 생성(Gemini) 단계";
    return "원인 미분류";
  }

  function renderErrorWithRetry(el, rawMessage, onRetry) {
    console.error("Simplifier Q&A 오류:", rawMessage);
    el.className = "answer err";
    el.innerHTML = "";

    const msgBox = document.createElement("div");
    const text = document.createElement("div");
    text.textContent = "답변을 만드는 중 문제가 생겼습니다. 잠시 후 다시 시도해주세요.";
    msgBox.appendChild(text);

    const detail = document.createElement("div");
    detail.className = "err-detail";
    detail.textContent = categorizeError(rawMessage) + " · " + String(rawMessage).slice(0, 200);
    msgBox.appendChild(detail);

    el.appendChild(msgBox);

    const retryBtn = document.createElement("button");
    retryBtn.type = "button";
    retryBtn.className = "retry-btn";
    retryBtn.textContent = "다시 시도";
    // 쿨다운 중에는 버튼이 disabled라 클릭 자체가 안 먹지만, 만약을
    // 대비해 한 번 더 확인한다.
    retryBtn.addEventListener("click", () => {
      if (!btn.disabled) onRetry();
    });
    el.appendChild(retryBtn);
  }

  // 네트워크로 도착하는 덩어리(문장 단위)를 그대로 찍지 않고, 큐에 쌓아뒀다가
  // 일정한 속도로 한 글자씩 풀어서 보여준다 -- 실제 클로드/챗GPT가 하는 방식.
  function createTypewriter(el) {
    let pending = "";
    let revealed = "";
    let streamEnded = false;
    let timer = null;
    let resolveDone;
    const done = new Promise((resolve) => { resolveDone = resolve; });

    function tick() {
      if (pending.length > 0) {
        // 쌓인 게 많으면 조금씩 빨리, 거의 다 풀렸으면 한 글자씩 -- 자연스러운 타이핑 느낌.
        const step = Math.max(1, Math.ceil(pending.length / 20));
        revealed += pending.slice(0, step);
        pending = pending.slice(step);
        renderStreamingText(el, revealed);
      } else if (streamEnded) {
        clearInterval(timer);
        timer = null;
        resolveDone(revealed);
      }
    }
    timer = setInterval(tick, 16);

    return {
      push(text) { pending += text; },
      end() { streamEnded = true; },
      stop() {
        if (timer) { clearInterval(timer); timer = null; }
        resolveDone(revealed + pending);
      },
      done,
    };
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // ---- 첫 화면 추천 질문: ask-questions.json(110여 개)에서 3개를 무작위로 ----
  // 질문 풀은 코드 밖 JSON에 두어 코드 수정 없이 고칠 수 있게 했다. 전부 실제 글·책
  // 주제라 답변DB에 근거가 있다 -- 첫 클릭에서 거절이 나오면 최악의 첫인상이라서.
  // 파일을 못 읽으면 아래 세 개로 버틴다 (2026-09-03).
  const SUGGESTIONS_URL = "/insight-7b3e9f2c/ask-questions.json";
  const SUGGESTION_COUNT = 3;
  const suggestionsEl = document.getElementById("suggestions");
  let suggestionPool = ["빠르게 C레벨이 되는 방법은", "좋은 PO가 되는 법은", "커리어를 성공적으로 만드는 법은"];

  function pickRandom(list, n) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, n);
  }

  function renderSuggestions() {
    suggestionsEl.innerHTML = "";
    pickRandom(suggestionPool, SUGGESTION_COUNT).forEach((q) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "suggestion-chip";
      chip.textContent = q;
      chip.addEventListener("click", function () {
        input.value = q;
        syncSendBtn();
        form.requestSubmit();
      });
      suggestionsEl.appendChild(chip);
    });
  }

  renderSuggestions();
  fetch(SUGGESTIONS_URL, { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      const qs = data && Array.isArray(data.questions) ? data.questions.filter((q) => typeof q === "string" && q.trim()) : [];
      if (qs.length >= SUGGESTION_COUNT) {
        suggestionPool = qs;
        renderSuggestions();
      }
    })
    .catch(() => {
      /* 파일을 못 읽으면 기본 세 개 유지 */
    });

  newChatBtn.addEventListener("click", resetToEmpty);

  let cooldownTimer = null;

  // 최근 60초 안에 이미 3번 물었으면 가장 오래된 것이 60초를 넘길 때까지
  // 버튼을 막아두고, 몇 초 남았는지 보여준다.
  function applyCooldown(remainingMs) {
    if (remainingMs <= 0) {
      onCooldownEnd();
      return;
    }
    let remaining = Math.ceil(remainingMs / 1000);
    cooldownNote.style.display = "block";
    cooldownNote.textContent = `다음 질문까지 ${remaining}초 (1분에 3번까지 받을 수 있어요)`;
    if (cooldownTimer) clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        cooldownNote.style.display = "none";
        onCooldownEnd();
      } else {
        cooldownNote.textContent = `다음 질문까지 ${remaining}초 (1분에 3번까지 받을 수 있어요)`;
      }
    }, 1000);
  }

  async function ask(question) {
    showThread();
    addUserRow(question);
    const answerEl = addAnswerRow();
    await fetchAnswer(question, answerEl);
  }

  async function fetchAnswer(question, answerEl) {
    recordRequest();
    busy = true;
    syncSendBtn();
    answerEl.className = "answer";
    answerEl.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';

    let sources = null;
    let logId = null;
    let followUps = null;
    let started = false;
    const typewriter = createTypewriter(answerEl);
    const retry = () => fetchAnswer(question, answerEl);

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Ask-Secret": ASK_SHARED_SECRET,
        },
        body: JSON.stringify({ question, history: conversationHistory }),
      });

      if (!res.ok || !res.body) {
        const data = await res.json().catch(() => ({}));
        renderErrorWithRetry(answerEl, data.error || res.status, retry);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let raw = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        raw += decoder.decode(value, { stream: true });

        const events = raw.split("\n\n");
        raw = events.pop();

        for (const block of events) {
          let eventType = "message";
          let dataStr = "";
          for (const line of block.split("\n")) {
            if (line.startsWith("event:")) eventType = line.slice(6).trim();
            else if (line.startsWith("data:")) dataStr += line.slice(5).trim();
          }
          if (!dataStr) continue;

          let payload;
          try {
            payload = JSON.parse(dataStr);
          } catch (e) {
            continue;
          }

          if (eventType === "sources") {
            sources = payload.sources;
          } else if (eventType === "chunk") {
            if (!started) {
              started = true;
              answerEl.innerHTML = "";
            }
            typewriter.push(payload.text);
          } else if (eventType === "log_id") {
            logId = payload.id;
          } else if (eventType === "followups") {
            followUps = payload.questions;
          } else if (eventType === "error") {
            typewriter.stop();
            renderErrorWithRetry(answerEl, payload.error, retry);
            return;
          }
        }
      }

      typewriter.end();
      const finalText = await typewriter.done;
      finalizeAnswer(answerEl, finalText, sources, logId, followUps);

      conversationHistory.push({ role: "user", content: question });
      conversationHistory.push({ role: "model", content: finalText });
      if (conversationHistory.length > MAX_HISTORY_ENTRIES) {
        conversationHistory = conversationHistory.slice(-MAX_HISTORY_ENTRIES);
      }
      saveTurn(question, finalText, sources, logId, followUps);
    } catch (err) {
      typewriter.stop();
      renderErrorWithRetry(answerEl, "연결 오류 — " + err.message, retry);
      setupNote.style.display = "block";
    } finally {
      applyCooldown(msUntilNextSlot());
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    // Enter로 제출하면 disabled 버튼도 우회되므로, 쿨다운 중인지 여기서
    // 한 번 더 확인해서 막는다.
    if (btn.disabled) return;
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    autoGrow();
    ask(question);
  });
</script>
