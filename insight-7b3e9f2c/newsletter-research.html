<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스레터 리서치 - Simplifier</title>

<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">

<style>
  :root{
    --bg:#ffffff; --ink:#121210; --muted:#6e6a62; --dim:#403d37;
    --line:#c8c6bf; --line-soft:rgba(20,20,15,0.07);
    --card:#ffffff; --good:#1f7a4f; --warn:#a3690f; --bad:#b8402a;
    --gutter:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:0 var(--gutter) 60px;}
  @media (min-width:761px){ :root{ --gutter:32px; } }
  /* 제목·새로고침 버튼을 한 줄에 몰아서 세로 공간을 아낀다 -- 한 번만
     알면 되는 설명(주제 추가 방법 등)은 제목 옆 ⓘ 아이콘 hover/탭 툴팁으로
     뺐다(다른 Studio 페이지와 동일한 패턴). */
  header{display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:28px 0 18px; border-bottom:1px solid var(--line-soft); margin-bottom:24px;}
  h1{font-family:'Noto Serif KR',serif; font-weight:400; font-size:30px; letter-spacing:-0.01em; margin:0; display:inline-flex; align-items:baseline; gap:8px;}
  @media (min-width:761px){ h1{font-size:36px;} }
  h1 .info-dot{font-size:15px;}
  .meta-text{color:var(--muted); font-size:12.5px;}
  .info-dot{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:14px; height:14px; border:none; background:none; color:var(--muted);
    font-size:13px; font-family:inherit; line-height:1; cursor:pointer; padding:0;
    position:relative;
  }
  .info-dot:hover, .info-dot[aria-pressed="true"]{color:var(--ink);}
  .info-text{
    position:absolute; left:0; top:calc(100% + 8px);
    width:max-content; max-width:min(360px, 90vw); text-align:left;
    background:var(--ink); color:#fff; font-size:11.5px; font-weight:400;
    line-height:1.5; white-space:normal;
    padding:8px 11px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.18);
    opacity:0; visibility:hidden; pointer-events:none;
    transform:translateY(-4px);
    transition:opacity .15s, transform .15s, visibility .15s;
    z-index:30;
  }
  .info-dot:hover .info-text, .info-dot[aria-pressed="true"] .info-text{
    opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto;
  }
  #titleInfo .info-text{max-width:min(420px, 90vw);}
  /* 안내 문구 안에 실제 클릭 가능한 링크(GitHub Actions·Google Cloud Console)가
     있어서, 순수 텍스트만 되는 title 속성 대신 이 ⓘ 말풍선(HTML 허용)에
     그대로 옮겼다 -- 링크가 죽지 않게. */
  .info-text a{color:#fff; text-decoration:underline;}
  .refresh{
    background:none; border:1px solid var(--line); color:var(--dim); cursor:pointer;
    border-radius:999px; padding:7px 15px; font-size:12.5px; font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    transition:background-color .2s,border-color .2s,color .2s;
  }
  .refresh:hover:not(:disabled){background:var(--ink); border-color:var(--ink); color:#fff;}
  .refresh:disabled{cursor:default; opacity:0.75;}
  .refresh.is-success{border-color:var(--good); color:var(--good);}
  .refresh.is-error{border-color:var(--bad); color:var(--bad);}
  .refresh.is-loading .refresh-icon{display:inline-block; animation:refresh-spin .7s linear infinite;}
  @keyframes refresh-spin{ to{ transform:rotate(360deg); } }

  /* ---- admin shell: 사이드바 ----
     insight-7b3e9f2c/index.html, sns-insight.html, book-insight.html,
     multi-publish.html, write.html 과 동일한 블록입니다. 메뉴를 바꾸면
     다른 파일에도 똑같이 반영해야 합니다 (Jekyll include가 아니라 순수
     정적 HTML이라 공유가 안 됩니다). */
  #adminShellNav{position:fixed; top:0; left:0; bottom:0; width:180px; padding:24px 14px; background:#f7f6f2; border-right:1px solid var(--line-soft); overflow-y:auto; z-index:100;}
  #adminShellNav .shell-title{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; margin:0 0 16px; padding:0 10px;}
  #adminShellNav a{display:block; padding:9px 10px; margin-bottom:2px; border-radius:6px; color:var(--dim); text-decoration:none; font-size:14px;}
  #adminShellNav a:hover{background:var(--line-soft);}
  #adminShellNav a.active{background:var(--ink); color:#fff;}
  body.has-shell-nav{padding-left:180px;}
  @media (max-width:760px){
    #adminShellNav{position:static; width:auto; display:flex; gap:4px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line-soft); padding:10px 12px;}
    #adminShellNav .shell-title{display:none;}
    #adminShellNav a{white-space:nowrap; margin-bottom:0;}
    body.has-shell-nav{padding-left:0;}
  }

  .setup-note{background:#f7f6f2; border-radius:10px; padding:16px 18px; font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:24px;}
  .setup-note code{background:#eeece5; padding:1px 5px; border-radius:4px; font-size:11.5px;}

  details.topic{border:1px solid var(--line-soft); border-radius:10px; margin-bottom:14px; overflow:hidden;}
  details.topic summary{cursor:pointer; list-style:none; padding:16px 18px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  details.topic summary::-webkit-details-marker{display:none;}
  details.topic summary::before{content:'▸'; color:var(--muted); font-size:13px; transition:transform .15s;}
  details.topic[open] summary::before{transform:rotate(90deg);}
  details.topic .t-name{font-size:15px; font-weight:600;}
  details.topic .t-meta{font-size:12px; color:var(--muted);}
  details.topic .t-body{padding:0 18px 18px;}

  .rrow{display:flex; gap:10px; padding:12px 0; border-top:1px solid var(--line-soft);}
  .rrow .mark{flex:none; width:16px; text-align:center; color:var(--warn); font-size:13px; padding-top:2px;}
  .rrow .rmain{min-width:0;}
  .rrow .rtitle{font-size:13.5px; font-weight:500; text-decoration:none; color:var(--ink);}
  .rrow .rtitle:hover{text-decoration:underline;}
  .rrow .rdesc{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.55;}
  .rrow .rmeta{font-size:11px; color:var(--muted); margin-top:5px;}
  .rrow .badge{display:inline-block; font-size:10px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; text-transform:uppercase; letter-spacing:0.02em;}

  .loading, .err, .empty{font-size:13px; color:var(--muted); padding:20px 0;}
  .err{color:var(--bad);}
</style>
</head>
<body class="has-shell-nav">
<nav id="adminShellNav">
  <div class="shell-title">Simplifier Studio</div>
  <a href="/insight-7b3e9f2c/">사이트 인사이트</a>
  <a href="/insight-7b3e9f2c/sns-insight.html">SNS 인사이트</a>
  <a href="/insight-7b3e9f2c/book-insight.html">북 인사이트</a>
  <a href="/insight-7b3e9f2c/write.html">글쓰기</a>
  <a href="/insight-7b3e9f2c/multi-publish.html">멀티 퍼블리싱</a>
  <a href="/insight-7b3e9f2c/newsletter-research.html" class="active">뉴스레터 리서치</a>
  <a href="/insight-7b3e9f2c/pillar-manage.html">필러 관리</a>
  <a href="/insight-7b3e9f2c/ask.html">Simplifier Q&amp;A</a>
</nav>

<div class="wrap">
  <header>
    <h1>뉴스레터 리서치<button type="button" class="info-dot" id="titleInfo" aria-label="설명 보기">ⓘ<span class="info-text" id="titleInfoText">
      주제 키워드로 모은 후보 링크입니다. ★ 표시는 제목·요약에 구체적인 결과 수치(%, 시간 단축 등)가 있을 가능성이 높다는 신호이고, 실제 여부는 링크를 열어 직접 확인하세요.
      새 주제를 추가하려면 <a href="https://github.com/hansunghee7/hansunghee7.github.io/actions/workflows/research-newsletter.yml" target="_blank" rel="noopener">GitHub Actions의 "Research newsletter topic" 워크플로</a>를 열어 Run workflow 버튼을 누르고 주제 키워드를 입력하면 됩니다(터미널·가입·API 키 필요 없음 — 구글 뉴스 검색으로 바로 모읍니다). 실행이 끝나면 결과가 자동 커밋되고, 새로고침을 누르면 보입니다.
      유튜브 결과까지 보려면(선택) 저장소 Secrets에 YOUTUBE_API_KEY(<a href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a>에서 무료 발급)를 등록하세요. 터미널이 더 편하면 scripts/research_newsletter_topics.py를 직접 실행하고 커밋·푸시해도 동일하게 반영됩니다.
    </span></button></h1>
    <button class="refresh" id="refreshBtn"><span class="refresh-icon">↻</span> <span class="refresh-label">새로고침</span></button>
    <span id="lastRefresh" class="meta-text"></span>
  </header>

  <div id="content"><div class="loading">불러오는 중…</div></div>
</div>

<script>
(function () {
  var DATA_URL = "/assets/data/newsletter_research.json";
  var SOURCE_LABEL = { google_news: "뉴스", youtube: "유튜브" };

  var content = document.getElementById("content");

  /* ⓘ는 마우스를 올리면(:hover) 말풍선이 뜬다(CSS만으로 처리). 터치기기는
     hover가 없으므로, 탭하면 aria-pressed를 켜서 같은 CSS 규칙으로 말풍선을
     띄우고 다시 탭하거나 다른 곳을 탭하면 닫는다. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".info-dot") : null;
    var wasOpen = btn && btn.getAttribute("aria-pressed") === "true";
    document.querySelectorAll('.info-dot[aria-pressed="true"]').forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
    if (!btn) return;
    e.preventDefault();
    btn.setAttribute("aria-pressed", wasOpen ? "false" : "true");
  });

  function stampRefresh() {
    document.getElementById("lastRefresh").textContent =
      "· 마지막 새로고침 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  }

  function setRefreshState(btn, state) {
    btn.classList.remove("is-loading", "is-success", "is-error");
    var icon = btn.querySelector(".refresh-icon");
    var label = btn.querySelector(".refresh-label");
    if (state === "loading") {
      btn.disabled = true; btn.classList.add("is-loading");
      icon.textContent = "↻"; label.textContent = "불러오는 중…";
    } else if (state === "success") {
      btn.disabled = false; btn.classList.add("is-success");
      icon.textContent = "✓"; label.textContent = "완료";
    } else if (state === "error") {
      btn.disabled = false; btn.classList.add("is-error");
      icon.textContent = "✕"; label.textContent = "실패";
    } else {
      btn.disabled = false;
      icon.textContent = "↻"; label.textContent = "새로고침";
    }
  }

  function load() {
    content.innerHTML = '<div class="loading">불러오는 중…</div>';
    return fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : { topics: [] }; })
      .then(function (data) { render((data && data.topics) || []); return true; })
      .catch(function (e) {
        content.innerHTML = '<div class="err">데이터를 못 불러왔습니다: ' + escapeHtml(String(e)) + "</div>";
        return false;
      });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    var btn = this;
    setRefreshState(btn, "loading");
    load().then(function (ok) {
      stampRefresh();
      setRefreshState(btn, ok ? "success" : "error");
      setTimeout(function () { setRefreshState(btn, "idle"); }, 1600);
    });
  });
  load().then(function () { stampRefresh(); });

  function render(topics) {
    if (!topics.length) {
      content.innerHTML = '<div class="empty">아직 리서치 결과가 없습니다. 위 안내대로 스크립트를 한 번 실행해보세요.</div>';
      return;
    }
    content.innerHTML = topics.map(function (t, i) { return buildTopic(t, i === 0); }).join("");
  }

  function buildTopic(t, open) {
    var rows = t.results || [];
    var signalCount = rows.filter(function (r) { return r.hasNumberSignal; }).length;
    var date = t.searched_at ? t.searched_at.slice(0, 10) : "";
    return (
      '<details class="topic"' + (open ? " open" : "") + '>' +
      '<summary><span class="t-name">' + escapeHtml(t.topic) + '</span>' +
      '<span class="t-meta">' + date + " · " + rows.length + "건 (★ " + signalCount + "건)</span></summary>" +
      '<div class="t-body">' + (rows.length ? rows.map(buildRow).join("") : '<div class="empty">검색 결과가 없었습니다.</div>') + "</div>" +
      "</details>"
    );
  }

  function formatDate(s) {
    if (!s) return "";
    var d = new Date(s);
    if (isNaN(d.getTime())) return "";
    return d.toISOString().slice(0, 10);
  }

  function buildRow(r) {
    var mark = r.hasNumberSignal ? "★" : "";
    var badge = SOURCE_LABEL[r.source] || r.source || "";
    var rest = [r.channel, formatDate(r.date)].filter(Boolean).join(" · ");
    return (
      '<div class="rrow"><span class="mark">' + mark + '</span>' +
      '<div class="rmain">' +
      '<a class="rtitle" href="' + escapeHtml(r.link) + '" target="_blank" rel="noopener">' + escapeHtml(r.title) + "</a>" +
      (r.description ? '<div class="rdesc">' + escapeHtml(r.description) + "</div>" : "") +
      '<div class="rmeta"><span class="badge">' + escapeHtml(badge) + "</span>" + (rest ? " " + escapeHtml(rest) : "") + "</div>" +
      "</div></div>"
    );
  }

  function escapeHtml(s) {
    return (s || "").toString().replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
</body>
</html>
