<!-- Studio 메뉴 타이틀(h1)은 명조체 큰 제목으로 통일합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff; --ink:#121210; --muted:#6e6a62; --dim:#403d37;
    --line:#c8c6bf; --line-soft:rgba(20,20,15,0.07);
    --card:#ffffff; --good:#1f7a4f; --warn:#a3690f; --bad:#b8402a;
    --gutter:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:0 var(--gutter) 60px;}
  @media (min-width:761px){ :root{ --gutter:32px; } }
  /* 제목·새로고침 버튼·데이터 기준 날짜를 한 줄에 몰아서 세로 공간을
     아낀다 -- 설치 안내 같은 한 번만 알면 되는 정보는 제목 옆 ⓘ 아이콘
     hover 툴팁으로 뺐다(북 인사이트와 동일한 패턴). */
  header{display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:28px 0 18px; border-bottom:1px solid var(--line-soft); margin-bottom:24px;}
  h1{font-family:'Noto Serif KR',serif; font-weight:400; font-size:30px; letter-spacing:-0.01em; margin:0; display:inline-flex; align-items:baseline; gap:8px;}
  @media (min-width:761px){ h1{font-size:36px;} }
  h1 .info-dot{font-size:15px;}
  .meta-text{color:var(--muted); font-size:12.5px;}
  /* 날짜/기록수 같은 부가정보는 이 ⓘ 버튼 뒤에 숨겨둔다. 라벨(카드 제목)
     바로 옆에 붙여서 "이게 뭔지" 알려주는 요소끼리 모아두고, 숫자 줄은
     방해 없이 크게 본다 -- 북 인사이트·사이트 인사이트와 동일한 배치
     원칙(라벨에 항상 붙여서, 줄 끝으로 밀어두지 않음). 마우스를 올리면
     (데스크톱) 또는 탭하면(터치기기 -- hover가 없어서 aria-pressed를 켜서
     같은 CSS로 띄운다) 말풍선이 뜬다. */
  .info-dot{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:14px; height:14px; border:none; background:none; color:var(--muted);
    font-size:13px; font-family:inherit; line-height:1; cursor:pointer; padding:0;
    position:relative;
  }
  .info-dot:hover, .info-dot[aria-pressed="true"]{color:var(--ink);}
  .info-text{
    position:absolute; left:0; top:calc(100% + 8px);
    width:max-content; max-width:min(360px, 90vw); text-align:left;
    background:var(--ink); color:#fff; font-size:11.5px; font-weight:400;
    line-height:1.5; white-space:normal;
    padding:8px 11px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.18);
    opacity:0; visibility:hidden; pointer-events:none;
    transform:translateY(-4px);
    transition:opacity .15s, transform .15s, visibility .15s;
    z-index:30;
  }
  .info-dot:hover .info-text, .info-dot[aria-pressed="true"] .info-text{
    opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto;
  }
  #titleInfo .info-text{max-width:min(480px, 90vw);}

  /* ---- admin shell: 사이드바 ----
     insight-7b3e9f2c/index.html, multi-publish.html, write.html 과 동일한
     블록입니다. 메뉴를 바꾸면 다른 파일에도 똑같이 반영해야 합니다
     (Jekyll include가 아니라 순수 정적 HTML이라 공유가 안 됩니다). */
  #adminShellNav{position:fixed; top:0; left:0; bottom:0; width:180px; padding:24px 14px; background:#f7f6f2; border-right:1px solid var(--line-soft); overflow-y:auto; z-index:100;}
  #adminShellNav .shell-title{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; margin:0 0 16px; padding:0 10px;}
  #adminShellNav a{display:block; padding:9px 10px; margin-bottom:2px; border-radius:6px; color:var(--dim); text-decoration:none; font-size:14px;}
  #adminShellNav a:hover{background:var(--line-soft);}
  #adminShellNav a.active{background:var(--ink); color:#fff;}
  body.has-shell-nav{padding-left:180px;}
  @media (max-width:760px){
    #adminShellNav{position:static; width:auto; display:flex; gap:4px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line-soft); padding:10px 12px;}
    #adminShellNav .shell-title{display:none;}
    #adminShellNav a{white-space:nowrap; margin-bottom:0;}
    body.has-shell-nav{padding-left:0;}
  }

  #grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px;}
  .platform-card{border:1px solid var(--line-soft); border-radius:10px; padding:18px;}
  .platform-card.is-empty{opacity:0.45;}
  .platform-card.total-card{grid-column:1 / -1; background:#f7f6f2; border-color:var(--line);}
  .platform-card.total-card .count{font-size:38px;}
  .platform-card h3{margin:0 0 4px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .platform-card .shortcut-link{font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; border:1px solid var(--line-soft); border-radius:5px; width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; line-height:1;}
  .platform-card .shortcut-link:hover{color:var(--ink); border-color:var(--ink);}
  .platform-card .source-badge{font-size:10.5px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;}
  .platform-card .latest{display:flex; align-items:baseline; gap:8px; margin:10px 0 6px;}
  .platform-card .latest .count{font-size:30px; font-weight:700;}
  .platform-card .latest .delta{font-size:13px; font-weight:600;}
  .platform-card .latest .delta.up{color:var(--good);}
  .platform-card .latest .delta.down{color:var(--bad);}
  .platform-card .latest .unit{font-size:12px; color:var(--muted);}
  .platform-card svg{width:100%; height:56px; display:block;}
  .platform-card .empty{font-size:12px; color:var(--muted); padding:20px 0; text-align:center;}
  .platform-card .secondary-stat{font-size:11.5px; color:var(--muted); margin-top:8px;}

  .loading, .err{font-size:13px; color:var(--muted); padding:20px 0;}
  .err{color:var(--bad);}

  .refresh{
    background:none; border:1px solid var(--line); color:var(--dim); cursor:pointer;
    border-radius:999px; padding:7px 15px; font-size:12.5px; font-family:inherit;
    transition:background-color .2s,border-color .2s,color .2s;
  }
  .refresh:hover:not(:disabled){background:var(--ink); border-color:var(--ink); color:#fff;}
  .refresh:disabled{cursor:default; opacity:0.75;}
  .refresh.is-success{border-color:var(--good); color:var(--good);}
  .refresh.is-error{border-color:var(--bad); color:var(--bad);}
  .refresh.is-loading .refresh-icon{display:inline-block; animation:refresh-spin .7s linear infinite;}
  @keyframes refresh-spin{ to{ transform:rotate(360deg); } }
</style>

<div class="wrap">
  <header>
    <h1>SNS 인사이트<button type="button" class="info-dot" id="titleInfo" aria-label="설명 보기">ⓘ<span class="info-text">각 SNS 프로필의 팔로워 수 추이입니다. 오늘자 기록이 이미 있으면 그대로 보여주고, 없을 때만 새로고침이 크롬 확장에 전체 수집을 요청합니다(8개 중 아무 SNS나 직접 방문해도 동일하게 수집됩니다). 기록이 안 보이면 _sns-extension 크롬 확장을 설치하고 GitHub 연결까지 해야 합니다. 수집·커밋에 몇십 초 걸리니 방금 요청한 값은 조금 있다 다시 새로고침해야 보입니다.</span></button></h1>
    <button class="refresh" id="refreshBtn"><span class="refresh-icon">↻</span> <span class="refresh-label">새로고침</span></button>
    <span id="lastRefresh" class="meta-text"></span>
  </header>

  <div id="statusArea"></div>
  <div id="grid"><div class="loading">불러오는 중…</div></div>
</div>

<script>
(function () {
  var DATA_URL = "/assets/data/sns-insight.json";

  var PLATFORMS = [
    { key: "linkedin", label: "LinkedIn", source: "크롬 확장", url: "https://www.linkedin.com/in/simplifier" },
    { key: "facebook", label: "Facebook", source: "크롬 확장", url: "https://www.facebook.com/simplifier.seoul" },
    { key: "instagram", label: "Instagram", source: "크롬 확장", url: "https://www.instagram.com/simplifier_seoul/" },
    { key: "threads", label: "Threads", source: "크롬 확장", url: "https://www.threads.com/?hl=ko" },
    { key: "brunch", label: "브런치", source: "크롬 확장", url: "https://brunch.co.kr/@simplifier" },
    { key: "naver_blog", label: "네이버블로그", source: "크롬 확장", url: "https://blog.naver.com/simplifiers" },
    { key: "remember", label: "리멤버 커넥트", source: "크롬 확장", url: "https://connect.rememberapp.co.kr/profile/1582110/posts" },
    { key: "rocketpunch", label: "로켓펀치", source: "크롬 확장", url: "https://www.rocketpunch.com/@simplfier/post" },
  ];

  var els = { status: document.getElementById("statusArea"), grid: document.getElementById("grid") };
  var lastData = {};

  // "마지막 새로고침"을 클릭 시각(지금)으로 찍으면, 실제로는 하루 한 번만
  // 수집되는데 누를 때마다 시각이 바뀌어서 "방금 또 새로 모았나?"로
  // 오해하게 된다. 그래서 클릭 시각이 아니라 데이터 자체에 찍힌 가장 최근
  // capturedAt(실제로 언제 수집됐는지)을 보여준다 -- 여러 번 눌러도 실제로
  // 새 수집이 없었으면 이 시각은 그대로다.
  function stampRefresh(data) {
    var latest = null;
    PLATFORMS.forEach(function (p) {
      var series = data[p.key] || [];
      if (!series.length) return;
      var c = series[series.length - 1].capturedAt;
      if (c && (!latest || c > latest)) latest = c;
    });
    var el = document.getElementById("lastRefresh");
    if (!latest) { el.textContent = ""; return; }
    var d = new Date(latest);
    el.textContent = "· 데이터 기준 " + d.toLocaleDateString("ko-KR", { month: "2-digit", day: "2-digit" }) +
      " " + d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  }

  /* ⓘ는 마우스를 올리면(:hover) 말풍선이 뜬다(CSS만으로 처리). 터치기기는
     hover가 없으므로, 탭하면 aria-pressed를 켜서 같은 CSS 규칙으로 말풍선을
     띄우고 다시 탭하거나 다른 곳을 탭하면 닫는다. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".info-dot") : null;
    var wasOpen = btn && btn.getAttribute("aria-pressed") === "true";
    document.querySelectorAll('.info-dot[aria-pressed="true"]').forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
    if (!btn) return;
    e.preventDefault();
    btn.setAttribute("aria-pressed", wasOpen ? "false" : "true");
  });

  function kstToday() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
  }

  // 8개 전부 오늘(KST)자 기록이 이미 있으면 "오늘은 더 수집할 필요 없음"으로
  // 본다 -- 확장의 background.js가 하루 한 번만 도는 것과 같은 기준을
  // 페이지 쪽에서도 데이터로 판단한다(확장 storage는 페이지에서 직접 못 읽음).
  function isFresh(data) {
    var today = kstToday();
    return PLATFORMS.every(function (p) {
      var series = data[p.key] || [];
      return series.length > 0 && series[series.length - 1].date === today;
    });
  }

  function setRefreshState(btn, state) {
    btn.classList.remove("is-loading", "is-success", "is-error");
    var icon = btn.querySelector(".refresh-icon");
    var label = btn.querySelector(".refresh-label");
    if (state === "loading") {
      btn.disabled = true; btn.classList.add("is-loading");
      icon.textContent = "↻"; label.textContent = "불러오는 중…";
    } else if (state === "success") {
      btn.disabled = false; btn.classList.add("is-success");
      icon.textContent = "✓"; label.textContent = "완료";
    } else if (state === "error") {
      btn.disabled = false; btn.classList.add("is-error");
      icon.textContent = "✕"; label.textContent = "실패";
    } else {
      btn.disabled = false;
      icon.textContent = "↻"; label.textContent = "새로고침";
    }
  }

  function load() {
    els.status.innerHTML = "";
    return fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (data) {
        lastData = data || {};
        render(lastData);
        return true;
      })
      .catch(function (e) {
        els.status.innerHTML = '<div class="err">데이터를 못 불러왔습니다: ' + escapeHtml(String(e)) + "</div>";
        return false;
      });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    var btn = this;
    setRefreshState(btn, "loading");
    load().then(function (ok) {
      stampRefresh(lastData);
      if (ok && isFresh(lastData)) {
        // 이미 오늘자 기록이 다 있으면, 굳이 크롬 확장에 8개 전체 수집을
        // 또 요청하지 않는다 -- 방금 불러온 값을 다시 보여주는 걸로 끝낸다.
        setRefreshState(btn, "success");
        setTimeout(function () { setRefreshState(btn, "idle"); }, 1600);
        return;
      }
      // 오늘자 기록이 없는 플랫폼이 있을 때만 크롬 확장(설치돼 있으면)에
      // 8개 SNS를 다시 한 바퀴 돌아달라고 요청한다. 수집·커밋은 몇 초~몇십 초
      // 걸리는 별도 과정이라, 방금 요청한 새 값은 조금 있다 다시
      // 새로고침해야 보인다.
      window.dispatchEvent(new CustomEvent("simplifier-sns-force-refresh"));
      setRefreshState(btn, ok ? "success" : "error");
      setTimeout(function () { setRefreshState(btn, "idle"); }, 1600);
    });
  });
  load().then(function () { stampRefresh(lastData); });

  function render(data) {
    els.grid.innerHTML = buildTotalCard(data) + PLATFORMS.map(function (p) { return buildCard(p, data); }).join("");
  }

  /* 8개 채널의 최신 팔로워 수를 다 더한 합계 카드. 날짜가 채널마다
     조금씩 어긋날 수 있어(수집 실패 등) 날짜별로 정확히 맞춰 더하는 대신,
     각 채널의 "가장 최근 기록"을 그대로 합산한다 -- 개별 카드의 델타
     계산 방식과 동일한 기준. */
  function buildTotalCard(data) {
    var totalNow = 0, totalPrev = 0, channelCount = 0;
    PLATFORMS.forEach(function (p) {
      var series = data[p.key] || [];
      if (!series.length) return;
      channelCount++;
      var latest = series[series.length - 1];
      var prev = series.length > 1 ? series[series.length - 2] : latest;
      totalNow += latest.count;
      totalPrev += prev.count;
    });
    if (!channelCount) return "";

    var delta = totalNow - totalPrev;
    var deltaHtml = delta !== 0
      ? '<span class="delta ' + (delta > 0 ? "up" : "down") + '">' + (delta > 0 ? "▲" : "▼") + Math.abs(delta) + "</span>"
      : "";

    var totalSeries = buildTotalSeries(data);

    var infoDot = '<button type="button" class="info-dot" aria-label="설명 보기">ⓘ<span class="info-text">' + escapeHtml(totalSeries.length + "개 날짜 기록") + "</span></button>";

    return (
      '<div class="platform-card total-card"><h3>전체 합계' + infoDot + "</h3>" +
      '<span class="source-badge">' + channelCount + "개 채널 합산</span>" +
      '<div class="latest"><span class="count">' + totalNow.toLocaleString() + "</span>" + deltaHtml + '<span class="unit">명</span></div>' +
      (totalSeries.length ? sparkline(totalSeries, 900) : "") +
      "</div>"
    );
  }

  /* 채널마다 캡처된 날짜가 조금씩 어긋날 수 있어서(수집 실패 등), 날짜별로
     "그 채널이 그때까지 알려진 마지막 값"을 이월(forward-fill)해서 더한다
     -- 한 채널이 하루 빠졌다고 합계가 뚝 떨어지는 것처럼 보이지 않게. */
  function buildTotalSeries(data) {
    var dateSet = {};
    PLATFORMS.forEach(function (p) {
      (data[p.key] || []).forEach(function (e) { dateSet[e.date] = true; });
    });
    var dates = Object.keys(dateSet).sort();
    var lastKnown = {};
    return dates.map(function (date) {
      var total = 0;
      PLATFORMS.forEach(function (p) {
        var entry = (data[p.key] || []).filter(function (e) { return e.date === date; })[0];
        if (entry) lastKnown[p.key] = entry.count;
        if (lastKnown[p.key] != null) total += lastKnown[p.key];
      });
      return { date: date, count: total };
    });
  }

  function headerHtml(p, infoDot) {
    var link = p.url
      ? '<a class="shortcut-link" href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener" title="' + escapeHtml(p.label) + ' 바로가기">↗</a>'
      : "";
    return '<h3>' + escapeHtml(p.label) + link + (infoDot || "") + "</h3>";
  }

  function buildCard(p, data) {
    var series = data[p.key] || [];
    if (!series.length) {
      return (
        '<div class="platform-card is-empty">' + headerHtml(p) +
        '<span class="source-badge">' + escapeHtml(p.source) + "</span>" +
        '<div class="empty">아직 기록된 데이터가 없습니다</div></div>'
      );
    }

    var latest = series[series.length - 1];
    var prev = series.length > 1 ? series[series.length - 2] : null;
    var delta = prev ? latest.count - prev.count : null;
    var deltaHtml = "";
    if (delta !== null && delta !== 0) {
      deltaHtml = '<span class="delta ' + (delta > 0 ? "up" : "down") + '">' + (delta > 0 ? "▲" : "▼") + Math.abs(delta) + "</span>";
    }

    var secondaryHtml = "";
    if (p.secondaryKey && data[p.secondaryKey] && data[p.secondaryKey].length) {
      var secSeries = data[p.secondaryKey];
      var secLatest = secSeries[secSeries.length - 1];
      secondaryHtml = '<div class="secondary-stat">' + escapeHtml(p.secondaryLabel) + " " + secLatest.count.toLocaleString() + "</div>";
    }

    var infoTitle = latest.date + " 기준 · " + series.length + "개 기록";
    var infoDot = '<button type="button" class="info-dot" aria-label="설명 보기">ⓘ<span class="info-text">' + escapeHtml(infoTitle) + "</span></button>";

    return (
      '<div class="platform-card">' + headerHtml(p, infoDot) +
      '<span class="source-badge">' + escapeHtml(p.source) + "</span>" +
      '<div class="latest"><span class="count">' + latest.count.toLocaleString() + "</span>" + deltaHtml + '<span class="unit">명</span></div>' +
      sparkline(series) +
      secondaryHtml +
      "</div>"
    );
  }

  function sparkline(series, w) {
    // viewBox 너비(w)는 실제 렌더링될 카드 너비에 가깝게 맞춰야 한다 --
    // preserveAspectRatio="none"으로 가로/세로를 따로 늘리는데, viewBox가
    // 실제 너비보다 훨씬 좁으면(예: 전체 합계 카드처럼 카드 전체 폭을 쓰는
    // 경우) 가로로만 심하게 늘어나면서 원형 점(circle)이 계란처럼 찌그러져
    // 보인다. 기본값(260)은 일반 카드 폭 기준이고, 더 넓은 카드는 호출부에서
    // 실제 폭에 맞는 값을 넘긴다.
    w = w || 260;
    var h = 56, pad = 4;
    var counts = series.map(function (e) { return e.count; });
    var min = Math.min.apply(null, counts);
    var max = Math.max.apply(null, counts);
    var range = max - min || 1;

    var points = series.map(function (e, i) {
      var x = series.length === 1 ? w / 2 : pad + (i / (series.length - 1)) * (w - pad * 2);
      var y = h - pad - ((e.count - min) / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });

    var path = "M" + points.join(" L");
    var lastPoint = points[points.length - 1].split(",");

    return (
      '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="#121210" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + lastPoint[0] + '" cy="' + lastPoint[1] + '" r="3" fill="#121210"/>' +
      "</svg>"
    );
  }

  function escapeHtml(s) {
    return (s || "").toString().replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
</body>
</html>
