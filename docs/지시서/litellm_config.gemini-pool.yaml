# AI Pool 프로젝트 Phase 1 - 제미나이 단일 공용 풀 LiteLLM 설정
#
# 이 파일은 그대로 로컬 PC에 복사해서 쓴다. 실제 키 값은 여기 적지 않고
# 환경변수(GEMINI_API_KEY_1/_2/_3)로만 참조한다 - 이 저장소는 공개이므로
# 절대 값 자체를 커밋하지 않는다.
#
# 배경·설계 근거: docs/지시서/2026-09-16_로컬탐_헤르메스모델라우팅.md 0절,
# docs/AI_POOL_프로젝트.md Phase 1.

model_list:
  - model_name: gemini-pool
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY_1
  - model_name: gemini-pool
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY_2
  - model_name: gemini-pool
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY_3

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  cooldown_time: 60

# 외부 유출 방지용 안전장치(2026-09-16, 사장님 지시). master_key 값 자체는
# 여기 적지 않는다(공개 저장소) - 로컬에서만 환경변수로 채운다. 이 값이
# 없으면 프록시가 아예 안 뜨거나 인증 없이 열리니, 실행 전에 반드시
# LITELLM_MASTER_KEY를 설정할 것. 값을 아는 호출자만 Authorization: Bearer
# <값> 헤더로 호출 가능해진다.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
