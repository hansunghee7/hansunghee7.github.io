# 2. 도구 관문이 내보내는 경로에 연결돼 있는가 (결정 요청·예측은 KPI 연결 없이 기록되지 않는다)
[[check]]
name = "관문 존재: jitu_po.py kpi_gate"
type = "file_contains"
path = 'scripts/ops/jitu_po.py'
text = "def kpi_gate"

[[check]]
name = "관문 연결: 결정 요청(ask add)"
type = "file_contains"
path = 'scripts/ops/jitu_po.py'
text = 'kpi_gate(a.kpi, "결정 요청")'

[[check]]
name = "관문 연결: 예측(predict add)"
type = "file_contains"
path = 'scripts/ops/jitu_po.py'
text = 'kpi_gate(a.kpi, "예측")'

[[check]]
name = "관문 동작 시험: KPI 없는 결정 요청이 막히는가"
type = "cmd_ok"
cmd = ["python", ".claude/hooks/test_jitu_kpi_gate.py"]

