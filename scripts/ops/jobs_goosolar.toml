[[job]]
id = "cron:factory-stall"
kind = "cmd"
cmd = ["sh", "-c", 'W=/home/goosloar/workshop; if [ -n "$(find $W/PAUSE_FLOW -mmin +720 2>/dev/null)" ]; then echo "PAUSE_FLOW가 12시간 넘게 유지돼 공장이 멈춰 있음"; exit 1; fi; q=$(grep -l queued $W/queue/*/status 2>/dev/null | wc -l); if [ "$q" -gt 0 ] && [ -z "$(find $W/queue -name status -mmin -1440 2>/dev/null)" ]; then echo "대기 ${q}건인데 24시간 진전 없음"; exit 1; fi; echo "ok 대기 ${q}건"']
name = "구PC 공장 정지 알람(PAUSE_FLOW 12시간 초과 또는 대기열 있는데 24시간 진전 없음, 토큰 0)"
note = "2026-10-07 등록(핏, 사장님 지시: 정지 알림을 구PC에 토큰 최소로). 배경: PAUSE_FLOW가 10/5부터 걸려 대기열이 쌓여도 알림이 없어 사장님이 직접 발견. 증거: 등록 전 구PC에서 읽기 전용 1회 실행 rc=0 'ok 대기 4건'. 붉을 때 할 일: ls ~/workshop/PAUSE_FLOW*와 queue/*/status 확인, 해제는 신PC에서 ssh goosolar로(프로세스표 핏-야간공장 #1). 24시간 기준은 Flow 크레딧이 하루 1회 갱신되므로 하루 이상 진전 없음이 이상 신호."

