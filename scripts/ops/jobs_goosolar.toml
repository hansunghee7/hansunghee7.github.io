# ---------- 에이전트가 쓰는 서비스 ----------
[[job]]
id = "svc:saegim"
kind = "http"
url = "https://saegim-mcp-175301711490.asia-northeast3.run.app/"
name = "새김 서버(홈)"

# 기능 점검: 에이전트가 실제로 쓰는 것이 동작하는지(비밀값 없이 가능한 범위). 실제 질문·세션 유지 시험은 별도 추가 예정
[[job]]
id = "fn:saegim-mcp-endpoint"
kind = "http"
url = "https://saegim-mcp-175301711490.asia-northeast3.run.app/mcp"
expect = 405
name = "새김 MCP 엔드포인트(GET 405가 정상)"

[[job]]
id = "fn:saegim-mcp-auth"
kind = "http"
url = "https://saegim-mcp-175301711490.asia-northeast3.run.app/mcp"
method = "POST"
body = "{}"
expect = 401
name = "새김 MCP 인증(토큰 없는 POST 401이 정상)"

[[job]]
id = "fn:dialog-worker"
kind = "http"
url = "https://simplifier-ask.simon-8be.workers.dev/"
expect = 405
name = "심플리파이어 다이얼로그(워커 응답, 405가 정상)"
note = "질문 실사용 점검은 무료 한도 때문에 하루 1회로 별도 추가 예정"


