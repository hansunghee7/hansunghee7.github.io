# 구PC(goosolar) 감시 대장 (2026-09-20). 신PC가 꺼져 있어도 GitHub 예약 작업과 외부 서비스 점검이 계속 돌게 나눈 것.
# 신PC 로컬 자원(헤르메스, 제미나이 풀, PC 보안, 문서 위생)은 신PC 대장(jobs.toml)에 남는다.
# 실행: 구PC cron 30분마다 OPS_JOBS=jobs_goosolar.toml OPS_HOST=구PC python3 watch.py

[[job]]
id = "cron:publish-kick"
kind = "file_age"
path = "/home/goosloar/ops/kick.last"
max_age_min = 45
name = "예약 발행 보조 시계(구PC cron, kick_publish.py)"
note = "2026-09-20 신PC 작업 스케줄러에서 구PC cron으로 이전. 구PC 자신의 kick.last 갱신 시각을 확인(신PC 대장의 watcher:goosolar가 구PC 전체를 밖에서 봄)"

[[job]]
id = "svc:hermes-agent"
kind = "cmd"
cmd = ["systemctl", "is-active", "hermes-agent"]
name = "구솔라 텔레그램 봇(hermes-agent 서비스, /wol 신PC 켜기)"
note = "2026-09-21 허용 사용자 제한·WoL 확인 응답 개편. 봇이 죽으면 신PC 켜기가 안 된다"

[[job]]
id = "tcp:sinpc-up"
kind = "tcp"
host = "100.67.79.19"
ports = [22, 11434]
direct = true
name = "신PC 응답(포트 22 또는 11434)"
note = "주소는 Tailscale 고정 주소(공유기 유선 주소는 DHCP로 .33에서 .48로 바뀌어 못 씀). 2026-09-21 사장님 승인: 신PC가 응답 없을 때만 구PC가 사장님 폰(텔레그램)으로 직접 알림. 연속 2회(약 1시간) 실패 때 1번만, 복구 알림은 폰으로 안 보냄. 신PC 감시가 못 알리는 상황을 구PC가 대신 알린다"

