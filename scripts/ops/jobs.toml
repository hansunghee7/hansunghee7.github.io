# 주기 작업·서비스·PC 상태 대장 (watch.py가 읽는다). 새 주기 작업을 만들면 여기에 한 항목을 추가한다.
# 등록 = 지금 1회 실행해 성공 증거를 확인한 뒤 이 대장에 적는 것까지(DONE=VERIFIED, 사장님 지시 2026-09-20).
# kind: hermes_cron | gh_workflow | tcp | http | cmd | file_age | git_file_lines | git_file_age | pc.  every_min: 점검 주기(분). 기본 30, gh_workflow·cmd 360, pc 1440. fail_after: 연속 실패 몇 번째에 알릴지(기본 2, gh_workflow·pc·cmd는 1).   severity = "warn"이면 죽어 있어도 🟡 주의로만 본다.
# period_min을 안 적은 gh_workflow는 최근 실행 간격의 중앙값으로 자동 계산한다.

# ---------- 헤르메스 크론(신PC). "ok"는 AI 실행 종료일 뿐이라 결과물 확인(stuck_glob)을 함께 건다 ----------
[[job]]
id = "hermes:solar-bible-tasks-poller"
kind = "hermes_cron"
name = "solar-bible-tasks-poller"
period_min = 15  # 2026-09-22 탐: pending_detector가 1분마다 신호를 깨우므로 이 주기는 예비용. no-agent 스크립트(pending_poller_short.py)로 전환, 빈 실행은 0토큰
stuck_glob = 'C:\work\solar-bible\tasks\pending\*.md'
stuck_min = 12

[[job]]
id = "hermes:solar-bible-long-poller"
kind = "hermes_cron"
name = "solar-bible-long-poller"
period_min = 15  # 2026-09-22 탐: 위와 동일, no-agent 스크립트(pending_poller_long.py)로 전환

[[job]]
id = "hermes:pending-detector"
kind = "hermes_cron"
name = "pending-detector"
period_min = 1

[[job]]
id = "hermes:relay-watcher"
kind = "hermes_cron"
name = "relay-watcher"
period_min = 10

[[job]]
id = "hermes:mailbox-courier"
kind = "hermes_cron"
name = "mailbox-courier"
period_min = 10

