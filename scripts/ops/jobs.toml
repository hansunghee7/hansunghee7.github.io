# ---------- PC 보안(하루 1회, 1회 실패에 알림) ----------
[[job]]
id = "pc:disk"
kind = "pc"
check = "disk_free"
min_pct = 15
name = "C 드라이브 여유"

[[job]]
id = "pc:defender"
kind = "pc"
check = "defender"
name = "디펜더 실시간 보호"

[[job]]
id = "pc:firewall"
kind = "pc"
check = "firewall"
name = "방화벽"

[[job]]
id = "pc:ports"
kind = "pc"
check = "ports"
name = "외부에 열린 포트 변화"
[[job]]
id = "watcher:goosolar"
kind = "cmd"
cmd = ["python", 'C:\work\_ops\remote_file_age.py', "goosolar", "~/ops/STATUS.md", "90"]
every_min = 30
name = "구PC 감시(감시의 감시: 상태판이 90분 안에 갱신되는가)"
note = "구PC가 꺼졌거나 감시가 멈추면 이 항목이 붉어짐. 신PC가 꺼져 있을 땐 못 알림"

[[job]]
id = "cron:weekly-local"
kind = "file_age"
path = 'C:\work\_ops\weekly\last-run.txt'
max_age_min = 11520
name = "주간 로컬 LLM 가공 2건(작업 스케줄러 simplifier-weekly-local, 월 09:00)"
note = "2026-09-21 등록(백로그 44). 아카이브 후보와 변경 요약 초안을 만들고 둘 다 성공하면 last-run.txt 갱신. 8일 넘게 안 갱신되면 멈춤. 결과는 초안(판정 금지). 2026-09-29 탐: 9/28 월요일 실행이 0x8007001A로 실패해 8일 멈춘 뒤(원인 미확정, 스케줄러 이력 로그가 꺼져 있었음) 실행기를 실경로 pythonw.exe(창 없음)로 바꾸고 자식 subprocess에 CREATE_NO_WINDOW 적용, 이력 로그 켬(사장님). 수동 1회 실행 종료 코드 0·last-run 갱신 확인. 다음 확인: 10/5 월요일 09:00 실행"

