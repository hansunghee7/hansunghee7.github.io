# 주기 작업·서비스·PC 상태 대장 (watch.py가 읽는다). 새 주기 작업을 만들면 여기에 한 항목을 추가한다.
# 등록 = 지금 1회 실행해 성공 증거를 확인한 뒤 이 대장에 적는 것까지(DONE=VERIFIED, 사장님 지시 2026-09-20).
# kind: hermes_cron | gh_workflow | tcp | http | cmd | file_age | git_file_lines | git_file_age | pc.  every_min: 점검 주기(분). 기본 30, gh_workflow·cmd 360, pc 1440. fail_after: 연속 실패 몇 번째에 알릴지(기본 2, gh_workflow·pc·cmd는 1).   severity = "warn"이면 죽어 있어도 🟡 주의로만 본다.
# period_min을 안 적은 gh_workflow는 최근 실행 간격의 중앙값으로 자동 계산한다.

# ---------- 헤르메스 크론(신PC). "ok"는 AI 실행 종료일 뿐이라 결과물 확인(stuck_glob)을 함께 건다 ----------
[[job]]
id = "hermes:solar-bible-tasks-poller"
kind = "hermes_cron"
name = "solar-bible-tasks-poller"
period_min = 3
stuck_glob = 'C:\work\solar-bible\tasks\pending\*.md'
stuck_min = 12

[[job]]
id = "hermes:solar-bible-long-poller"
kind = "hermes_cron"
name = "solar-bible-long-poller"
period_min = 3

[[job]]
id = "hermes:pending-detector"
kind = "hermes_cron"
name = "pending-detector"
period_min = 1

[[job]]
id = "hermes:relay-watcher"
kind = "hermes_cron"
name = "relay-watcher"
period_min = 10

[[job]]
id = "hermes:mailbox-courier"
kind = "hermes_cron"
name = "mailbox-courier"
period_min = 10

[[job]]
id = "hermes:health-check"
kind = "hermes_cron"
name = "health-check"
period_min = 30

[[job]]
id = "hermes:daily_briefing"
kind = "hermes_cron"
name = "daily_briefing"
period_min = 1440

[[job]]
id = "hermes:stagnation"
kind = "hermes_cron"
name = "prompt: Stagnation detector"
period_min = 1440

[[job]]
id = "hermes:model-roster-review"
kind = "hermes_cron"
name = "model-roster-review"
period_min = 10080
note = "첫 실행 전. 요일이 지시서(일 04:00)와 다르게 등록됨(토 19:00), 사장님 확정 대기"

# ---------- 보조 시계(작업 스케줄러, 15분): GitHub가 예약 실행을 누락할 때 예약 발행을 대신 실행 ----------
[[job]]
id = "svc:gemini-pool"
kind = "tcp"
port = 4000
name = "제미나이 풀(localhost:4000)"
severity = "warn"
note = "꺼져 있음. 검증은 verify_claims.py 직접 호출로 대체 중"

[[job]]
id = "svc:ollama"
kind = "tcp"
port = 11434
name = "올라마(로컬 모델)"

[[job]]
id = "fn:gemini-api"
kind = "cmd"
cmd = ["python", 'C:\\work\\_ops\\gemini_ping.py']
name = "제미나이 API(검증 키 살아 있음, 한도 소모 없음)"

# ---------- PC 보안(하루 1회, 1회 실패에 알림) ----------
[[job]]
id = "pc:disk"
kind = "pc"
check = "disk_free"
min_pct = 15
name = "C 드라이브 여유"

[[job]]
id = "pc:defender"
kind = "pc"
check = "defender"
name = "디펜더 실시간 보호"

[[job]]
id = "pc:firewall"
kind = "pc"
check = "firewall"
name = "방화벽"

[[job]]
id = "pc:ports"
kind = "pc"
check = "ports"
name = "외부에 열린 포트 변화"
[[job]]
id = "watcher:goosolar"
kind = "cmd"
cmd = ["python", 'C:\work\_ops\remote_file_age.py', "goosolar", "~/ops/STATUS.md", "90"]
every_min = 30
name = "구PC 감시(감시의 감시: 상태판이 90분 안에 갱신되는가)"
note = "구PC가 꺼졌거나 감시가 멈추면 이 항목이 붉어짐. 신PC가 꺼져 있을 땐 못 알림"

[[job]]
id = "cron:weekly-local"
kind = "file_age"
path = 'C:\work\_ops\weekly\last-run.txt'
max_age_min = 11520
name = "주간 로컬 LLM 가공 2건(작업 스케줄러 simplifier-weekly-local, 월 09:00)"
note = "2026-09-21 등록(백로그 44). 아카이브 후보와 변경 요약 초안을 만들고 둘 다 성공하면 last-run.txt 갱신. 8일 넘게 안 갱신되면 멈춤. 결과는 초안(판정 금지)"
