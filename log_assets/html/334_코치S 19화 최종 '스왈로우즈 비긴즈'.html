pan></span></p><p class="wrap_item item_type_text"><span><span>긴 여정을 함께했던 </span><a class="link" href="https://www.linkedin.com/in/arakoh/" target="_blank"><span>Ara Koh</span></a><span> 대표님에게 정말 수고 많았다고 전하고 싶습니다.</span></span></p><p class="wrap_item item_type_text"><span><br/></span></p><p class="wrap_item item_type_text"><span><span>코치S는 액셀러레이터 스왈로우즈가 되어, 더 많은 스타트업과 함께 세상의 혁신을 가속하도록 하겠습니다. </span></span></p><p class="wrap_item item_type_text"><span><br/></span></p><p class="wrap_item item_type_text"><span><a class="link" href="https://swallows.ac/" target="_blank"><span>https://swallows.ac/</span></a></span></p><!--astro:end--></astro-island> </div>
