<script>
    document.addEventListener("DOMContentLoaded", function() {
        const articleBody = document.getElementById('articleBody');
        if (articleBody) {
            const coverImg = articleBody.querySelector('img[alt="대표 이미지"]');
            if (coverImg) coverImg.classList.add('hidden-element');

            const titleEl = document.getElementById('displayTitle');
            if (titleEl && !document.getElementById('coverWrap').classList.contains('index-mode')) {
                titleEl.innerText = titleEl.innerText.replace(/^[\d#\._\s]+/, '');
            }

            const h1s = articleBody.querySelectorAll('h1');
            if(h1s.length > 0) h1s[0].classList.add('hidden-element');

            const ps = articleBody.querySelectorAll('p');
            ps.forEach(p => {
                if(p.textContent.includes('📂')) p.classList.add('hidden-element');
            });
        }

        // 🎯 스마트 웹툰 뷰어 감지 스위치
        const isSwipeMeta = document.getElementById('isSwipeData');
        const isSwipeVal = isSwipeMeta ? isSwipeMeta.getAttribute('data-is-swipe') : '';
        const categoryPill = document.querySelector('.cover-category-pill');
        const categoryText = categoryPill ? categoryPill.innerText : '';

        // 카테고리가 '코치S'이거나 URL에 '코치S'가 들어가면 자동 발동!
        const isSwipeMode = (
            isSwipeVal === 'true' || 
            isSwipeVal === 'True' || 
            categoryText.includes('코치S') || 
            decodeURIComponent(window.location.href).includes('코치S') ||
            document.querySelector('.swipe-viewer')
        );

        if (isSwipeMode && articleBody) {
            // 웹툰 전용 다크 모드 적용
            document.body.classList.add('is-swipe-mode');

            let targetBox = document.querySelector('.swipe-viewer') || articleBody;
            
            if (targetBox && !targetBox.classList.contains('swipe-box')) {
                const outer = document.createElement('div');
                outer.className = 'swipe-outer-wrap';

                const pBtn = document.createElement('button');
                pBtn.className = 'swipe-btn prev';
                pBtn.innerHTML = '❮';
                pBtn.setAttribute('aria-label', '이전 컷');

                const nBtn = document.createElement('button');
                nBtn.className = 'swipe-btn next';
                nBtn.innerHTML = '❯';
                nBtn.setAttribute('aria-label', '다음 컷');

                // 컷 인디케이터 (페이지 번호)
                const indicator = document.createElement('div');
                indicator.className = 'swipe-indicator';

                // 요소 배치
                targetBox.classList.add('swipe-box');
                targetBox.parentNode.insertBefore(outer, targetBox);
                outer.appendChild(pBtn);
                outer.appendChild(targetBox);
                outer.appendChild(nBtn);
                outer.appendChild(indicator);

                // 슬라이드 요소 계산 (hidden 요소 제외)
                const slides = Array.from(targetBox.children).filter(el => !el.classList.contains('hidden-element'));
                const totalCount = slides.length;

                function updateIndicator() {
                    if (totalCount === 0) return;
                    const scrollLeft = targetBox.scrollLeft;
                    const slideWidth = targetBox.clientWidth;
                    const currentIndex = Math.round(scrollLeft / slideWidth) + 1;
                    indicator.innerHTML = `<span class="current">${Math.min(currentIndex, totalCount)}</span> / ${totalCount}`;
                }

                targetBox.addEventListener('scroll', updateIndicator);
                updateIndicator();

                // 좌우 버튼 클릭 및 키보드 이벤트
                pBtn.addEventListener('click', function() { 
                    targetBox.scrollBy({ left: -targetBox.clientWidth, behavior: 'smooth' }); 
                });
                nBtn.addEventListener('click', function() { 
                    targetBox.scrollBy({ left: targetBox.clientWidth, behavior: 'smooth' }); 
                });
                
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'ArrowLeft') targetBox.scrollBy({ left: -targetBox.clientWidth, behavior: 'smooth' });
                    if (e.key === 'ArrowRight') targetBox.scrollBy({ left: targetBox.clientWidth, behavior: 'smooth' });
                });
            }
        }
    });
</script>
