<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500&family=Noto+Serif+KR:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff; color: #333;
            word-break: keep-all;
        }

        /* --- 상단 커버 --- */
        .cover-wrap {
            position: relative; width: 100%; height: 100vh;
            background-color: #333; background-size: cover; background-position: center;
            color: #fff; display: flex; flex-direction: column;
        }
        .cover-header {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 40px; z-index: 10;
        }
        .cover-logo img { height: 28px; vertical-align: middle; transition: opacity 0.2s; }
        .cover-logo:hover img { opacity: 0.7; }
        
        .cover-category-pill {
            border: 1px solid rgba(255,255,255,0.4); border-radius: 20px;
            padding: 5px 16px; font-size: 12px; font-weight: 300; letter-spacing: -0.5px;
        }
        .cover-bottom-left {
            position: absolute; bottom: 40px; left: 40px; text-align: left; padding-right: 80px;
        }
        .cover-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 42px; font-weight: 200; margin: 0; line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .cover-author {
            font-size: 13px; font-weight: 300; opacity: 0.8;
            font-style: italic; margin-top: 20px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }
        .cover-bottom-right { position: absolute; bottom: 40px; right: 40px; }
        .down-arrow { display: inline-block; font-size: 26px; color: #fff; text-decoration: none; transition: transform 0.3s ease; opacity: 0.8; }
        .down-arrow:hover { transform: translateY(-8px); opacity: 1; }

        /* --- 본문 컨테이너 --- */
        .article-body { max-width: 1100px; margin: 0 auto; padding: 60px 20px 120px; }
        .article-body p { font-size: 16px; font-weight: 300; line-height: 2.1; margin-bottom: 35px; }
        .article-body img { max-width: 100%; height: auto; margin: 60px 0; display: block; }
        .article-body hr { border: 0; border-top: 1px solid #eaeaea; margin: 80px 0; }

        /* --- 🎨 3:2 카드 뷰 스타일 --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .card-item {
            display: none;
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            flex-direction: column;
        }
        .card-item.visible { display: flex; }
        .card-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }
        
        /* 🖼️ 3:2 비율 가로형 이미지 영역 */
        .card-thumb {
            width: 100%;
            aspect-ratio: 3 / 2; /* 3:2 비율 고정 */
            background-color: #f7f7f7;
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .card-category {
            font-size: 12px;
            color: #00c73c;
            font-weight: 400;
            margin-bottom: 8px;
        }
        .card-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 16px;
            font-weight: 400;
            color: #222;
            line-height: 1.4;
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 📅 등록일 스타일 */
        .card-date {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: auto;
            font-weight: 300;
        }

        /* --- 🔘 필터 및 더보기 버튼 --- */
        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 40px;
        }
        .cat-btn {
            padding: 7px 18px;
            border: 1px solid #e1e1e1;
            border-radius: 20px;
            background: #fff;
            color: #666;
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .cat-btn:hover { border-color: #00c73c; color: #00c73c; }
        .cat-btn.active { background: #00c73c; color: #fff; border-color: #00c73c; font-weight: 400; }

        .load-more-wrap { text-align: center; margin-top: 60px; }
        .load-more-btn {
            padding: 12px 45px;
            border: 1px solid #ddd;
            border-radius: 30px;
            background: #fff;
            color: #444;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .load-more-btn:hover { background: #f9f9f9; border-color: #00c73c; color: #00c73c; }

        .hidden-element { display: none !important; }
    </style>
</head>
<body>
    
    <div class="cover-wrap" id="coverWrap">
        <div class="cover-header">
            <a href="/" class="cover-logo">
                <img src="/brunch_web_assets/images/logo_white.png" alt="Simplifier Logo">
            </a>
            <div class="cover-category-pill">{{ page.category }}</div>
            <div></div>
        </div>
        
        <div class="cover-bottom-left">
            <h1 class="cover-title" id="displayTitle">{{ page.title }}</h1>
            <div class="cover-author">by Simplifier 한성희</div>
        </div>
        
        <div class="cover-bottom-right">
            <a href="#articleBody" class="down-arrow">↓</a>
        </div>
    </div>

    <div class="article-body" id="articleBody">
        {{ content }}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articleBody = document.getElementById('articleBody');
            const coverImg = articleBody.querySelector('img[alt="대표 이미지"]');
            const coverWrap = document.getElementById('coverWrap');
            if (coverImg) {
                coverWrap.style.backgroundImage = 'linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%), url(' + coverImg.src + ')';
                coverImg.classList.add('hidden-element');
            }

            const titleEl = document.getElementById('displayTitle');
            if (titleEl) {
                titleEl.innerText = titleEl.innerText.replace(/^[\d#\._\s]+/, '');
            }

            const h1s = articleBody.querySelectorAll('h1');
            if(h1s.length > 0) h1s[0].classList.add('hidden-element');

            const ps = articleBody.querySelectorAll('p');
            ps.forEach(p => {
                if(p.textContent.includes('📂')) {
                    p.classList.add('hidden-element');
                }
            });
        });
    </script>
</body>
</html>
