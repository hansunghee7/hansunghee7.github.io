<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* 부드러운 스크롤 애니메이션 적용 */
        html { scroll-behavior: smooth; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff; color: #333;
            word-break: keep-all;
        }

        /* --- 커버 영역 --- */
        .cover-wrap {
            position: relative;
            width: 100%; height: 100vh;
            background-color: #333;
            background-size: cover; background-position: center;
            color: #fff;
            display: flex; flex-direction: column;
        }

        /* 1. 로고 영역 (클릭 시 메인으로 이동) */
        .cover-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 40px;
            z-index: 10;
        }
        .cover-logo img {
            height: 28px; /* 로고 크기 설정 */
            vertical-align: middle;
            transition: opacity 0.2s;
        }
        .cover-logo:hover img { opacity: 0.7; }
        
        .cover-category-pill {
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            padding: 5px 16px;
            font-size: 12px; font-weight: 300; letter-spacing: -0.5px;
        }

        /* 2. 좌측 하단 정렬 (제목 & 작성자) */
        .cover-bottom-left {
            position: absolute;
            bottom: 40px; left: 40px;
            text-align: left;
            padding-right: 80px; /* 화살표와 겹치지 않게 여백 */
        }
        .cover-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 42px; font-weight: 300;
            margin: 0; line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .cover-author {
            font-size: 13px; font-weight: 300; opacity: 0.8;
            font-style: italic; margin-top: 20px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        /* 3. 우측 하단 (스크롤 화살표) */
        .cover-bottom-right {
            position: absolute;
            bottom: 40px; right: 40px;
        }
        .down-arrow {
            display: inline-block;
            font-size: 26px; color: #fff; text-decoration: none;
            transition: transform 0.3s ease; opacity: 0.8;
        }
        /* 무한 애니메이션은 빼고, 마우스 올릴 때만 살짝 위로 튕기기 */
        .down-arrow:hover {
            transform: translateY(-8px);
            opacity: 1;
        }

        /* --- 본문 영역 --- */
        .article-body {
            max-width: 700px;
            margin: 0 auto;
            padding: 80px 20px 120px;
        }
        .article-body p { font-size: 16px; font-weight: 300; line-height: 2.1; margin-bottom: 35px; }
        .article-body img { max-width: 100%; height: auto; margin: 60px 0; display: block; }
        .article-body hr { border: 0; border-top: 1px solid #eaeaea; margin: 80px 0; }
        
        .hidden-element { display: none !important; }
    </style>
</head>
<body>
    
    <div class="cover-wrap" id="coverWrap">
        <div class="cover-header">
            <!-- 햄버거 메뉴 지우고 Simplifier 로고로 교체! -->
            <a href="/" class="cover-logo">
                <img src="/brunch_web_assets/images/logo_white.png" alt="Simplifier Logo">
            </a>
            <div class="cover-category-pill">{{ page.category }}</div>
            <div></div> <!-- 우측 간격 맞춤용 빈 공간 -->
        </div>
        
        <div class="cover-bottom-left">
            <!-- 제목 앞 숫자 제거를 위해 id 부여 -->
            <h1 class="cover-title" id="displayTitle">{{ page.title }}</h1>
            <!-- 부제 삭제 완료, 제목과 줄 맞춰서 by 텍스트 노출 -->
            <div class="cover-author">by Simplifier 한성희</div>
        </div>
        
        <div class="cover-bottom-right">
            <!-- 클릭하면 아래 본문 앵커(#articleBody)로 부드럽게 이동 -->
            <a href="#articleBody" class="down-arrow">↓</a>
        </div>
    </div>

    <!-- 스크롤 타겟용 id 부여 -->
    <div class="article-body" id="articleBody">
        {{ content }}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articleBody = document.getElementById('articleBody');
            const coverImg = articleBody.querySelector('img[alt="대표 이미지"]');
            const coverWrap = document.getElementById('coverWrap');
            if (coverImg) {
                coverWrap.style.backgroundImage = 'linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%), url(' + coverImg.src + ')';
                coverImg.classList.add('hidden-element');
            }

            // [마법의 코드] 제목 앞의 순번(예: 006_), 특수기호를 깔끔하게 지워줍니다.
            const titleEl = document.getElementById('displayTitle');
            if (titleEl) {
                titleEl.innerText = titleEl.innerText.replace(/^[\d#\._\s]+/, '');
            }

            const h1s = articleBody.querySelectorAll('h1');
            if(h1s.length > 0) h1s[0].classList.add('hidden-element');

            const ps = articleBody.querySelectorAll('p');
            ps.forEach(p => {
                if(p.textContent.includes('📂')) {
                    p.classList.add('hidden-element');
                }
            });
        });
    </script>
</body>
</html>
