<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500&family=Noto+Serif+KR:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff; color: #333;
            word-break: keep-all;
        }

        /* --- ✂️ 슬림해진 상단 커버 (높이를 1/4 수준인 25vh로 축소) --- */
        .cover-wrap {
            position: relative; 
            width: 100%; 
            height: 25vh; /* 기존 100vh에서 1/4 크기로 대폭 감소 */
            min-height: 180px; /* 최소 높이 보장 */
            background-color: #333; 
            background-size: cover; 
            background-position: center;
            color: #fff; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 25px 40px;
        }

        .cover-header {
            display: flex; 
            align-items: center;
            z-index: 10;
        }
        .cover-logo img { height: 26px; vertical-align: middle; transition: opacity 0.2s; }
        .cover-logo:hover img { opacity: 0.7; }
        
        .cover-bottom-left {
            text-align: left;
        }
        .cover-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 32px; /* 헤더 크기에 맞게 미세 조정 */
            font-weight: 200; 
            margin: 0; 
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .cover-author {
            font-size: 12px; 
            font-weight: 300; 
            opacity: 0.8;
            font-style: italic; 
            margin-top: 8px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        /* --- 본문 컨테이너 --- */
        .article-body { max-width: 1100px; margin: 0 auto; padding: 40px 20px 120px; }
        .article-body p { font-size: 16px; font-weight: 300; line-height: 2.1; margin-bottom: 35px; }
        .article-body img { max-width: 100%; height: auto; margin: 60px 0; display: block; }
        .article-body hr { border: 0; border-top: 1px solid #eaeaea; margin: 80px 0; }

        /* --- 🎨 3:2 카드 뷰 스타일 --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .card-item {
            display: none;
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            flex-direction: column;
        }
        
        .card-thumb {
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: #f7f7f7;
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .card-category {
            font-size: 12px;
            color: #00c73c;
            font-weight: 400;
            margin-bottom: 8px;
        }
        .card-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 16px;
            font-weight: 400;
            color: #222;
            line-height: 1.4;
            margin: 0 0 15px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-date {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: auto;
            font-weight: 300;
        }

        /* --- 🔘 필터 버튼 --- */
        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 40px;
        }
        .cat-btn {
            padding: 7px 18px;
            border: 1px solid #e1e1e1;
            border-radius: 20px;
            background: #fff;
            color: #666;
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .cat-btn:hover { border-color: #00c73c; color: #00c73c; }
        .cat-btn.active { background: #00c73c; color: #fff; border-color: #00c73c; font-weight: 400; }

        .hidden-element { display: none !important; }
    </style>
</head>
<body>
    
    <div class="cover-wrap" id="coverWrap">
        <!-- 상단 헤더: 중앙 Simplifier 알약 태그 지움 -->
        <div class="cover-header">
            <a href="/" class="cover-logo">
                <img src="/brunch_web_assets/images/logo_white.png" alt="Simplifier Logo">
            </a>
        </div>
        
        <!-- 하단 제목 영역 -->
        <div class="cover-bottom-left">
            <h1 class="cover-title" id="displayTitle">{{ page.title }}</h1>
            <div class="cover-author">by Simplifier 한성희</div>
        </div>
        <!-- 화살표 요소 완전 삭제 -->
    </div>

    <div class="article-body" id="articleBody">
        {{ content }}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articleBody = document.getElementById('articleBody');
            const coverImg = articleBody.querySelector('img[alt="대표 이미지"]');
            const coverWrap = document.getElementById('coverWrap');
            if (coverImg) {
                coverWrap.style.backgroundImage = 'linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%), url(' + coverImg.src + ')';
                coverImg.classList.add('hidden-element');
            }

            const titleEl = document.getElementById('displayTitle');
            if (titleEl) {
                titleEl.innerText = titleEl.innerText.replace(/^[\d#\._\s]+/, '');
            }

            const h1s = articleBody.querySelectorAll('h1');
            if(h1s.length > 0) h1s[0].classList.add('hidden-element');

            const ps = articleBody.querySelectorAll('p');
            ps.forEach(p => {
                if(p.textContent.includes('📂')) {
                    p.classList.add('hidden-element');
                }
            });
        });
    </script>
</body>
</html>
