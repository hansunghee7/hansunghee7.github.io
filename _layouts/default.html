<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <!-- 더 얇은 폰트(200 굵기)를 추가로 불러옵니다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400&family=Noto+Serif+KR:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0; padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff; color: #333;
            word-break: keep-all;
        }

        .cover-wrap {
            position: relative; width: 100%; height: 100vh;
            background-color: #333; background-size: cover; background-position: center;
            color: #fff; display: flex; flex-direction: column;
        }

        .cover-header {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 40px; z-index: 10;
        }
        .cover-logo img { height: 28px; vertical-align: middle; transition: opacity 0.2s; }
        .cover-logo:hover img { opacity: 0.7; }
        
        .cover-category-pill {
            border: 1px solid rgba(255,255,255,0.4); border-radius: 20px;
            padding: 5px 16px; font-size: 12px; font-weight: 300; letter-spacing: -0.5px;
        }

        .cover-bottom-left {
            position: absolute; bottom: 40px; left: 40px; text-align: left; padding-right: 80px;
        }
        
        /* 제목 폰트를 훨씬 더 얇게(200) 변경했습니다! */
        .cover-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 42px; 
            font-weight: 200; 
            margin: 0; line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .cover-author {
            font-size: 13px; font-weight: 300; opacity: 0.8;
            font-style: italic; margin-top: 20px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .cover-bottom-right { position: absolute; bottom: 40px; right: 40px; }
        .down-arrow { display: inline-block; font-size: 26px; color: #fff; text-decoration: none; transition: transform 0.3s ease; opacity: 0.8; }
        .down-arrow:hover { transform: translateY(-8px); opacity: 1; }

        .article-body { max-width: 700px; margin: 0 auto; padding: 80px 20px 120px; }
        .article-body p { font-size: 16px; font-weight: 300; line-height: 2.1; margin-bottom: 35px; }
        .article-body img { max-width: 100%; height: auto; margin: 60px 0; display: block; }
        .article-body hr { border: 0; border-top: 1px solid #eaeaea; margin: 80px 0; }
        
        /* 메인 화면 전체 글 목록 전용 디자인 추가 */
        .article-body ul { list-style: none; padding-left: 0; }
        .article-body li { margin-bottom: 30px; }
        .article-body li a { text-decoration: none; color: #333; font-size: 18px; font-weight: 400; transition: color 0.2s; }
        .article-body li a:hover { color: #00c73c; } /* 마우스 올리면 브런치 민트색으로! */
        
        .list-category {
            display: block;
            font-size: 12px;
            color: #00c73c;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .hidden-element { display: none !important; }
    </style>
</head>
<body>
    
    <div class="cover-wrap" id="coverWrap">
        <div class="cover-header">
            <a href="/" class="cover-logo">
                <img src="/brunch_web_assets/images/logo_white.png" alt="Simplifier Logo">
            </a>
            <div class="cover-category-pill">{{ page.category }}</div>
            <div></div>
        </div>
        
        <div class="cover-bottom-left">
            <h1 class="cover-title" id="displayTitle">{{ page.title }}</h1>
            <div class="cover-author">by Simplifier 한성희</div>
        </div>
        
        <div class="cover-bottom-right">
            <a href="#articleBody" class="down-arrow">↓</a>
        </div>
    </div>

    <div class="article-body" id="articleBody">
        {{ content }}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articleBody = document.getElementById('articleBody');
            const coverImg = articleBody.querySelector('img[alt="대표 이미지"]');
            const coverWrap = document.getElementById('coverWrap');
            if (coverImg) {
                coverWrap.style.backgroundImage = 'linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%), url(' + coverImg.src + ')';
                coverImg.classList.add('hidden-element');
            }

            const titleEl = document.getElementById('displayTitle');
            if (titleEl) {
                titleEl.innerText = titleEl.innerText.replace(/^[\d#\._\s]+/, '');
            }

            const h1s = articleBody.querySelectorAll('h1');
            if(h1s.length > 0) h1s[0].classList.add('hidden-element');

            const ps = articleBody.querySelectorAll('p');
            ps.forEach(p => {
                if(p.textContent.includes('📂')) {
                    p.classList.add('hidden-element');
                }
            });
        });
    </script>
</body>
</html>
