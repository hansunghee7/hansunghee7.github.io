# 심플리파이어 글쓰기 화면 (Sveltia CMS) — 이게 실제로 쓰는 화면입니다.
# 예전에 쓰던 Decap CMS는 /admin-legacy/ 에 그대로 남겨뒀습니다.
# 혹시 이 화면에 문제가 생기면 그리로 가면 평소처럼 글을 쓸 수 있습니다.

backend:
  name: github
  repo: hansunghee7/hansunghee7.github.io
  branch: main
  # Cloudflare 로그인 서버. /admin-legacy/(Decap)와 같은 것을 함께 씁니다.
  # (Sveltia 공식 문서: Decap/Netlify용 OAuth 클라이언트는 수정 없이 그대로 동작)
  base_url: https://simplifier-cms-auth.simon-8be.workers.dev

publish_mode: simple
media_folder: "log_assets/images"
public_folder: "/log_assets/images"

collections:
  - name: "posts"
    label: "Log 글"
    label_singular: "글"
    folder: "log_assets/markdown"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{date_string}}"
    # Sveltia는 이 옵션 문법이 Decap과 다릅니다(Decap의
    # `[{field, default_sort}, ...]` 배열이 아니라 fields/default 구조).
    # Decap 문법 그대로 넣었더니 통째로 무시되면서 "발행일" 정렬 옵션 자체가
    # 사라지고 커밋 기준 정렬만 남았던 게 실제 원인이었습니다.
    sortable_fields:
      fields: [title, date]
      default:
        field: date
        direction: descending
    format: "yaml-frontmatter"
    fields:
      - { name: "layout", label: "레이아웃", widget: "hidden", default: "default" }

      - name: "title"
        label: "제목"
        widget: "string"
        hint: "홈페이지 카드/탭 제목에 그대로 노출됩니다."

      - name: "body"
        label: "본문"
        widget: "markdown"

      - name: "category"
        label: "카테고리"
        widget: "select"
        options:
          - "AI의 언어들"
          - "Be the PO"
          - "PO의 프레임웍"
          - "UX의 언어들"
          - "기획일상"
          - "기획자의 프레임웍"
          - "대한민국 스타트업 미국진출을 묻다"
          - "스타트업 인사이트"
          - "심플리파이어 라이프"
          - "이력서에 쓰지 않는 첫직장 이야기"
          - "잉크드인대 기획학과"
          - "코치S"
          - "토크세션"

      - name: "image"
        label: "커버 이미지"
        widget: "image"
        hint: "글 상단 배경과 로그 카드 썸네일에 같이 쓰입니다."

      - name: "date"
        label: "발행일"
        widget: "datetime"
        # Sveltia에서는 time_format: false가 "type: date"와 완전히 같은 뜻이라
        # 시/분 선택 자체가 화면에서 사라졌습니다(문서에 명시됨). type을 직접
        # datetime-local로 지정해서 날짜+시간을 다 받게 하고, 저장 형식은
        # 공식 권장대로 커스텀 포맷 없이 ISO 8601 그대로 둡니다(파이프라인은
        # 앞 10글자 YYYY-MM-DD만 읽어서 date_string을 만들기 때문에 시간이
        # 붙어도 문제없습니다).
        type: "datetime-local"
        # 항상 한국시간으로 입력/표시합니다. 예전 picker_utc: true는 UTC로
        # 보여줘서 "지금"을 눌러도 9시간 어긋나 보였습니다(값 자체는 맞았지만
        # 사람이 헷갈림). 브라우저 로컬(local)이 아니라 Asia/Seoul로 고정한
        # 이유: 해외 출장 중에 글을 써도 발행일이 한국 기준으로 일관되게 남습니다.
        input_timezone: "Asia/Seoul"

      - name: "date_string"
        label: "발행일 표시 텍스트"
        widget: "hidden"
        required: false
        hint: "자동으로 채워집니다 (예: Aug 25. 2026). 직접 안 써도 됩니다."

      # AIO 복사 버튼. Sveltia도 registerWidget을 (registerFieldType의 별칭으로)
      # 그대로 지원하고, 게다가 control에 entry(글 전체 데이터)를 넘겨주기 때문에
      # Decap판보다 오히려 단순하고 안정적으로 구현했습니다. index.html 참고.
      - name: "keywords"
        label: "AIO 키워드"
        widget: "aio-copy-assist"
        required: false
        hint: "쉼표로 구분. 검색엔진/AI용, 화면에 안 보입니다. 본문 다 쓰신 뒤 아래 복사 버튼을 눌러 Claude/ChatGPT에 붙여넣고, 받은 키워드를 여기 입력하세요."

      - name: "about"
        label: "AIO 주제어"
        widget: "string"
        required: false

      - name: "published"
        label: "공개 여부"
        widget: "boolean"
        default: true
        hint: "꺼두면 초안 상태로 저장되고 홈페이지 어디에도 노출되지 않습니다."

      - name: "channel_variants"
        label: "채널별 발행 텍스트 (선택)"
        widget: "object"
        collapsed: false
        required: false
        hint: "비워두면 그 채널엔 이 글을 안 보냅니다."
        fields:
          - name: "linkedin_threads"
            label: "LinkedIn / Threads용 요약"
            widget: "text"
            required: false

          - name: "instagram_caption"
            label: "Instagram 캡션"
            widget: "text"
            required: false

          - name: "manual_copy_block"
            label: "수동 발행 채널용 복사 텍스트"
            widget: "text"
            required: false

  - name: "pillars"
    label: "카테고리 소개(필러)"
    # _data/pillars/카테고리.yml 파일 하나씩(폴더 콜렉션)으로 처음 만들었다가,
    # GitHub Pages의 실제 Jekyll 빌드에서 site.data.pillars["카테고리명"] 같은
    # 파일명 기반 해시 키 조회가 계속 nil을 반환하는 문제를 겪었다(로컬에서
    # 바이트 단위로 다 맞는데도 재현됨 -- 원인 특정 못함). 그래서 posts.json과
    # 똑같이 이미 검증된 방식(배열 + where 필터)으로 바꿨다: 파일 하나
    # (_data/pillars.yml)에 배열로 다 넣고 category 값으로 찾는다.
    files:
      - name: "pillars"
        label: "카테고리 소개 목록"
        file: "_data/pillars.yml"
        fields:
          - name: "pillars"
            label: "카테고리별 소개"
            widget: "list"
            summary: "{{fields.category}}"
            hint: "카테고리 하나를 소개하는 전용 페이지(필러 페이지)에 들어갈 글입니다. 실제 글 목록은 자동으로 채워지고, 여기서는 소개 문단만 씁니다."
            fields:
              - name: "category"
                label: "카테고리명"
                widget: "string"
                hint: "글 front matter의 category 값과 정확히 똑같이 입력해야 매칭됩니다(예: 스타트업 인사이트)."

              - name: "status"
                label: "연재 상태"
                widget: "select"
                options: ["연재중", "완결"]
                default: "연재중"
                hint: "완결 시리즈는 필러 페이지 제목 옆에 뱃지로 표시돼, 새 글이 안 올라와도 방문자가 오해하지 않습니다."

              - name: "intro"
                label: "소개 문단 (짧게)"
                widget: "text"
                hint: "필러 페이지 맨 위에 항상 보이는 짧은 소개입니다. 2~3문장 정도로 — 길면 독자가 지루해합니다."

              - name: "intro_extended"
                label: "소개 문단 (자세히, 접혀서 노출)"
                widget: "text"
                required: false
                hint: "\"더 보기\"를 눌러야 펼쳐지는 상세 설명입니다. 화면엔 접혀 있어도 검색엔진/AI는 그대로 읽으므로, SEO/AEO를 위해 500자 이상 자세히 써도 괜찮습니다(독자 경험을 해치지 않음)."

              - name: "published"
                label: "공개 여부"
                widget: "boolean"
                default: false
                hint: "켜기 전까지는 필러 페이지가 안 만들어진 것으로 취급합니다(Simplifier Studio 필러 관리 화면 기준)."
