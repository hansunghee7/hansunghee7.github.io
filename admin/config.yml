backend:
  name: github
  repo: hansunghee7/hansunghee7.github.io
  branch: main
  # GitHub는 브라우저에서 바로 로그인 토큰을 못 주기 때문에 이 프록시가 필요합니다.
  base_url: https://simplifier-cms-auth.simon-8be.workers.dev
  auth_endpoint: /auth

# 로컬에서 `npx decap-server`를 띄우고 이 페이지를 열면(위 backend 없이도)
# 로그인 없이 바로 테스트해볼 수 있습니다. 실제 운영에서는 위 backend가 씁니다.
local_backend: true

publish_mode: simple
media_folder: "log_assets/images"
public_folder: "/log_assets/images"

collections:
  - name: "posts"
    label: "Log 글"
    label_singular: "글"
    folder: "log_assets/markdown"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    format: "yaml-frontmatter"
    # 저장하면 이 순서/모양대로 front matter가 써집니다.
    # (파일명 순번 매기기·date_string 채우기·카테고리 링크 스크립트 삽입은
    #  저장 후 CI가 자동으로 처리합니다 -- admin/README.md 참고)
    fields:
      - { name: "layout", label: "레이아웃", widget: "hidden", default: "default" }

      - name: "title"
        label: "제목"
        widget: "string"
        hint: "홈페이지 카드/탭 제목에 그대로 노출됩니다."

      - name: "body"
        label: "본문"
        widget: "markdown"

      - name: "category"
        label: "카테고리"
        widget: "select"
        options:
          - "AI의 언어들"
          - "Be the PO"
          - "PO의 프레임웍"
          - "UX의 언어들"
          - "기획일상"
          - "기획자의 프레임웍"
          - "대한민국 스타트업 미국진출을 묻다"
          - "스타트업 인사이트"
          - "심플리파이어 라이프"
          - "이력서에 쓰지 않는 첫직장 이야기"
          - "잉크드인대 기획학과"
          - "코치S"
          - "토크세션"

      - name: "cover_image"
        label: "커버 이미지"
        widget: "image"
        hint: "글 상단 배경과 로그 카드 썸네일에 같이 쓰입니다."

      - name: "date"
        label: "발행일"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - name: "date_string"
        label: "발행일 표시 텍스트"
        widget: "hidden"
        required: false
        hint: "자동으로 채워집니다 (예: Aug 25. 2026). 직접 안 써도 됩니다."

      - name: "keywords"
        label: "SEO 키워드"
        widget: "string"
        required: false
        hint: "쉼표로 구분. 검색엔진용, 화면에 안 보입니다. 본문 다 쓰신 뒤, 오른쪽 미리보기 위의 복사 버튼으로 Claude/ChatGPT에 물어봐서 붙여넣으세요."

      - name: "about"
        label: "SEO 주제어"
        widget: "string"
        required: false
        hint: "위 복사 버튼으로 함께 받은 주제어를 붙여넣으세요."

      - name: "published"
        label: "공개 여부"
        widget: "boolean"
        default: true
        hint: "꺼두면 초안 상태로 저장되고 홈페이지 어디에도 노출되지 않습니다."

      - name: "channel_variants"
        label: "채널별 발행 텍스트 (선택)"
        widget: "object"
        collapsed: true
        required: false
        hint: "비워두면 그 채널엔 이 글을 안 보냅니다."
        fields:
          - name: "linkedin_threads"
            label: "LinkedIn / Threads용 요약"
            widget: "text"
            required: false
            hint: "200~400자 권장. 저장 후 자동 발행 대상(LinkedIn, Threads, Facebook, Instagram)에 이 텍스트가 쓰입니다."

          - name: "instagram_caption"
            label: "Instagram 캡션"
            widget: "text"
            required: false
            hint: "짧게, 해시태그 포함 가능. 비워두면 위 요약을 대신 씁니다."

          - name: "manual_copy_block"
            label: "수동 발행 채널용 복사 텍스트"
            widget: "text"
            required: false
            hint: "브런치·네이버블로그·리멤버 커넥트·로켓펀치처럼 자동 발행이 안 되는 곳에 그대로 복사해서 쓰세요."
