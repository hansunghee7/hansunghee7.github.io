# 심플리파이어 글쓰기 화면 (Sveltia CMS) — 이게 실제로 쓰는 화면입니다.
# 예전에 쓰던 Decap CMS는 /admin-legacy/ 에 그대로 남겨뒀습니다.
# 혹시 이 화면에 문제가 생기면 그리로 가면 평소처럼 글을 쓸 수 있습니다.

backend:
  name: github
  repo: hansunghee7/hansunghee7.github.io
  branch: main
  # Cloudflare 로그인 서버. /admin-legacy/(Decap)와 같은 것을 함께 씁니다.
  # (Sveltia 공식 문서: Decap/Netlify용 OAuth 클라이언트는 수정 없이 그대로 동작)
  base_url: https://simplifier-cms-auth.simon-8be.workers.dev

publish_mode: simple
media_folder: "log_assets/images"
public_folder: "/log_assets/images"

collections:
  - name: "posts"
    label: "Log 글"
    label_singular: "글"
    folder: "log_assets/markdown"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{date_string}}"
    # Sveltia는 이 옵션 문법이 Decap과 다릅니다(Decap의
    # `[{field, default_sort}, ...]` 배열이 아니라 fields/default 구조).
    # Decap 문법 그대로 넣었더니 통째로 무시되면서 "발행일" 정렬 옵션 자체가
    # 사라지고 커밋 기준 정렬만 남았던 게 실제 원인이었습니다.
    sortable_fields:
      fields: [title, date]
      default:
        field: date
        direction: descending
    format: "yaml-frontmatter"
    fields:
      - { name: "layout", label: "레이아웃", widget: "hidden", default: "default" }

      - name: "title"
        label: "제목"
        widget: "string"
        hint: "홈페이지 카드/탭 제목에 그대로 노출됩니다."

      - name: "body"
        label: "본문"
        widget: "markdown"

      - name: "category"
        label: "카테고리"
        widget: "select"
        options:
          - "AI의 언어들"
          - "Be the PO"
          - "PO의 프레임웍"
          - "UX의 언어들"
          - "기획일상"
          - "기획자의 프레임웍"
          - "대한민국 스타트업 미국진출을 묻다"
          - "스타트업 인사이트"
          - "심플리파이어 라이프"
          - "이력서에 쓰지 않는 첫직장 이야기"
          - "잉크드인대 기획학과"
          - "코치S"
          - "토크세션"

      - name: "image"
        label: "커버 이미지"
        widget: "image"
        hint: "글 상단 배경과 로그 카드 썸네일에 같이 쓰입니다."

      - name: "date"
        label: "발행일"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - name: "date_string"
        label: "발행일 표시 텍스트"
        widget: "hidden"
        required: false
        hint: "자동으로 채워집니다 (예: Aug 25. 2026). 직접 안 써도 됩니다."

      # AIO 복사 버튼. Sveltia도 registerWidget을 (registerFieldType의 별칭으로)
      # 그대로 지원하고, 게다가 control에 entry(글 전체 데이터)를 넘겨주기 때문에
      # Decap판보다 오히려 단순하고 안정적으로 구현했습니다. index.html 참고.
      - name: "keywords"
        label: "AIO 키워드"
        widget: "aio-copy-assist"
        required: false
        hint: "쉼표로 구분. 검색엔진/AI용, 화면에 안 보입니다. 본문 다 쓰신 뒤 아래 복사 버튼을 눌러 Claude/ChatGPT에 붙여넣고, 받은 키워드를 여기 입력하세요."

      - name: "about"
        label: "AIO 주제어"
        widget: "string"
        required: false

      - name: "published"
        label: "공개 여부"
        widget: "boolean"
        default: true
        hint: "꺼두면 초안 상태로 저장되고 홈페이지 어디에도 노출되지 않습니다."

      - name: "channel_variants"
        label: "채널별 발행 텍스트 (선택)"
        widget: "object"
        collapsed: false
        required: false
        hint: "비워두면 그 채널엔 이 글을 안 보냅니다."
        fields:
          - name: "linkedin_threads"
            label: "LinkedIn / Threads용 요약"
            widget: "text"
            required: false

          - name: "instagram_caption"
            label: "Instagram 캡션"
            widget: "text"
            required: false

          - name: "manual_copy_block"
            label: "수동 발행 채널용 복사 텍스트"
            widget: "text"
            required: false
