<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Simplifier Log — 글쓰기</title>
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Decap CMS (구 Netlify CMS): 깃허브 저장소에 직접 커밋하는 방식의 CMS.
       별도 서버/DB 없이 이 저장소의 log_assets/markdown/*.md 파일을 브라우저에서
       쓰고 고치게 해줍니다. 로그인은 GitHub OAuth App + 프록시가 필요합니다
       (admin/README.md 참고). -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // AIO(키워드/주제어) 칸 옆에 붙는 복사 버튼. 본문을 다 쓴 뒤 누르면
    // 제목+본문을 프롬프트 형태로 클립보드에 복사해서 Claude/ChatGPT에
    // 붙여넣어 키워드를 받아올 수 있게 해준다.
    //
    // 위젯 Control은 다른 필드 값을 공식적으로 읽을 수 없어서(Decap CMS
    // 문서상 Control props에는 entry가 없음), 같은 화면(iframe이 아닌
    // 왼쪽 편집 폼)에 실제로 렌더링된 제목/본문 입력창을 라벨 텍스트로
    // 찾아 값을 읽어온다. 못 찾으면 조용히 틀린 값을 복사하는 대신
    // 실패했다고 알려준다.
    function findByLabelText(labelText) {
      var labels = document.querySelectorAll("label");
      for (var i = 0; i < labels.length; i++) {
        if (labels[i].textContent.trim().indexOf(labelText) === 0) {
          var container = labels[i].parentElement;
          for (var hops = 0; hops < 4 && container; hops++) {
            var codeMirrorEl = container.querySelector(".CodeMirror");
            if (codeMirrorEl && codeMirrorEl.CodeMirror) {
              return codeMirrorEl.CodeMirror.getValue();
            }
            var editable = container.querySelector("[contenteditable='true']");
            if (editable) return editable.innerText || "";
            var input = container.querySelector("input, textarea");
            if (input) return input.value || "";
            container = container.parentElement;
          }
        }
      }
      return null;
    }

    function copyTextToClipboard(text, onDone) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { onDone(true); },
          function () { onDone(legacyCopy(text)); }
        );
      } else {
        onDone(legacyCopy(text));
      }
    }

    function legacyCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    var AioCopyControl = createClass({
      getInitialState: function () {
        return { status: "idle" };
      },
      handleTextChange: function (e) {
        this.props.onChange(e.target.value);
      },
      handleCopy: function () {
        var title = findByLabelText("제목");
        var body = findByLabelText("본문");
        if (!body) {
          this.setState({ status: "notfound" });
          setTimeout(this.reset, 3000);
          return;
        }
        var prompt = [
          "다음은 블로그 글의 제목과 본문이야. 이 글을 분석해서 아래 두 가지를 만들어줘.",
          "1) SEO 키워드 5~8개 (쉼표로 구분된 한 줄)",
          "2) 이 글의 핵심 주제를 나타내는 5~10단어 이내의 짧은 문구",
          "",
          "제목: " + (title || ""),
          "",
          "본문:",
          body,
        ].join("\n");
        var self = this;
        copyTextToClipboard(prompt, function (ok) {
          self.setState({ status: ok ? "copied" : "failed" });
          setTimeout(self.reset, 3000);
        });
      },
      reset: function () {
        this.setState({ status: "idle" });
      },
      render: function () {
        var label =
          this.state.status === "copied"
            ? "복사 완료! Claude/ChatGPT에 붙여넣으세요"
            : this.state.status === "notfound"
            ? "본문을 찾지 못했어요 — 직접 복사해주세요"
            : this.state.status === "failed"
            ? "복사 실패 — 직접 선택해서 복사해주세요"
            : "📋 제목+본문 프롬프트 복사";
        return h(
          "div",
          {},
          h("input", {
            id: this.props.forID,
            className: this.props.classNameWrapper,
            type: "text",
            value: this.props.value || "",
            onChange: this.handleTextChange,
          }),
          h(
            "button",
            {
              type: "button",
              onClick: this.handleCopy,
              style: {
                marginTop: "6px",
                padding: "5px 10px",
                fontSize: "12px",
                cursor: "pointer",
                border: "1px solid #ccc",
                borderRadius: "4px",
                background: this.state.status === "idle" ? "#f5f5f5" : "#e6f7e6",
              },
            },
            label
          )
        );
      },
    });

    var AioCopyPreview = createClass({
      render: function () {
        return h("div", {}, this.props.value);
      },
    });

    CMS.registerWidget("aio-copy-assist", AioCopyControl, AioCopyPreview);
  </script>
</body>
</html>
