<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Simplifier SNS 인사이트</title>
<style>
  body{ width:280px; margin:0; padding:16px; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; color:#121210; }
  h1{ font-size:14px; margin:0 0 12px; }
  .status{ padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:12.5px; line-height:1.5; }
  .status.ok{ background:#eaf5ef; color:#1f7a4f; }
  .status.warn{ background:#fbf1e6; color:#a3690f; }
  #selectorWarningBox{ display:none; padding:10px 12px; border:1px solid #e3c98a; border-radius:8px; background:#fbf1e6; color:#a3690f; font-size:12px; line-height:1.5; margin-bottom:12px; }
  #selectorWarningBox button{ margin:8px 0 0; padding:6px; font-size:12px; }
  button{ width:100%; padding:9px; font-size:13px; border-radius:6px; border:1px solid #c8c6bf; background:#121210; color:#fff; cursor:pointer; margin-bottom:8px; }
  button.secondary{ background:#fff; color:#121210; }
  .hint{ color:#6e6a62; font-size:11.5px; line-height:1.5; }
  ul{ margin:8px 0; padding-left:18px; font-size:12px; color:#403d37; }

  .log-heading{ font-size:11.5px; font-weight:600; color:#403d37; margin:14px 0 6px; }
  .log-empty{ font-size:11.5px; color:#6e6a62; }
  .log-item{ display:flex; align-items:baseline; gap:6px; padding:5px 0; border-bottom:1px solid #eeece5; font-size:12px; }
  .log-item:last-child{ border-bottom:none; }
  .log-item .mark{ flex-shrink:0; }
  .log-item .mark.success{ color:#1f7a4f; }
  .log-item .mark.error{ color:#b8402a; }
  .log-item .mark.pending{ color:#a3690f; }
  .log-item .mark.miss{ color:#a3690f; }
  .log-item .plat{ font-weight:600; }
  .log-item .cnt{ color:#403d37; }
  .log-item .time{ margin-left:auto; color:#6e6a62; font-size:11px; flex-shrink:0; }
  .log-item .note{ color:#b8402a; font-size:10.5px; }
</style>
</head>
<body>
  <h1>Simplifier SNS 인사이트</h1>
  <div id="selectorWarningBox">
    <span id="selectorWarningText"></span>
    <button id="dismissWarningBtn" class="secondary">확인함</button>
  </div>
  <div class="status ok">자동 기록 작동 중 (Worker 경유, 토큰 설정 불필요)</div>
  <div id="roundStatus" class="hint" style="margin:-6px 0 12px;"></div>

  <div class="hint">
    LinkedIn / Facebook / Instagram / Threads / 네이버블로그 / 브런치 / 리멤버 / 로켓펀치
    프로필을 열면 팔로워 수를 자동으로 읽어 기록합니다. 결과는
    Simplifier Studio의 "SNS 인사이트"에서 확인하세요.
  </div>
  <div class="log-heading">최근 수집 기록</div>
  <div id="logList"><div class="log-empty">아직 기록 없음</div></div>
  <script src="popup.js"></script>
</body>
</html>
