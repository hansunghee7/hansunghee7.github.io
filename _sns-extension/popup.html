<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Simplifier SNS 인사이트</title>
<style>
  body{ width:280px; margin:0; padding:16px; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; color:#121210; }
  h1{ font-size:14px; margin:0 0 12px; }
  .status{ padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:12.5px; line-height:1.5; }
  .status.ok{ background:#eaf5ef; color:#1f7a4f; }
  .status.warn{ background:#fbf1e6; color:#a3690f; }
  button{ width:100%; padding:9px; font-size:13px; border-radius:6px; border:1px solid #c8c6bf; background:#121210; color:#fff; cursor:pointer; margin-bottom:8px; }
  button.secondary{ background:#fff; color:#121210; }
  .hint{ color:#6e6a62; font-size:11.5px; line-height:1.5; }
  ul{ margin:8px 0; padding-left:18px; font-size:12px; color:#403d37; }
</style>
</head>
<body>
  <h1>Simplifier SNS 인사이트</h1>
  <div id="statusBox" class="status warn">확인 중...</div>
  <button id="loginBtn">GitHub 연결</button>
  <button id="logoutBtn" class="secondary" style="display:none;">연결 해제</button>
  <div class="hint">
    LinkedIn / Facebook / Instagram / Threads / 네이버블로그 / 리멤버 / 로켓펀치
    프로필을 열면 팔로워 수를 자동으로 읽어 기록합니다. 결과는
    Simplifier Studio의 "SNS 인사이트"에서 확인하세요.
  </div>
  <script src="popup.js"></script>
</body>
</html>
