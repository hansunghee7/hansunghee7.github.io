name: Fetch GA4 analytics

# GA4 Data API에서 최근 30일 방문 지표를 매일 한 번 가져와서
# assets/data/analytics.json에 커밋한다. 비공개 대시보드(insight-7b3e9f2c/)가
# 이 파일을 읽어서 화면에 그린다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   GA4_SERVICE_ACCOUNT_JSON  서비스 계정 키 JSON 파일 내용 전체
#   GA4_PROPERTY_ID           GA4 속성 숫자 ID (측정ID G-XXXX와 다름)
# 두 값 모두 대화로 주고받지 말고 이 화면에 사장님이 직접 붙여넣을 것.

# GitHub의 예약 실행(cron)은 "최선 노력" 방식이라 부하가 높으면 지연이 아니라
# 아예 건너뛰기도 한다(공식 커뮤니티 확인 -- 실제로 이 저장소에서 이틀 연속
# 자동 실행이 안 됐음). 그래서 이중 안전장치: cron 하루 3번(최근 30일
# 스냅샷을 통째로 다시 쓰므로 여러 번 돌아도 안전) + 로컬 PC 작업 스케줄러의
# workflow_dispatch 직접 호출(Documents\SimplifierSNSBot\trigger-github-workflows.ps1).
on:
  schedule:
    - cron: "47 19 * * *"  # 04:47 KST (정각은 혼잡해 지연/누락되기 쉬워 분산) -- 새벽 수집 순번 2
    - cron: "17 1 * * *"   # 10:17 KST
    - cron: "29 7 * * *"   # 16:29 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-analytics-data

      - name: Fetch GA4 report
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python scripts/fetch_ga4.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/analytics.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh GA4 analytics snapshot [skip ci]"
            # 다른 워크플로(북인사이트 등)와 동시에 푸시하면 non-fast-forward로
            # 거절될 수 있어(실제 발생) rebase 후 재시도한다.
            n=0
            until git push; do
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "push 3회 실패"; exit 1; fi
              git pull --rebase origin main
            done
          fi
