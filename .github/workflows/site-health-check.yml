name: Site health check

# 라이브 사이트가 실제로 정상인지 주기적으로 확인한다. 여기서 잡으려는 사고
# 두 가지 실제 사례:
#   1) 2026-08-29 - Jekyll 빌드 실패로 홈페이지 자체가 옛날 버전에 멈춤
#   2) 2026-08-29 - 블로그 이미지 자산 정리 중 브랜드 로고(logo_white.png,
#      character_black.png)가 격리되면서 페이지는 뜨는데 로고만 깨짐.
#      "정리 후 라이브 사이트 확인 절차 부재"가 회고에서 나온 재발방지 항목.
# 그래서 홈페이지 응답 코드뿐 아니라, 페이지 안에서 실제로 쓰는 핵심 자산
# URL들도 같이 200인지 확인한다. 실패하면 이 워크플로 자체가 빨간 X가 되고
# GitHub가 기본 이메일 알림을 보낸다.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 URL (비워두면 이 입력을 쓰는 점검은 건너뜀). simplifier.co.kr 뿐 아니라 simplifier-saegim의 Cloud Run 주소 등 다른 서비스 URL도 그대로 쓸 수 있음"
        required: false
        type: string
      selector:
        description: "확인할 CSS 셀렉터 (예: .article-body li > strong:first-child). 비워두면 응답 코드만 확인. 이 세션(클로드 코드) 컨테이너는 실제 사이트 도메인에 egress가 막혀 있어, 배포 후 HTML 구조 확인은 직접 fetch하는 대신 이 워크플로로 대신한다(2026-09-14 사장님 지시)"
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 홈페이지 응답 + 핵심 문자열 확인
        run: |
          status=$(curl -s -o /tmp/home.html -w '%{http_code}' -L --max-time 15 https://simplifier.co.kr/)
          echo "홈페이지 응답 코드: $status"
          if [ "$status" != "200" ]; then
            echo "::error::홈페이지가 200이 아닙니다 ($status) -- 빌드 실패 또는 배포 중단 가능성"
            exit 1
          fi
          if ! grep -q "Simplifier" /tmp/home.html; then
            echo "::error::홈페이지 내용에 'Simplifier' 문자열이 없습니다 -- 옛날 캐시이거나 빌드가 깨졌을 수 있습니다"
            exit 1
          fi

      - name: 핵심 브랜드 자산 확인 (로고 등)
        run: |
          fail=0
          for path in \
            "/log_assets/images/logo_white.png" \
            "/log_assets/images/character_black.png" \
          ; do
            url="https://simplifier.co.kr${path}"
            status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$url")
            echo "$url -> $status"
            if [ "$status" != "200" ]; then
              echo "::error::$url 이 200이 아닙니다 ($status)"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            exit 1
          fi

  url-selector-check:
    # url 입력이 있을 때만 도는 별도 잡. 위 check 잡(10분마다 자동 실행,
    # 고정 홈페이지 점검)과는 무관 -- 수동 dispatch로 url을 넣었을 때만 돈다.
    if: github.event_name == 'workflow_dispatch' && inputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: URL 응답 확인
        env:
          CHECK_URL: ${{ inputs.url }}
        run: |
          status=$(curl -s -o /tmp/page.html -w '%{http_code}' -L --max-time 15 "$CHECK_URL")
          echo "응답 코드: $status"
          if [ "$status" != "200" ]; then
            echo "::error::$CHECK_URL 이 200이 아닙니다 ($status)"
            exit 1
          fi

      - name: 셀렉터 확인 (입력했을 때만)
        if: inputs.selector != ''
        env:
          CHECK_SELECTOR: ${{ inputs.selector }}
        run: |
          pip install --quiet beautifulsoup4
          python3 - "$CHECK_SELECTOR" <<'PYEOF'
          import sys
          from bs4 import BeautifulSoup

          selector = sys.argv[1]
          with open("/tmp/page.html", encoding="utf-8") as f:
              soup = BeautifulSoup(f.read(), "html.parser")
          matches = soup.select(selector)
          print(f"셀렉터 '{selector}' 매치 수: {len(matches)}")
          if not matches:
              print(f"::error::셀렉터 '{selector}'에 매치되는 요소가 없습니다")
              sys.exit(1)
          for m in matches[:5]:
              print(str(m)[:300])
          PYEOF
