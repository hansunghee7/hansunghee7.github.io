name: Propose questions

# 주 1회, 검색 유입 검색어·많이 읽힌 글·최근 글·리서치 주제를 바탕으로 클로드가
# "독자가 실제로 물어볼 법한 질문" 10개를 GitHub 이슈(체크박스)로 올린다.
# 사장님이 체크한 것만 pick-questions.yml 이 접수함에 넣는다.
# 정본 설계: docs/질문하기_파이프라인.md (단계 1·2, 계단 4)
# 필요한 Secrets: ANTHROPIC_API_KEY (draft-from-questions 와 같은 키)
on:
  schedule:
    - cron: "13 22 * * 0"   # 월요일 07:13 KST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: propose-questions
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Propose and open issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/propose_questions.py
