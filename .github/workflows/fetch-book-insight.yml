name: Fetch book insight

# 북인사이트(insight-7b3e9f2c/book-insight.html)가 읽는 데이터 2개
# (assets/data/book-insight.json, assets/data/ux-book-insight.json)를
# 매일 갱신한다. 두 책 다 이 저장소가 직접 예스24·알라딘·교보문고를
# 스크래핑한다(scripts/fetch_book_insight.py, Playwright 필요) -- 예전엔
# 「UX의 언어들」만 외부 저장소(cinaeng/ux-book-tracker)를 미러링했었는데,
# 그쪽 스키마 변경에 휘둘리는 걸 없애려고 같은 방식으로 통일했다.
#
# 스크립트 안에서 책 단위로 try/except가 감싸져 있어서, 한 책이 실패해도
# 다른 책 파일은 정상 저장된다 -- 그래서 커밋은 한 스텝으로 충분하다
# (두 파일 다 add 하되, 실패한 쪽은 애초에 파일 내용이 안 바뀌어 있어
# git diff에 안 걸린다).

# GitHub의 예약 실행(cron)은 "최선 노력" 방식이라 부하가 높으면 지연이 아니라
# 아예 건너뛰기도 한다(공식 커뮤니티 확인 -- 실제로 이 저장소에서 이틀 연속
# 자동 실행이 안 됐음). 그래서 이중 안전장치: cron 하루 3번(수집 스크립트가
# 날짜별 upsert라 여러 번 돌아도 안전) + cron-job.org 외부 트리거(새벽 5시대).
on:
  schedule:
    - cron: "41 21 * * *"  # 06:41 KST
    - cron: "23 2 * * *"   # 11:23 KST
    - cron: "37 8 * * *"   # 17:37 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-book-insight
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch book rankings (기획자의 질문법 + UX의 언어들)
        run: python scripts/fetch_book_insight.py

      - name: Commit if any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/book-insight.json assets/data/ux-book-insight.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 북 인사이트 자동 수집 [skip ci]"
            # 같은 시각에 다른 워크플로(GA4 등)가 먼저 푸시하면 non-fast-forward로
            # 거절된다. rebase 후 재시도한다.
            n=0
            until git push; do
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "push 3회 실패"; exit 1; fi
              git pull --rebase origin main
            done
          fi
