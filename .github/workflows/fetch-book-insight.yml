name: Fetch book insight

# 북인사이트(insight-7b3e9f2c/book-insight.html)가 읽는 데이터 2개를 매일
# 한 번씩 갱신한다.
#
#   1. 「UX의 언어들」 -- cinaeng/ux-book-tracker가 이미 매일 새벽 4시(KST)에
#      수집해둔 결과를 그대로 미러링만 한다 (재스크래핑 안 함).
#   2. 「기획자의 질문법」 -- 이 저장소에서 직접 예스24·알라딘·교보문고·
#      리디북스·밀리의서재를 수집한다 (scripts/fetch_book_insight.py, Playwright 필요).
#      같은 스크립트가 「UX의 언어들」의 보조 지표(cinaeng 쪽이 안 보는
#      카테고리 몇 개)도 같이 수집해 ux-book-extra.json에 남긴다.
#
# 두 스텝을 각각 독립적으로 커밋한다 -- 2번이 스크래핑 중 타임아웃/사이트
# 구조 변경으로 실패해도, 이미 끝난 1번의 미러링 커밋은 살아남아야 한다.

# GitHub의 예약 실행(cron)은 "최선 노력" 방식이라 부하가 높으면 지연이 아니라
# 아예 건너뛰기도 한다(공식 커뮤니티 확인 -- 실제로 이 저장소에서 이틀 연속
# 자동 실행이 안 됐음). 그래서 이중 안전장치: cron 하루 3번(수집 스크립트가
# 날짜별 upsert라 여러 번 돌아도 안전) + 로컬 PC 작업 스케줄러의
# workflow_dispatch 직접 호출(Documents\SimplifierSNSBot\trigger-github-workflows.ps1).
on:
  schedule:
    - cron: "41 21 * * *"  # 06:41 KST — cinaeng 쪽 04:00 KST 수집 이후 & 다른 예약과 분산
    - cron: "23 2 * * *"   # 11:23 KST
    - cron: "37 8 * * *"   # 17:37 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-book-insight
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror UX의 언어들 history
        run: python scripts/mirror_ux_book.py

      - name: Commit UX 미러 if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/ux-book-history.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: UX의 언어들 순위 미러링 [skip ci]"
            # 같은 시각에 다른 워크플로(GA4 등)가 먼저 푸시하면 non-fast-forward로
            # 거절된다(실제 발생 -- 실행 #2 실패 원인). rebase 후 재시도한다.
            n=0
            until git push; do
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "push 3회 실패"; exit 1; fi
              git pull --rebase origin main
            done
          fi

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch 기획자의 질문법 rankings (+ UX의 언어들 보조 지표)
        run: python scripts/fetch_book_insight.py

      - name: Commit 기획자의 질문법 snapshot if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/book-insight.json assets/data/ux-book-extra.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 기획자의 질문법 순위 + UX의 언어들 보조 지표 자동 수집 [skip ci]"
            # 동시 푸시 충돌 대비 rebase 재시도 (위 미러 커밋 스텝과 동일)
            n=0
            until git push; do
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "push 3회 실패"; exit 1; fi
              git pull --rebase origin main
            done
          fi
