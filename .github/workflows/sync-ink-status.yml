name: Sync ink status

# 잉크 초안 PR(log_assets/markdown/*.md, question_id 프런트매터 있음)이
# 열리거나 닫힐 때 접수함(Supabase questions) 상태를 옮긴다. LLM 호출 없음
# -- 초안 작성(Max 세션)과 접수함 상태 기록을 분리한다.
# 정본 설계: docs/질문하기_파이프라인.md
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "log_assets/markdown/**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install supabase
      - name: Determine changed files
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          # -c core.quotePath=false: 한글 등 비ASCII 파일명을 git이 기본으로
          # "log_ass\355..." 식 8진 이스케이프+따옴표로 감싸서 내보내는 걸 막는다.
          # 안 붙이면 파일명이 그대로 안 나와 question_id 매칭이 항상 실패한다
          # (2026-09-04 첫 실제 초안 PR에서 실측 -- "건너뜀"만 찍히고 조용히 넘어감).
          git -c core.quotePath=false diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > /tmp/changed.txt
          cat /tmp/changed.txt
      - name: Sync
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          export CHANGED_FILES="$(cat /tmp/changed.txt)"
          python scripts/sync_ink_status.py
