name: Draft from questions

# "심플리파이어에게 질문하기" 접수함(Supabase questions)의 '대기' 질문을 꺼내
# 클로드 API로 브랜드 보이스 초안을 쓰고, 초안 브랜치 + PR로 올린다.
# 정본 설계: docs/질문하기_파이프라인.md · 스크립트: scripts/draft_from_questions.py
#
# 왜 워커가 아니라 Actions인가: 시크릿·커밋 권한·실행 로그·재실행이 이미
# 여기 있고, 워커 코드는 저장소 밖(수동 편집)이라 이력이 없다. 질문은
# 실시간일 필요가 없어(사장님이 PR에서 검토하는 게 병목) 2시간 주기면 충분.
#
# 필요한 Secrets: ANTHROPIC_API_KEY (신규), SUPABASE_URL·SUPABASE_SERVICE_KEY (기존).
# PR은 GITHUB_TOKEN으로 만든다 — 이 토큰이 만든 PR에는 build-check가 자동으로
# 돌지 않는다(GitHub 규칙). 초안 PR은 사장님이 직접 읽고 병합하는 관문이라
# 지금은 그대로 두고, 자동 검사가 필요해지면 PAT(DRAFT_PR_TOKEN)로 바꾼다.
on:
  schedule:
    - cron: "17 */2 * * *"   # 2시간마다 (분을 0으로 두면 GitHub 혼잡 시간대라 자주 밀린다)
  workflow_dispatch:
    inputs:
      max_drafts:
        description: "이번 실행에 처리할 최대 건수"
        default: "3"

permissions:
  contents: write
  pull-requests: write

# 겹쳐 돌면 같은 질문을 두 번 잡을 수 있으니 한 번에 하나만.
concurrency:
  group: draft-from-questions
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic supabase

      - name: Draft and open PRs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.DRAFT_PR_TOKEN || secrets.GITHUB_TOKEN }}
          MAX_DRAFTS: ${{ github.event.inputs.max_drafts || '3' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/draft_from_questions.py
