name: Build check

# GitHub Pages 자체 빌드(Build with Jekyll)는 실패해도 로그가 비공개라
# 원인을 바로 못 봄 -- 2026-08-29에 그것 때문에 1시간 넘게 배포가
# 멈췄던 걸 뒤늦게 알았다. 이 워크플로는 GitHub Pages와 똑같은 gem 구성
# (Gemfile의 github-pages gem)으로 미리 빌드해서, 실패하면 Actions 탭에
# 몇 분 안에 빨간 X로 바로 보이게 한다.
#
# pull_request 트리거는 커밋 교통정리(PR + 자동병합) 도입분(2026-08-29):
# main 브랜치 보호 룰셋이 이 워크플로의 build 잡을 필수 검사로 요구하므로,
# PR이 열리면 여기서 미리 빌드가 돌고 통과해야만 자동 병합된다.
#
# 2026-08-30에 "노출 범위 변경 검사"를 같은 잡에 넣었다. 별도 잡으로 두면
# 룰셋에 필수 검사로 따로 등록해야 병합을 막는데, 그 등록을 잊으면 검사가
# 있어도 안 막는다 -- 그래서 이미 필수인 이 잡 안에 넣었다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 노출 검사가 base 브랜치와 비교해야 해서 전체 히스토리가 필요하다.
          fetch-depth: 0

      # 빌드보다 먼저 돌린다 -- 실패가 빠를수록 고치기 싸다.
      # PR에서만 검사한다: 사장님 본인의 글 발행 커밋은 PR 없이 main으로
      # 직행하는 의도된 예외라(CLAUDE.md 커밋 교통정리 4항), 거기까지 막으면
      # 평상 업무가 멈춘다.
      - name: 노출 범위 변경 검사
        if: github.event_name == 'pull_request'
        env:
          # PR 본문을 셸에 끼워넣지 않고 환경변수로 넘긴다(임의 실행 방지).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_exposure_changes.py "origin/${{ github.base_ref }}"

      - name: Set up Ruby (GitHub Pages와 동일한 gem 구성)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll (GitHub Pages와 같은 방식)
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --strict_front_matter -d /tmp/_site_check

      - name: 빌드 결과 요약
        if: always()
        run: |
          if [ -f /tmp/_site_check/index.html ]; then
            count=$(find /tmp/_site_check -name "*.html" | wc -l)
            echo "빌드 성공 -- HTML 파일 ${count}개 생성됨"
          else
            echo "빌드 실패 또는 index.html이 생성되지 않음"
          fi
