name: Publish log pipeline

# Decap CMS(admin/)로 새 글을 커밋하면(또는 log_assets/markdown 아래 파일을
# 직접 고치면) 여기서 자동으로:
#   1. 새 글에 순번/date_string/카테고리 링크 스크립트/이전글-다음글 자리 채우기
#   2. 이전글/다음글 링크 재계산 (sync_all.py)
#   3. log.html 카드 그리드에 새 글 카드 추가
#   4. 썸네일 매핑·posts.json 갱신
# 을 실행하고, 바뀐 파일이 있으면 같은 브랜치에 커밋해서 되돌려 놓습니다.
# 기존 글은 절대 건드리지 않도록 각 스크립트가 변경 없는 파일엔 손을 대지
# 않는 것을 전제로 만들어졌습니다(스크립트 안 주석 참고).

on:
  push:
    branches: [main]
    paths:
      - "log_assets/markdown/**"
      # 이미지만 올라와도 돌게 해서, 파일명에 특수문자가 섞인 커버 이미지를
      # sanitize_cover_images.py가 잡아낼 수 있게 합니다(바뀔 게 없으면 커밋 안 함).
      - "log_assets/images/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-pipeline
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Normalize any newly-added posts
        run: python scripts/normalize_new_post.py

      - name: Strip url-breaking characters from cover image filenames
        run: python scripts/sanitize_cover_images.py

      - name: Rebuild prev/next links for all posts
        run: python sync_all.py

      - name: Add log.html cards for any new posts
        run: python scripts/add_new_log_cards.py

      - name: Refresh thumbnail mapping + posts.json
        run: python fix_thumb_mapping.py

      # posts.json이 갱신된 뒤에 돌아야 발행 목록을 기준으로 맞출 수 있습니다.
      - name: Sync sitemap.xml + drop any un-published posts
        run: python scripts/sync_sitemap_and_drafts.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # log_assets/images도 포함해야 합니다 -- sanitize_cover_images.py가
          # 이미지 파일 이름을 바꾸는데, 이걸 빼면 front matter만 새 이름으로
          # 커밋되고 실제 파일 이름은 옛날 그대로라 링크가 깨집니다.
          git add log_assets/markdown log_assets/images log.html assets/data/posts.json sitemap.xml
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: auto-regenerate log pipeline output [skip ci]"
            git push
          fi
