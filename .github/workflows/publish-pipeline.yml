name: Publish log pipeline

# Decap CMS(admin/)로 새 글을 커밋하면(또는 log_assets/markdown 아래 파일을
# 직접 고치면) 여기서 자동으로:
#   1. 새 글에 순번/date_string/카테고리 링크 스크립트/이전글-다음글 자리 채우기
#   2. 커버 이미지 파일명의 특수문자 제거
#   3. 이전글/다음글 링크 재계산 (sync_all.py)
#   4. log.html 카드 그리드에 새 글 카드 추가
#   5. 썸네일 매핑·posts.json(assets/data/, _data/ 둘 다) 갱신
#      -- _data/posts.json은 필러 페이지(log/*.html)가 Jekyll
#      site.data.posts로 읽는 사본. assets/data/posts.json과 완전히
#      같은 내용으로 매번 다시 써서, 새 글이 필러 페이지에도 자동으로
#      반영되게 한다(예전엔 수동 스냅샷이라 새 글이 안 잡혔음).
#   6. sitemap.xml 동기화
# 을 실행하고, 바뀐 파일이 있으면 같은 브랜치에 커밋해서 되돌려 놓습니다.
# 기존 글은 절대 건드리지 않도록 각 스크립트가 변경 없는 파일엔 손을 대지
# 않는 것을 전제로 만들어졌습니다(스크립트 안 주석 참고) -- 이 전제 덕분에
# 아래 재시도 루프에서 스크립트를 몇 번이고 다시 돌려도 안전합니다.

on:
  push:
    branches: [main]
    paths:
      - "log_assets/markdown/**"
      # 이미지만 올라와도 돌게 해서, 파일명에 특수문자가 섞인 커버 이미지를
      # sanitize_cover_images.py가 잡아낼 수 있게 합니다(바뀔 게 없으면 커밋 안 함).
      - "log_assets/images/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-pipeline
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate and commit (retries on push races)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 왜 필요한가
          # ----------
          # 예전에는 스크립트를 한 번만 돌리고 마지막에 딱 한 번 git push를
          # 했습니다. 그런데 이 워크플로가 계산하는 동안 다른 사람/세션이
          # 먼저 main에 푸시해버리면, 우리 push는 "뒤처진 상태에서 밀어붙이는"
          # 게 되어 그냥 거부당하고(non-fast-forward), 애써 계산한 결과가
          # 통째로 버려집니다. 실제로 이런 일이 있었습니다: 10단계 전부
          # 성공했는데 마지막 커밋 단계만 실패해서 새 글 하나가 사이트에
          # 한동안 안 올라갔던 사고.
          #
          # 고친 방식: push가 거부되면, 우리가 만든 변경을 전부 버리고
          # origin/main의 최신 상태로 다시 맞춘 뒤, 스크립트를 처음부터 다시
          # 돌립니다. rebase나 병합을 시도하지 않는 이유는, log.html/
          # posts.json/sitemap.xml은 이 파이프라인이 매번 "전체를 다시
          # 계산해서 새로 쓰는" 파일이라 git이 줄 단위로 병합하려 들면
          # 오히려 깨지기 쉽기 때문입니다. 최신 소스로 처음부터 다시
          # 계산하는 쪽이 항상 정답과 같은 결과를 냅니다(스크립트가
          # 멱등적이라 몇 번을 다시 돌려도 같은 입력엔 같은 출력).

          MAX_ATTEMPTS=5

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::시도 $attempt / $MAX_ATTEMPTS"

            python scripts/normalize_new_post.py
            python scripts/sanitize_cover_images.py
            python sync_all.py
            python scripts/add_new_log_cards.py
            python fix_thumb_mapping.py
            # posts.json이 갱신된 뒤에 돌아야 발행 목록을 기준으로 맞출 수 있습니다.
            python scripts/sync_sitemap_and_drafts.py

            # log_assets/images도 포함해야 합니다 -- sanitize_cover_images.py가
            # 이미지 파일 이름을 바꾸는데, 이걸 빼면 front matter만 새 이름으로
            # 커밋되고 실제 파일 이름은 옛날 그대로라 링크가 깨집니다.
            git add log_assets/markdown log_assets/images log.html assets/data/posts.json _data/posts.json sitemap.xml

            if git diff --cached --quiet; then
              echo "커밋할 변경 없음"
              echo "::endgroup::"
              exit 0
            fi

            git commit -q -m "chore: auto-regenerate log pipeline output [skip ci]"

            if git push; then
              echo "성공 (시도 $attempt)"
              echo "::endgroup::"
              exit 0
            fi

            echo "push 거부됨 -- 그 사이 다른 푸시가 먼저 들어온 것으로 보입니다."
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::${MAX_ATTEMPTS}번 시도 후에도 push 실패. 수동 확인이 필요합니다."
              echo "::endgroup::"
              exit 1
            fi

            echo "origin/main 최신 상태로 다시 맞추고 재계산합니다..."
            git fetch origin main
            git reset --hard origin/main
            # 동시에 여러 러너가 같은 순간에 재시도하면 계속 부딪힐 수 있어
            # 살짝 흩어서(0~5초) 충돌 확률을 낮춥니다.
            sleep "$(( (RANDOM % 6) ))"
            echo "::endgroup::"
          done
