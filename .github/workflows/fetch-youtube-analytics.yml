name: Fetch YouTube analytics

# 유튜브 채널의 시청 지속률·유입 경로 등 비공개 분석 수치를 YouTube Analytics API(OAuth, 읽기 전용)로
# 가져온다(2026-09-21). 설계와 한계(노출수·클릭률은 API에 없음)는 scripts/fetch_youtube_analytics.py 머리말.
#
# 필요한 저장소 Secret 3개는 scripts/youtube_analytics_auth.py가 동의 화면 통과 직후 직접 저장한다
# (YT_ANALYTICS_CLIENT_ID, YT_ANALYTICS_CLIENT_SECRET, YT_ANALYTICS_REFRESH_TOKEN).
#
# 지금은 수동 실행 전용이고 기본값은 "커밋 안 함"이다(로그에 개수만 출력). 이 저장소는 공개라서
# 분석 수치를 assets/data에 올릴지(다른 수집 파일과 같은 방식) 비공개 저장소로 보낼지 사장님이 정한 뒤
# commit=true와 예약 실행을 연다. 첫 실행 성공 증거를 확인한 뒤 감시 대장(scripts/ops/jobs.toml)에 등록할 것.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "결과 JSON을 저장소에 커밋할지(공개 저장소이므로 기본 꺼짐)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-youtube-analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch YouTube analytics
        env:
          YT_ANALYTICS_CLIENT_ID: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
        run: python scripts/fetch_youtube_analytics.py

      - name: Commit if requested
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/youtube-analytics.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 유튜브 분석 자동 수집 [skip ci]"
            n=0
            until git push; do
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "push 3회 실패"; exit 1; fi
              git pull --rebase origin main
            done
          fi
