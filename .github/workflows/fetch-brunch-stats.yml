name: Fetch Brunch stats

# 브런치 공개 프로필 페이지에서 팔로워 수·발행 글 수를 매일 한 번
# 가져와서 assets/data/sns-insight.json에 커밋한다. 로그인이나 API
# 키가 필요 없다 -- 공개 페이지 HTML 안에 그대로 들어있는 값을 읽을
# 뿐이다(scripts/fetch_brunch_stats.py 상단 주석 참고).
#
# 나머지 SNS(LinkedIn/Facebook/Instagram/Threads/네이버블로그/리멤버/
# 로켓펀치)는 전부 로그인 세션이 있어야만 값이 보여서, 이 방식으로는
# 못 가져온다 -- 대신 _sns-extension/ 크롬 확장이 그쪽을 담당한다.

on:
  schedule:
    - cron: "27 21 * * *"  # 매일 06:27 KST (다른 예약 작업들과 정각이 겹치지 않게 분산)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-brunch-stats
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Brunch profile stats
        run: python scripts/fetch_brunch_stats.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/sns-insight.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 브런치 SNS 인사이트 자동 기록 [skip ci]"
            git push
          fi
