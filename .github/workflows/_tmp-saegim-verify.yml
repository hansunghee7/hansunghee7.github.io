name: (1회성) 새김 guide_views 검증

# 새김 v0.4(lookup·조회수 분리)를 실제 Supabase에 대해 검증하는 1회성
# 워크플로. 확인 끝나면 이 파일과 scripts/_tmp_saegim_verify.py를 삭제한다
# — simplifier-saegim README의 2026-09-04 검증과 같은 패턴.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/hi-note-8v61js
    paths:
      - .github/workflows/_tmp-saegim-verify.yml
      - scripts/_tmp_saegim_verify.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install supabase
      - name: Verify guide_views + lookup against real Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/_tmp_saegim_verify.py
