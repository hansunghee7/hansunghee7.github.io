name: Relay local to cloud

# docs/진행상황.md에 로컬 세션(탐/마야) 결과가 push되면, Claude Routine
# API 트리거(/fire)를 직접 호출해서 Cloud Claude Routine("로컬→클라우드
# 릴레이 처리 (repository_dispatch 전용)", trig_01FuGfrmYB3zw2ToQXWknXct)을
# 곧바로 깨운다. 사람이 복붙할 필요 없음.
#
# (2026-09-17, 탐(로컬)) 원래는 GitHub repository_dispatch로 이 Routine을
# 깨우려 했으나, 공식 문서(code.claude.com/docs/en/routines) 확인 결과
# Claude Routine의 GitHub 트리거는 Pull request/Release만 지원하고
# repository_dispatch는 지원 대상이 아님을 확인(실측: dispatch는 204로
# 성공했지만 Routine은 한 번도 안 깨어남). 대신 공식 지원되는 API
# 트리거(/fire endpoint, CLAUDE_ROUTINE_TOKEN)로 전환 — 실측 완료:
# /fire 호출 → HTTP 200 → 실제 Routine 세션 실행 → 진행상황.md 커밋까지
# 확인함.
#
# 루프 가드(author.email == noreply@anthropic.com 커밋은 skip)는 실제
# Routine 커밋으로 재검증 완료 — 그대로 유지.

#
# (2026-09-24, 탐) 자동 트리거 중지, 수동 실행만 남김. 9/18 이후 실제
# 릴레이 요청(📥 탐(로컬) → 탐(클라우드))은 0건인데 9/20 이후 이 워크플로가
# 루틴을 52번 깨웠고, 그 중 여러 건이 Bash 승인 대기로 사장님 화면에 쌓임.
# 세션 간 전달은 우편함(solar-bible mailbox)으로 대체됨. 다시 켜려면 아래
# push 블록의 주석을 풀면 된다.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths:
  #     - "docs/진행상황.md"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event.head_commit.author.email != 'noreply@anthropic.com'
    steps:
      - name: Claude Routine /fire API 호출
        env:
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: |
          echo '{"text":"docs/진행상황.md 변경, commit ${{ github.sha }}"}' > body.json
          status=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            "https://api.anthropic.com/v1/claude_code/routines/trig_01FuGfrmYB3zw2ToQXWknXct/fire" \
            -d @body.json)
          echo "/fire 응답 코드: $status"
          cat /tmp/resp.json || true
          if [ "$status" != "200" ]; then
            echo "::error::/fire 호출 실패 (HTTP $status) -- 위 응답 본문 참고"
            exit 1
          fi
          if ! grep -q '"type":"routine_fire"' /tmp/resp.json || ! grep -q '"claude_code_session_id"' /tmp/resp.json; then
            echo "::error::HTTP 200이지만 routine_fire 형식이 아님 -- 위 응답 본문 참고"
            exit 1
          fi
