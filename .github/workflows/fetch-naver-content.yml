name: Fetch Naver content

# "신기한 아파트사전" 채널의 네이버 블로그 게시물 조회수를 매일 수집해
# assets/data/naver-content.json에 커밋한다. 비공개 대시보드
# (insight-7b3e9f2c/content-insight.html)가 이 파일을 읽어서 화면에 그린다.
#
# 네이버 클립은 여기서 안 다룬다 -- 로그인 세션을 요구하는 API라 이
# 워크플로(로그인 없는 헤드리스 브라우저)로는 못 읽는다(2026-09-01 확인).
# 대신 _sns-extension(사장님이 실제 로그인해 쓰는 크롬 확장)이 클립 채널
# 요약 수치를 같은 파일의 clip_channel 키에 직접 커밋한다.
#
# 로그인 없이 보이는 공개 데이터라 Secret이 따로 필요 없다(fetch_sns_public.py
# 와 같은 방식 -- Playwright로 공개 페이지 직접 읽기).
#
# GitHub의 예약 실행(cron)은 "최선 노력" 방식이라 부하가 높으면 지연이 아니라
# 아예 건너뛰기도 한다(다른 수집 워크플로에서 실제로 여러 번 확인된 문제).
# 이 워크플로가 새벽 예약을 반복해서 놓치면 같은 방식(cron-job.org, 매일
# 05:45 KST 전후)을 추가할 것 -- docs/클라우드_이사_가이드.md 3절 참고.
on:
  schedule:
    - cron: "43 20 * * *"  # 05:43 KST -- 새벽 수집 순번 7 (다른 수집 워크플로 뒤)
    - cron: "43 10 * * *"  # 19:43 KST (아침 실행 누락 대비 재시도)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-naver-content
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch Naver blog content insight
        run: python scripts/fetch_naver_content.py

      - name: Commit if any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/naver-content.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 네이버 블로그 콘텐츠 자동 수집 [skip ci]"
            # 같은 시각에 다른 워크플로가 먼저 푸시하면 non-fast-forward로
            # 거절된다. rebase 후 재시도한다(다른 수집 워크플로와 동일).
            n=0
            until git push; do
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "push 3회 실패"; exit 1; fi
              git pull --rebase origin main
            done
          fi
