name: (임시) 새김 MCP 백엔드 연결 확인

# 이 워크플로는 일회성 진단용입니다 — 클로드 코드 세션의 네트워크 정책이
# Supabase를 직접 못 붙게 막아서, 이미 이 저장소에 있는 SUPABASE_URL/
# SUPABASE_SERVICE_KEY 시크릿(잉크 파이프라인이 쓰는 것과 동일)을 빌려
# GitHub Actions 안에서만 한 번 검증한다. 확인 끝나면 이 파일은 삭제한다
# — simplifier-saegim(별도 비공개 저장소)의 정식 코드를 이 공개 저장소로
# 옮기지 않기 위해, 최소한의 검증 로직만 이 안에 직접 인라인으로 썼다.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install supabase
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 <<'PYEOF'
          import os, re, pathlib
          from supabase import create_client

          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_KEY"])

          # 1) 테이블 존재 확인
          try:
              sb.table("guide_sections").select("*").limit(1).execute()
              sb.table("guide_citations").select("*").limit(1).execute()
              print("[OK] guide_sections / guide_citations 테이블 접근 확인")
          except Exception as e:
              print("[FAIL] 테이블 조회 실패 — supabase/guide_sections.sql을 먼저 실행했는지 확인:", e)
              raise SystemExit(1)

          # 2) docs/UX_GUIDE.md 절을 심는다 (saegim.py의 HEADING_RE/파싱 규칙과 동일한 로직을
          #    이 파일 안에 직접 인라인 — simplifier-saegim 코드를 공개 저장소로 옮기지 않기 위함)
          HEADING_RE = re.compile(r"^(#{2,3})\s+(\d+(?:\.\d+)?)\.?\s+(.+?)[ \t]*$", re.MULTILINE)
          ID_RE = re.compile(r"<!--\s*id:\s*([0-9a-f]{2,8})\s*-->\s*$")
          EXEMPT = "⚠️상시"

          text = pathlib.Path("docs/UX_GUIDE.md").read_text(encoding="utf-8")
          matches = list(HEADING_RE.finditer(text))
          rows = []
          for i, m in enumerate(matches):
              number, rest = m.group(2), m.group(3)
              idm = ID_RE.search(rest)
              if not idm:
                  print(f"[WARN] {number}절에 id 없음 — 건너뜀")
                  continue
              title = rest[: idm.start()].rstrip()
              exempt = EXEMPT in title
              title = title.replace(EXEMPT, "").strip()
              start, end = m.end(), (matches[i + 1].start() if i + 1 < len(matches) else len(text))
              rows.append({
                  "doc": "UX_GUIDE",
                  "section_id": idm.group(1),
                  "section_number": number,
                  "title": title,
                  "body": text[start:end].strip(),
                  "exempt": exempt,
              })

          sb.table("guide_sections").upsert(rows, on_conflict="doc,section_id").execute()
          print(f"[OK] {len(rows)}개 절을 UX_GUIDE로 심음")

          # 3) list_sections 확인
          sections = sb.table("guide_sections").select("*").eq("doc", "UX_GUIDE").execute().data
          print(f"[OK] list_sections: {len(sections)}개 절 조회됨")

          # 4) cite 왕복 확인
          test_id = sections[0]["section_id"]
          sb.table("guide_citations").insert({
              "doc": "UX_GUIDE",
              "section_id": test_id,
              "note": "MCP 서버 내부 베타 연결 테스트 (탐, GitHub Actions 대행 실행)",
          }).execute()
          count = len(
              sb.table("guide_citations").select("section_id")
              .eq("doc", "UX_GUIDE").eq("section_id", test_id).execute().data
          )
          print(f"[OK] cite 왕복 확인: {test_id} 인용 {count}건")
          print("[DONE] 새김 MCP 백엔드(Supabase) 연결 검증 완료")
          PYEOF
